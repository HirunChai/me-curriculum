<style>
/* Layout: workbench — two-level nav (phase → step), dense working panels; drafting-ink teal accent on graphite neutrals */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2421; --muted:#5d6762; --line:#d9dedb; --soft:#eef1ef;
  --accent:#0f6b63; --accent-soft:#dcefec; --pass:#2f7d3a; --pass-bg:#e3f2e4; --warn:#9a6200; --warn-bg:#fbefd6; --fail:#b3261e; --fail-bg:#fbe3e1;
  --bar:#0f6b63; --bar-over:#b3261e;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2220; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2f3835; --soft:#232a28;
  --accent:#5cc2b6; --accent-soft:#1d3a36; --pass:#7fd08a; --pass-bg:#1e3322; --warn:#f0b54a; --warn-bg:#3a2e14; --fail:#ff8a80; --fail-bg:#3d1f1d;
  --bar:#5cc2b6; --bar-over:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2220; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2f3835; --soft:#232a28;
  --accent:#5cc2b6; --accent-soft:#1d3a36; --pass:#7fd08a; --pass-bg:#1e3322; --warn:#f0b54a; --warn-bg:#3a2e14; --fail:#ff8a80; --fail-bg:#3d1f1d;
  --bar:#5cc2b6; --bar-over:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}

/* PLO list + mind map v2 */
.plo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.plo-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;gap:12px;align-items:flex-start}
.plo-no{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1.1;text-align:center}
.plo-card .pt{font-size:14px;line-height:1.55}
.plo-card .pm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.sv-go{margin-top:6px;font-weight:600;color:var(--accent)}.sv-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;margin-top:12px}.sv-left{margin:0}.sv-tabs{display:flex;gap:4px;background:var(--soft);border-radius:8px;padding:3px;margin-bottom:8px;flex-wrap:wrap}.sv-tabs button{flex:1;border:0;background:none;padding:6px 8px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;color:inherit}.sv-tabs button.on{background:var(--panel,#fff);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sv-map{width:100%;max-height:640px;display:block}.sv-area{stroke:#fff;stroke-width:1.2;cursor:pointer}.sv-area:hover{filter:brightness(.92)}.sv-area.on{stroke:#333;stroke-width:3}.sv-bd{fill:none;stroke:#fff;stroke-width:1}.sv-pin path{fill:#b3313a;stroke:#fff;stroke-width:2}.sv-pin.on path{fill:#1f3b73}.sv-pin text{fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:middle;font-family:sans-serif;pointer-events:none}.sv-pin{pointer-events:none}
.sv-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;align-items:center}.sv-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}.sv-right{display:grid;gap:10px;align-content:start}.sv-right .panel{margin:0}.sv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sv-stats .panel{text-align:center;display:grid;gap:2px}.sv-stats b{font-size:24px}.sv-reg{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:6px;font-size:13.5px}.sv-reg div{display:flex;justify-content:space-between;gap:6px}.sv-reg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.sv-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer;color:inherit}.sv-chip.on{background:#1f3b73;color:#fff;border-color:#1f3b73}.sv-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sv-li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0;font-size:13.5px}
@media (max-width:820px){.sv-wrap,.sv-cols{grid-template-columns:1fr}}
.mmx{--k-meet:#c0583a;--k-pol:var(--accent);--k-acc:#6a5acd;--k-sur:#d08a12;--k-wait:#8a938f;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.75fr) minmax(0,1fr);gap:18px 64px;align-items:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mmx{--k-meet:#f0906e;--k-acc:#a99bf5;--k-sur:#7d8783}}
:root[data-theme="dark"] .mmx{--k-meet:#f0906e;--k-acc:#a99bf5;--k-sur:#7d8783}
.mmx svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mmx path{fill:none;stroke-linecap:round;opacity:.55;transition:opacity .15s}
.mmx.hl path{opacity:.08}.mmx.hl path.on{opacity:.95}
.mmx-col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.mmx-src{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,border-color .15s}
.mmx-src:hover,.mmx-src.on{border-color:var(--kc);box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 18%,transparent)}
.mmx-src .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.mmx-src .ic{width:10px;height:10px;border-radius:50%;background:var(--kc);flex:none}
.mmx-src.pending .ic{background:transparent;border:2px dashed var(--kc)}
.mmx-src .bd{font-size:12px;line-height:1.5;color:var(--muted);margin-top:4px}
.mmx-src .bd b{color:var(--ink);font-weight:600}
.mmx-hub{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.mmx-hub .ttl{text-align:center;font-weight:700;font-size:14px}
.mmx-plo{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;font-size:12.5px;cursor:default;transition:border-color .15s}
.mmx-plo.on{border-color:var(--accent)}
.mmx-plo .n{flex:none;background:var(--accent);color:var(--panel);border-radius:999px;padding:2px 8px;font-weight:700;font-size:11.5px}
.mmx-plo .c{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
@media (max-width:820px){.mmx{grid-template-columns:1fr;gap:12px}.mmx svg{display:none}.mmx-hub{order:-1}}
/* org chart ข1 */
.org{--t-ME:#2f5f9e;--t-EV:#b4552a;--t-CE:#2f7d3a;position:relative;padding:4px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .org{--t-ME:#8fb4ea;--t-EV:#f0a37c;--t-CE:#7fd08a}}
:root[data-theme="dark"] .org{--t-ME:#8fb4ea;--t-EV:#f0a37c;--t-CE:#7fd08a}
.org-top{max-width:560px;margin:0 auto;text-align:center;border:2px solid var(--accent);border-radius:10px;background:var(--accent-soft);padding:12px 16px}
.org-top b{display:block;font-size:17px;color:var(--ink)}
.org-core{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 0 0}

const DESC0={"TE-1": ["เลือกเรียนรายวิชาใดก็ได้ในกลุ่มวิชาชีพเลือก ไม่น้อยกว่า 3 หน่วยกิต โดยนักศึกษาทุกแขนงวิชาเลือกเรียนร่วมกันได้", "Any course from the professional elective group, not less than 3 credits; open to students of all tracks."], "4-113-310": ["หลักการและข้อกำหนดการดัดแปลงยานยนต์สันดาปภายในเป็นยานยนต์ไฟฟ้า กฎหมายและมาตรฐานของกรมการขนส่งทางบก การประเมินความเป็นไปได้ การเลือกมอเตอร์ ตัวควบคุม และแบตเตอรี่ การคำนวณสมรรถนะและน้ำหนัก การออกแบบแท่นยึดและการติดตั้งชุดขับเคลื่อน ระบบไฟฟ้าแรงดันสูงและความปลอดภัย ระบบอัดประจุ การทดสอบและตรวจสภาพ ปฏิบัติการดัดแปลงยานยนต์จริง", "Principles and requirements for converting internal combustion engine vehicles to electric vehicles; Department of Land Transport regulations and standards; feasibility assessment; selection of motor, controller and battery; performance and weight calculations; design of mounts and drivetrain installation; high-voltage electrical systems and safety; charging systems; testing and inspection; hands-on vehicle conversion practice."], "4-116-311": ["ระบบและกลยุทธ์การบำรุงรักษา การบำรุงรักษาเชิงแก้ไข เชิงป้องกัน เชิงพยากรณ์ และการบำรุงรักษาทวีผลแบบทุกคนมีส่วนร่วม (TPM) ความเชื่อถือได้และการวิเคราะห์ความขัดข้อง FMEA และการวิเคราะห์รากเหตุ การตรวจวัดสภาพเครื่องจักรด้วยการสั่นสะเทือน เทอร์โมกราฟี และการวิเคราะห์น้ำมันหล่อลื่น การหล่อลื่น การบำรุงรักษาแบริ่ง ระบบส่งกำลัง และปั๊ม ตัวชี้วัด MTBF MTTR และ OEE การวางแผนและบริหารต้นทุนการบำรุงรักษา ระบบบริหารงานบำรุงรักษาด้วยคอมพิวเตอร์ และความปลอดภัยในงานบำรุงรักษา", "Maintenance systems and strategies: corrective, preventive and predictive maintenance and total productive maintenance (TPM); reliability and failure analysis: FMEA and root cause analysis; condition monitoring by vibration, thermography and oil analysis; lubrication; maintenance of bearings, power transmissions and pumps; MTBF, MTTR and OEE indicators; maintenance planning and cost management; computerized maintenance management systems; safety in maintenance work."], "4-116-409": ["หลักการความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน กฎหมายและมาตรฐานความปลอดภัยที่เกี่ยวข้อง สาเหตุและการวิเคราะห์อุบัติเหตุ การชี้บ่งอันตรายและการประเมินความเสี่ยง ความปลอดภัยของเครื่องจักร งานไฟฟ้า อัคคีภัย และสารเคมี การล็อกและติดป้าย อุปกรณ์ป้องกันอันตรายส่วนบุคคล การตรวจวัดสภาพแวดล้อมในการทำงาน การยศาสตร์ ระบบการจัดการอาชีวอนามัยและความปลอดภัย ISO 45001 การตอบสนองภาวะฉุกเฉิน มลพิษจากกระบวนการผลิตและการใช้พลังงาน กฎหมายสิ่งแวดล้อมและการประเมินผลกระทบสิ่งแวดล้อมเบื้องต้น ระบบการจัดการสิ่งแวดล้อม ISO 14001 การพัฒนาที่ยั่งยืนและเป้าหมายการพัฒนาที่ยั่งยืน (SDGs) การประเมินวัฏจักรชีวิตและคาร์บอนฟุตพริ้นท์เบื้องต้น เศรษฐกิจหมุนเวียน", "Principles of occupational safety, health and working environment; related safety laws and standards; causes and analysis of accidents; hazard identification and risk assessment; machine, electrical, fire and chemical safety; lockout/tagout; personal protective equipment; workplace environment measurement; ergonomics; occupational health and safety management system ISO 45001; emergency response; pollution from manufacturing processes and energy use; environmental laws and introduction to environmental impact assessment; environmental management system ISO 14001; sustainable development and the Sustainable Development Goals (SDGs); introduction to life cycle assessment and carbon footprint; circular economy."], "4-116-310": ["ระเบียบวิธีเชิงตัวเลขสำหรับรากของสมการ ระบบสมการเชิงเส้น การประมาณค่าในช่วง การหาอนุพันธ์และปริพันธ์เชิงตัวเลข และสมการเชิงอนุพันธ์ ความคลาดเคลื่อนและการลู่เข้า หลักการไฟไนต์เอลิเมนต์เบื้องต้น การสร้างแบบจำลองและวิเคราะห์ความเค้นและการถ่ายเทความร้อนด้วยโปรแกรม CAE การสร้างเมชและการตรวจสอบความถูกต้องของผลจำลอง", "Numerical methods for roots of equations, systems of linear equations, interpolation, numerical differentiation and integration, and differential equations; errors and convergence; introduction to the finite element method; modeling and analysis of stress and heat transfer with CAE software; meshing and validation of simulation results."], "4-112-412": ["การทดลองด้านพลังงานและสิ่งแวดล้อม การทดสอบสมรรถนะแผงเซลล์แสงอาทิตย์และระบบผลิตไฟฟ้าพลังงานแสงอาทิตย์ การทดสอบกังหันลมจำลอง การทดสอบปั๊มความร้อนและระบบกักเก็บพลังงาน การทดสอบการผลิตก๊าซชีวภาพ การวิเคราะห์การเผาไหม้และการวัดมลพิษจากไอเสีย การทดสอบประสิทธิภาพระบบควบคุมฝุ่นหรือระบบบำบัดน้ำเสียแบบจำลอง การตรวจวิเคราะห์การใช้พลังงานในอาคาร การออกแบบการทดลอง การวิเคราะห์ความไม่แน่นอนของการวัด และการเขียนรายงานเชิงเทคนิค", "Energy and environmental experiments; performance testing of photovoltaic modules and solar power systems; model wind turbine tests; heat pump and energy storage tests; biogas production tests; combustion analysis and exhaust emission measurement; efficiency tests of model particulate control or wastewater treatment systems; building energy audit; design of experiments; measurement uncertainty analysis; technical report writing."], "4-113-402": ["การทดลองเกี่ยวกับยานยนต์ไฟฟ้าและยานยนต์พลังงานใหม่ การทดสอบสมรรถนะและประสิทธิภาพของมอเตอร์และอินเวอร์เตอร์บนแท่นทดสอบไดนาโมมิเตอร์ การทดสอบความจุ ความต้านทานภายใน และอุณหภูมิของเซลล์และแพ็กแบตเตอรี่ การทดสอบการอัดประจุแบบกระแสสลับและกระแสตรง การวัดการใช้พลังงานและระยะทางวิ่งตามวัฏจักรการขับขี่ การทดสอบระบบจัดการความร้อนและระบบปรับอากาศ การเก็บข้อมูลผ่านเครือข่าย CAN การออกแบบการทดลอง การวิเคราะห์ความไม่แน่นอนของการวัด และการเขียนรายงานเชิงเทคนิค", "Experiments on electric and new energy vehicles; performance and efficiency testing of motors and inverters on dynamometer test benches; capacity, internal resistance and temperature tests of battery cells and packs; AC and DC charging tests; energy consumption and range measurement over driving cycles; testing of thermal management and air-conditioning systems; data acquisition via CAN network; design of experiments; measurement uncertainty analysis; technical report writing."], "4-112-318": ["ก๊าซเรือนกระจกและการเปลี่ยนแปลงสภาพภูมิอากาศ นโยบายและกลไกลดก๊าซเรือนกระจกของประเทศไทยและสากล การคำนวณคาร์บอนฟุตพริ้นท์ขององค์กรตามขอบเขตที่ 1 2 และ 3 ตามแนวทางขององค์การบริหารจัดการก๊าซเรือนกระจก (อบก.) และ ISO 14064-1 ค่าสัมประสิทธิ์การปล่อย คาร์บอนฟุตพริ้นท์ของผลิตภัณฑ์และการประเมินวัฏจักรชีวิต (LCA) มาตรการลดการปล่อยจากการใช้พลังงาน การชดเชยคาร์บอน คาร์บอนเครดิตและโครงการ T-VER การทวนสอบ และการวางแผนสู่ความเป็นกลางทางคาร์บอนและการปล่อยสุทธิเป็นศูนย์", "Greenhouse gases and climate change; Thai and international mitigation policies and mechanisms; organizational carbon footprint for scopes 1, 2 and 3 following Thailand Greenhouse Gas Management Organization (TGO) guidelines and ISO 14064-1; emission factors; product carbon footprint and life cycle assessment (LCA); emission reduction measures from energy use; carbon offsetting, carbon credits and T-VER projects; verification; planning toward carbon neutrality and net zero."], "4-113-309": ["สถาปัตยกรรมระบบอิเล็กทรอนิกส์และหน่วยควบคุมในยานยนต์ เซนเซอร์และแอกชูเอเตอร์ ไมโครคอนโทรลเลอร์สำหรับยานยนต์ เครือข่ายสื่อสาร CAN LIN และ Automotive Ethernet การออกแบบระบบควบคุมแบบป้อนกลับสำหรับระบบขับเคลื่อน เบรก และพวงมาลัย การพัฒนาซอฟต์แวร์บนพื้นฐานแบบจำลอง การสร้างรหัสอัตโนมัติ การทดสอบแบบ SIL และ HIL ระบบปฏิบัติการเวลาจริงและสถาปัตยกรรม AUTOSAR เบื้องต้น ระบบวินิจฉัยบนรถ OBD ความปลอดภัยเชิงหน้าที่และความมั่นคงปลอดภัยไซเบอร์ของยานยนต์", "Automotive electronic architecture and electronic control units; sensors and actuators; automotive microcontrollers; communication networks: CAN, LIN and Automotive Ethernet; feedback control design for powertrain, braking and steering; model-based software development; automatic code generation; software-in-the-loop and hardware-in-the-loop testing; real-time operating systems and introduction to AUTOSAR; on-board diagnostics (OBD); functional safety and cybersecurity of vehicles."], "4-113-307": ["เคมีไฟฟ้าของแบตเตอรี่ลิเทียมไอออนและเคมีทางเลือก เซลล์ โมดูล และแพ็ก แบบจำลองวงจรสมมูลของเซลล์ สถานะประจุ สถานะสุขภาพ และการเสื่อมสภาพ ระบบจัดการแบตเตอรี่ การตรวจวัด การปรับสมดุลเซลล์ และการป้องกัน แหล่งกำเนิดความร้อนในแบตเตอรี่ ผลของอุณหภูมิต่อสมรรถนะและอายุ การระบายความร้อนด้วยอากาศ ของเหลว และสารเปลี่ยนสถานะ การปรับสภาพอุณหภูมิก่อนใช้งาน การอัดประจุแบบ AC และ DC และผลต่ออายุแบตเตอรี่ การใช้แบตเตอรี่ยานยนต์ร่วมกับโครงข่ายไฟฟ้า (V2G) การลุกลามทางความร้อนและความปลอดภัย มาตรฐานการทดสอบ การใช้งานซ้ำและการรีไซเคิลแบตเตอรี่", "Electrochemistry of lithium-ion and alternative battery chemistries; cells, modules and packs; equivalent circuit models; state of charge, state of health and degradation; battery management systems: sensing, cell balancing and protection; heat generation in batteries; effects of temperature on performance and life; air, liquid and phase change material cooling; preconditioning; AC and DC charging and their effects on battery life; vehicle-to-grid (V2G) use of traction batteries; thermal runaway and safety; testing standards; second-life use and recycling of batteries."], "4-112-317": ["ไฮโดรเจนในฐานะพาหะพลังงาน การผลิตไฮโดรเจนด้วยการแยกน้ำด้วยไฟฟ้าจากพลังงานหมุนเวียนและการปฏิรูปเชื้อเพลิง การกักเก็บและขนส่งไฮโดรเจน เซลล์เชื้อเพลิงชนิดต่าง ๆ และสมรรถนะ ระบบกักเก็บพลังงานด้วยแบตเตอรี่ระดับกริด (BESS) การกักเก็บพลังงานเชิงกลและเชิงความร้อน การเลือกขนาดระบบกักเก็บตามรูปแบบการใช้พลังงาน ไมโครกริดและการบริหารจัดการพลังงานอัจฉริยะร่วมกับระบบกักเก็บ การตรวจวัดพลังงานด้วย IoT การใช้ไฮโดรเจนในยานยนต์เซลล์เชื้อเพลิงและสถานีเติมไฮโดรเจน ความปลอดภัย มาตรฐาน และการประเมินวัฏจักรชีวิตและต้นทุนของระบบไฮโดรเจนและระบบกักเก็บพลังงาน", "Hydrogen as an energy carrier; hydrogen production by electrolysis from renewable energy and fuel reforming; hydrogen storage and transport; types and performance of fuel cells; grid-scale battery energy storage systems (BESS); mechanical and thermal energy storage; sizing of storage systems for load profiles; microgrids and smart energy management with storage; IoT-based energy monitoring; hydrogen in fuel cell vehicles and refuelling stations; safety and standards; life-cycle and cost assessment of hydrogen and energy storage systems."], "4-113-308": ["หลักการแปลงพลังงานไฟฟ้าเครื่องกล มอเตอร์กระแสตรง มอเตอร์เหนี่ยวนำ และมอเตอร์ซิงโครนัสแม่เหล็กถาวร คุณลักษณะแรงบิดและความเร็วสำหรับการขับเคลื่อนยานยนต์ อุปกรณ์สวิตช์กำลัง ไดโอด MOSFET IGBT และ SiC วงจรแปลงผันกระแสตรงเป็นกระแสตรง อินเวอร์เตอร์สามเฟสและการมอดูเลตความกว้างพัลส์ การควบคุมแบบเวกเตอร์และการควบคุมความเร็ว การเบรกแบบคืนพลังงาน การสูญเสียและการจัดการความร้อนของมอเตอร์และอินเวอร์เตอร์ เครื่องอัดประจุบนรถ การทดลองและจำลองระบบขับเคลื่อนไฟฟ้า", "Principles of electromechanical energy conversion; DC, induction and permanent magnet synchronous motors; torque-speed characteristics for vehicle propulsion; power switching devices: diode, MOSFET, IGBT and SiC; DC-DC converters; three-phase inverters and pulse width modulation; vector control and speed control; regenerative braking; losses and thermal management of motors and inverters; on-board chargers; experiments and simulation of electric drive systems."], "4-112-208": ["ความปลอดภัยในงานไฟฟ้าและงานระบบพลังงาน การติดตั้ง ตรวจสอบ และบำรุงรักษาระบบผลิตไฟฟ้าพลังงานแสงอาทิตย์ขนาดเล็ก อินเวอร์เตอร์ และระบบกักเก็บพลังงาน การติดตั้งและทดสอบปั๊มความร้อน การใช้เครื่องมือตรวจวัดทางไฟฟ้า พลังงาน และความร้อน การตรวจวัดไอเสียจากการเผาไหม้และคุณภาพอากาศ การเก็บตัวอย่างและตรวจวัดคุณภาพน้ำเบื้องต้น การคัดแยกและจัดการของเสีย การบันทึกข้อมูลและเขียนรายงานการปฏิบัติงาน", "Safety in electrical and energy system work; installation, inspection and maintenance of small solar photovoltaic systems, inverters and energy storage systems; installation and testing of heat pumps; use of electrical, energy and thermal measuring instruments; combustion flue gas and air quality measurements; basic water sampling and quality measurement; waste segregation and management; data recording and work reports."], "4-113-207": ["ความปลอดภัยงานไฟฟ้าแรงดันสูงในยานยนต์ไฟฟ้า อุปกรณ์ป้องกันอันตรายส่วนบุคคลและเครื่องมือฉนวน การตัดแยกระบบไฟฟ้าแรงดันสูง การล็อกและติดป้ายห้ามใช้งาน และการตรวจยืนยันว่าไม่มีแรงดันไฟฟ้า การตรวจสอบองค์ประกอบของยานยนต์ไฟฟ้าและยานยนต์ไฮบริด แบตเตอรี่ขับเคลื่อน ระบบจัดการแบตเตอรี่ มอเตอร์ อินเวอร์เตอร์ ตัวแปลงไฟ และระบบอัดประจุ การวัดค่าทางไฟฟ้าและความเป็นฉนวน การใช้เครื่องมือวินิจฉัยอ่านรหัสข้อขัดข้องและข้อมูลการทำงาน การบำรุงรักษาตามระยะ ระบบระบายความร้อนของแบตเตอรี่และระบบปรับอากาศ การจัดเก็บและการจัดการแบตเตอรี่ที่เสื่อมสภาพ และการเขียนรายงานการปฏิบัติงาน", "High-voltage safety in electric vehicles; personal protective equipment and insulated tools; high-voltage isolation, lockout/tagout and verification of absence of voltage; inspection of components of battery electric and hybrid vehicles: traction battery, battery management system, motor, inverter, DC-DC converter and charging system; electrical and insulation resistance measurements; use of diagnostic tools for reading trouble codes and live data; periodic maintenance; battery thermal management and air-conditioning systems; storage and handling of end-of-life batteries; work reports."], "4-112-320": ["แหล่งกำเนิดมลพิษจากระบบผลิตและใช้พลังงาน มลพิษอากาศจากการเผาไหม้ ฝุ่นละอองขนาดเล็ก PM2.5 ก๊าซออกไซด์ของไนโตรเจนและซัลเฟอร์ ระบบควบคุมฝุ่นและไอเสีย น้ำเสียและของเสียจากอุตสาหกรรมและโรงไฟฟ้า มาตรฐานการระบายมลพิษ กฎหมายสิ่งแวดล้อมที่เกี่ยวข้อง ระบบการจัดการสิ่งแวดล้อม ISO 14001 การวิเคราะห์ผลกระทบสิ่งแวดล้อมของโครงการพลังงาน", "Pollution sources in energy production and use; air pollution from combustion; fine particulate matter PM2.5; nitrogen and sulfur oxides; particulate and flue gas control systems; wastewater and solid waste from industries and power plants; emission standards; related environmental laws; environmental management system ISO 14001; environmental impact assessment of energy projects."], "4-112-316": ["องค์ประกอบและสมบัติเชิงเชื้อเพลิงของขยะชุมชน ของเสียอุตสาหกรรม และชีวมวล เชื้อเพลิงขยะ RDF การเผาไหม้โดยตรง แก๊สซิฟิเคชัน ไพโรไลซิส การหมักแบบไร้อากาศและระบบผลิตก๊าซชีวภาพ สมดุลมวลและพลังงาน การควบคุมมลพิษจากโรงไฟฟ้าขยะ ความคุ้มค่าทางเศรษฐศาสตร์และผลกระทบต่อชุมชน", "Composition and fuel properties of municipal solid waste, industrial waste and biomass; refuse-derived fuel (RDF); direct combustion; gasification; pyrolysis; anaerobic digestion and biogas systems; mass and energy balances; pollution control of waste-to-energy plants; economic feasibility and community impacts."], "4-112-314": ["หลักการเซลล์แสงอาทิตย์ ส่วนประกอบระบบผลิตไฟฟ้าพลังงานแสงอาทิตย์ แผง อินเวอร์เตอร์ อุปกรณ์ป้องกันและระบบกักเก็บพลังงาน การออกแบบระบบโซลาร์รูฟท็อปสำหรับบ้านอยู่อาศัยและอาคาร การประเมินภาระไฟฟ้าและขนาดระบบ โครงสร้างรองรับบนหลังคา มาตรฐานความปลอดภัยและการติดตั้ง ข้อกำหนดการเชื่อมต่อระบบจำหน่ายของการไฟฟ้า มาตรวัดและการขายไฟฟ้าคืน การใช้ซอฟต์แวร์จำลองผลผลิตพลังงาน การวิเคราะห์ความคุ้มค่าทางเศรษฐศาสตร์ การตรวจสอบและบำรุงรักษาระบบ", "Principles of photovoltaic cells; components of solar power systems: modules, inverters, protection devices and energy storage; design of rooftop solar systems for residences and buildings; load assessment and system sizing; roof mounting structures; safety and installation standards; utility grid interconnection requirements; metering and electricity sell-back; energy yield simulation software; economic feasibility analysis; inspection and maintenance of systems."], "4-110-202": ["ความน่าจะเป็นและตัวแปรสุ่ม การแจกแจงความน่าจะเป็นแบบไม่ต่อเนื่องและแบบต่อเนื่อง ค่าคาดหมาย สถิติเชิงพรรณนาและการนำเสนอข้อมูลทางวิศวกรรม การแจกแจงของตัวอย่าง การประมาณค่าและช่วงความเชื่อมั่น การทดสอบสมมติฐานสำหรับหนึ่งและสองประชากร การวิเคราะห์การถดถอยและสหสัมพันธ์ การวิเคราะห์ความแปรปรวนและการออกแบบการทดลองเบื้องต้น ความไม่แน่นอนของการวัด การควบคุมคุณภาพเชิงสถิติและความเชื่อถือได้เบื้องต้น การประยุกต์กับข้อมูลการทดลองและการทดสอบในงานวิศวกรรมเครื่องกลด้วยซอฟต์แวร์คำนวณ", "Probability and random variables; discrete and continuous probability distributions; expectation; descriptive statistics and presentation of engineering data; sampling distributions; estimation and confidence intervals; hypothesis testing for one and two populations; regression and correlation analysis; analysis of variance and introduction to design of experiments; measurement uncertainty; introduction to statistical quality control and reliability; applications to experimental and testing data in mechanical engineering using computational software."], "4-113-311": ["หลักการทำความเย็นและวัฏจักรอัดไอ ระบบปรับอากาศในยานยนต์ สารทำความเย็นและผลกระทบต่อสิ่งแวดล้อม ปั๊มความร้อนในยานยนต์ไฟฟ้า ภาระความร้อนของห้องโดยสาร การจัดการความร้อนของมอเตอร์ อินเวอร์เตอร์ และแบตเตอรี่ ระบบบริหารจัดการความร้อนแบบรวมของยานยนต์ การควบคุมอุณหภูมิ การจำลองระบบความร้อนของยานยนต์ และความปลอดภัยในการบำรุงรักษาระบบปรับอากาศยานยนต์", "Refrigeration principles and the vapor-compression cycle; automotive air-conditioning systems; refrigerants and their environmental impact; heat pumps in electric vehicles; cabin thermal loads; thermal management of motors, inverters and batteries; integrated vehicle thermal management systems; temperature control; simulation of vehicle thermal systems; safety in servicing automotive air-conditioning systems"], "4-112-311": ["กฎหมายว่าด้วยการส่งเสริมการอนุรักษ์พลังงาน อาคารควบคุมและโรงงานควบคุม หน้าที่ของผู้รับผิดชอบด้านพลังงาน การตรวจวิเคราะห์การใช้พลังงาน การจัดการพลังงานในระบบปรับอากาศ หม้อไอน้ำ ระบบอากาศอัด มอเตอร์ และระบบแสงสว่าง มาตรการอนุรักษ์พลังงานและการประเมินความคุ้มค่า การติดตามและรายงานผลการจัดการพลังงานตามที่กฎหมายกำหนด", "Energy conservation law; designated buildings and factories; duties of persons responsible for energy; energy audits; energy management in air-conditioning, boilers, compressed air, motors and lighting systems; energy conservation measures and economic evaluation; monitoring and reporting of energy management as required by law"], "4-111-102": ["ระบบแรงและโมเมนต์ของแรง แรงคู่ควบ ผลลัพธ์ของระบบแรง แผนภาพวัตถุอิสระ สภาวะสมดุลของอนุภาคและวัตถุแข็งเกร็งในสองและสามมิติ แรงปฏิกิริยาและแรงภายใน การวิเคราะห์โครงข้อหมุน โครงข้อแข็ง และเครื่องกลอย่างง่าย ความเสียดทาน จุดศูนย์ถ่วงและเซนทรอยด์ โมเมนต์ความเฉื่อยของพื้นที่ และหลักของงานเสมือน", "Force systems and moments; couples; resultants of force systems; free-body diagrams; equilibrium of particles and rigid bodies in two and three dimensions; reactions and internal forces; analysis of trusses, frames and simple machines; friction; center of gravity and centroids; area moments of inertia; principle of virtual work."], "4-000-102": ["การเขียนอักษร การเขียนภาพด้วยมือและการสเก็ตภาพ การมองภาพฉาย การเขียนภาพฉายและภาพสามมิติ การกำหนดขนาดและพิกัดความเผื่อ ภาพช่วย ภาพตัด แผ่นคลี่ และแบบประกอบ การเขียนแบบด้วยคอมพิวเตอร์เบื้องต้น", "Engineering lettering, freehand drawing and sketching, orthographic projection visualization, orthographic and pictorial drawings, dimensioning and tolerancing, auxiliary views, sectional views, surface developments, and assembly drawings, introduction to computer-aided drafting."], "4-000-103": ["แนวคิดและองค์ประกอบของระบบคอมพิวเตอร์ การอันตรกิริยาระหว่างฮาร์ดแวร์และซอฟต์แวร์ การประมวลผลข้อมูลทางอิเล็กทรอนิกส์ วิธีการออกแบบและการพัฒนาโปรแกรม การเขียนโปรแกรมด้วยภาษาระดับสูง การประยุกต์ใช้โปรแกรมสำเร็จรูปทางวิศวกรรม ขั้นตอนวิธีและการคิดเชิงคำนวณ ตัวแปร ชนิดข้อมูล โครงสร้างควบคุม ฟังก์ชัน โครงสร้างข้อมูลพื้นฐาน เช่น อาร์เรย์ เมทริกซ์ และรายการ การค้นหาและการเรียงลำดับ การวิเคราะห์ความถูกต้องและประสิทธิภาพของขั้นตอนวิธีเบื้องต้น การเขียนโปรแกรมคำนวณเชิงตัวเลขและประมวลผลข้อมูลทางวิศวกรรม", "Concepts and components of computer systems, hardware-software interactions, electronic data processing, program design and development methodologies, programming using high-level languages, application of engineering software packages; algorithms and computational thinking; variables, data types, control structures and functions; basic data structures such as arrays, matrices and lists; searching and sorting; introduction to correctness and efficiency of algorithms; programming for numerical computation and engineering data processing."], "4-110-101": ["การฝึกปฏิบัติงานพื้นฐานเบื้องต้นทางด้านวิศวกรรมที่เกี่ยวข้องกับเครื่องมือทั่วไป เครื่องมือวัด เครื่องมือร่างแบบ งานเครื่องมือกล งานเชื่อม การวางแผนขั้นตอนการทำงาน ความปลอดภัยในการปฏิบัติงานและจรรยาบรรณวิศวกร", "Basic engineering workshop practices involving general tools, measuring instruments, and layout tools, machine tool operations and welding processes, workflow planning, occupational safety and engineering ethics."], "0-110-001": ["โครงสร้างไวยากรณ์ และคำศัพท์ภาษาอังกฤษในบริบทที่เกี่ยวข้องกับการทำข้อสอบวัดมาตรฐานภาษาอังกฤษ กลยุทธ์การฟังและการอ่านเพื่อจับใจความสำคัญ การฝึกความคุ้นเคยและบริหารเวลาในการทำข้อสอบวัดมาตรฐานภาษาอังกฤษในระดับสากล", "English structure, grammar, and vocabulary in the context of the standardized english tests; listening and reading strategies, and familiarizing students with the practice tests with standardized test formats and effective time management."], "0-110-002": ["ประวัติศาสตร์และวิวัฒนาการของปัญญาประดิษฐ์ ความหมายและประเภทของปัญญาประดิษฐ์ วิธีการทำงานของปัญญาประดิษฐ์ ปัญญาประดิษฐ์กับข้อมูลขนาดใหญ่ การประยุกต์ใช้ปัญญาประดิษฐ์ ปัญญาประดิษฐ์กับอาชีพ ปัญญาประดิษฐ์กับจริยธรรม ทักษะที่จำเป็นในยุคปัญญาประดิษฐ์ แนวโน้มการพัฒนาปัญญาประดิษฐ์ในอนาคต ปัญญาประดิษฐ์กับความยั่งยืน", "Artificial Intelligence (AI) for the modern world history; evolution of AI; meaning and types of AI; How AI Works; AI and Big Data; Applications of AI; AI and careers; AI and ethics; essential skills in the AI era; AI development trends in the future; AI and Sustainability."], "0-121-001": ["แนวคิดและทฤษฎีเกี่ยวกับการสื่อสาร กระบวนการคิดกับการสื่อสาร คำจำกัดความและหน้าที่ของภาษา ความสัมพันธ์ระหว่างภาษา ความคิด และการสื่อสาร วัฒนธรรมการสื่อสารในโลกสมัยใหม่ การรับสารและการส่งสารอย่างมีวิจารณญาณ การฝึกทักษะการสื่อสาร การบูรณาการทักษะการใช้ภาษาเพื่อการสื่อสารผ่านเทคโนโลยีอย่างสร้างสรรค์", "Concepts and theories of communication, the processes of thinking and communication, the definitions and functions of language, the relationship between languages, thought, and communication, culture and communication in the modern world; critical transmission and reception of messages, practicing communication skills, and the integration of language skills for creative communication through technology."], "0-122-002": ["บุคลิกภาพ การรับรู้ตนเอง การปรับตัว จิตวิทยาสัมพันธ์ ความแตกต่างระหว่างบุคคล การแสวงหาความรู้และรู้เท่าทันสารสนเทศ จริยธรรมในการดำเนินชีวิต  พื้นฐานสังคมไทย ศิลปะและวัฒนธรรมไทย", "Personality, self-perception, self-adjustment, relational psychology, individual differences, knowledge seeking and media literacy, ethics in living, fundamentals of Thai society, Thai art and culture."], "0-123-003": ["การเป็นพลเมืองรุ่นใหม่ของสังคมไทยและสังคมโลก การรู้เท่าทันต่อการเปลี่ยนแปลงทางสังคมและสิ่งแวดล้อม สิทธิและหน้าที่ในการเป็นพลเมืองที่ดีของประเทศ ภาวะผู้นำ การเป็นผู้ประกอบการ การพัฒนาตนให้สอดคล้องกับอัตลักษณ์ของนักศึกษามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "New generation citizenship in Thai and global societies, awareness of social and environmental changes, rights and obligations of responsible citizens, leadership, entrepreneur, self-development aligned with the identity of students of Rajamangala University of Technology Krungthep."], "0-124-004": ["กระบวนการและทักษะทางวิทยาศาสตร์ในการแก้ปัญหาการดำเนินชีวิต ความสัมพันธ์ระหว่างวิทยาศาสตร์และเทคโนโลยี การประยุกต์ใช้เทคโนโลยีให้ทันต่อการเปลี่ยนแปลงของโลก สิ่งแวดล้อมและการจัดการในสถานการณ์", "ปัจจุบัน การเปลี่ยนแปลงของสภาพภูมิอากาศ ผลิตภัณฑ์ทางเคมีในครัวเรือนและความปลอดภัย สารเคมีอันตราย วิทยาศาสตร์กับการรู้เท่าทันสื่อเพื่อคุณภาพชีวิต การเอาตัวรอดในปัญหาของโลกยุคใหม่ SDGs"], "0-124-005": ["ความรู้ทั่วไปเกี่ยวกับกิจกรรมทางกายเพื่อสุขภาพ การยืดเหยียดกล้ามเนื้อ การเสริมสร้างสมรรถภาพทางกายเพื่อสุขภาพ การดูแลสุขภาพแบบองค์รวม การใช้สมุนไพร ยาและผลิตภัณฑ์เพื่อสุขภาพ โภชนาการ และกีฬาเพื่อสุขภาพ กิจกรรมทางกายเพื่อสุขภาพที่เหมาะสมกับตนเองและส่วนรวม", "General knowledge about physical activity for health, stretching muscles, physical fitness, holistic health care, using herb, drugs and health product; nutrition and sports for health, physical activity for health that are appropriate for yourself and the public."], "0-125-006": ["การใช้เทคโนโลยีในการเก็บรวบรวมข้อมูล การวิเคราะห์ข้อมูล การตีความหมายข้อมูล และการนำเสนอข้อมูลที่ใช้ในชีวิตประจำวัน ทักษะความเป็นพลเมืองดิจิทัล สภาพแวดล้อมดิจิทัล เทคโนโลยีปัญญาประดิษฐ์  การใช้กฎหมายเกี่ยวกับคอมพิวเตอร์ การรู้เท่าทันสื่อดิจิทัล", "Using technology to collect data, data analysis, data interpretation and presenting information in daily life. digital citizenship skills. digital environment. artificial intelligence technology, using computer law, digital literacy."], "4-112-310": ["สถานการณ์และนโยบายพลังงานทดแทน การประเมินศักยภาพแหล่งพลังงาน พลังงานแสงอาทิตย์เชิงความร้อน ตัวเก็บรังสีอาทิตย์ ระบบอบแห้งและผลิตน้ำร้อน ปั๊มความร้อนและการนำความร้อนทิ้งกลับมาใช้ พลังงานลม อากาศพลศาสตร์ใบกังหันและการประเมินศักยภาพลม พลังงานน้ำขนาดเล็ก พลังงานชีวมวลและก๊าซชีวภาพ พลังงานความร้อนใต้พิภพ ไฮโดรเจนเบื้องต้น เศรษฐศาสตร์และผลกระทบสิ่งแวดล้อมของแต่ละแหล่งพลังงาน", "Renewable energy situation and policy; resource potential assessment; solar thermal energy, solar collectors, drying and water heating systems; heat pumps and waste heat recovery; wind energy, blade aerodynamics and wind resource assessment; small hydropower; biomass and biogas; geothermal energy; introduction to hydrogen; economics and environmental impacts of each energy source."], "4-113-401": ["ประวัติและแนวโน้มยานยนต์พลังงานใหม่ สถาปัตยกรรมยานยนต์ไฟฟ้าแบตเตอรี่ ไฮบริด ปลั๊กอินไฮบริด และยานยนต์เซลล์เชื้อเพลิงไฮโดรเจน เครื่องยนต์สันดาปภายในในระบบไฮบริด พลศาสตร์การขับเคลื่อนและการคำนวณกำลังและพลังงานที่ต้องการ ระบบส่งกำลังไฟฟ้า มอเตอร์และอินเวอร์เตอร์ การเบรกแบบคืนพลังงาน โครงสร้างตัวถังและวัสดุน้ำหนักเบา ระบบอัดประจุไฟฟ้า สถานีอัดประจุ มาตรฐานหัวจ่าย และการเชื่อมต่อยานยนต์กับโครงข่ายไฟฟ้า (V2G) ความปลอดภัยและมาตรฐานยานยนต์ไฟฟ้า", "History and trends of new energy vehicles; architectures of battery electric, hybrid, plug-in hybrid and hydrogen fuel cell vehicles; internal combustion engines in hybrid systems; vehicle dynamics and calculation of power and energy requirements; electric drivetrains, motors and inverters; regenerative braking; body structures and lightweight materials; charging systems, charging stations, connector standards and vehicle-to-grid (V2G); electric vehicle safety and standards."], "4-112-408": ["แหล่งพลังงานและภาพรวมโรงไฟฟ้า เชื้อเพลิงและการเผาไหม้ หม้อไอน้ำและอุปกรณ์ประกอบ วัฏจักรกำลังไอน้ำและกังหันไอน้ำ กังหันก๊าซและวัฏจักรเบรย์ตัน วัฏจักรร่วมและระบบผลิตไฟฟ้าและความร้อนร่วม เครื่องยนต์ดีเซลต้นกำลัง โรงไฟฟ้าพลังงานหมุนเวียน ระบบหล่อเย็นและหอผึ่งเย็น เศรษฐศาสตร์โรงไฟฟ้า ผลกระทบสิ่งแวดล้อมและกฎหมายที่เกี่ยวข้อง", "Energy resources and overview of power plants; fuels and combustion; boilers and auxiliaries; steam power cycles and steam turbines; gas turbines and the Brayton cycle; combined cycles and cogeneration; diesel engine power plants; renewable energy power plants; cooling systems and cooling towers; power plant economics; environmental impacts and related regulations."], "4-112-306": ["กลไกการถ่ายเทความร้อนและความสัมพันธ์กับอุณหพลศาสตร์ การนำความร้อนในสภาวะคงตัวหนึ่งและสองมิติ วงจรความต้านทานความร้อน การนำความร้อนที่มีการกำเนิดความร้อนภายใน ครีบและพื้นผิวขยาย การนำความร้อนในสภาวะไม่คงตัวและวิธีความจุความร้อนรวม การวิเคราะห์การนำความร้อนด้วยวิธีเชิงตัวเลข การพาความร้อนแบบบังคับภายนอกและภายในท่อ การพาความร้อนแบบธรรมชาติ ตัวแปรไร้มิติและสหสัมพันธ์ การเดือดและการควบแน่น การแผ่รังสีความร้อน วัตถุดำและวัตถุเทา ตัวประกอบรูปร่าง และรังสีอาทิตย์ เครื่องแลกเปลี่ยนความร้อนด้วยวิธี LMTD และ ε-NTU และการเพิ่มการถ่ายเทความร้อน การประยุกต์กับระบบความร้อนในอาคารและโรงงาน การระบายความร้อนแบตเตอรี่ มอเตอร์ และอิเล็กทรอนิกส์กำลังในยานยนต์ไฟฟ้า ตัวเก็บรังสีอาทิตย์ แผงเซลล์แสงอาทิตย์ และการนำความร้อนทิ้งกลับมาใช้", "Modes of heat transfer and their relation to thermodynamics; one- and two-dimensional steady-state conduction; thermal resistance networks; conduction with internal heat generation; fins and extended surfaces; transient conduction and the lumped capacitance method; numerical analysis of conduction; external and internal forced convection; natural convection; dimensionless groups and correlations; boiling and condensation; thermal radiation, blackbody and gray surfaces, view factors and solar radiation; heat exchangers by LMTD and ε-NTU methods and heat transfer enhancement; applications to thermal systems in buildings and industry, cooling of batteries, motors and power electronics in electric vehicles, solar collectors, photovoltaic panels, and waste heat recovery."], "4-116-307": ["การกำหนดปัญหาทางวิศวกรรมที่ซับซ้อนจากความต้องการของผู้ใช้หรือสถานประกอบการ การวิเคราะห์ลักษณะความซับซ้อนของปัญหา การทบทวนวรรณกรรมและเทคโนโลยีที่เกี่ยวข้อง การกำหนดข้อกำหนดและข้อจำกัดทางเทคนิค เศรษฐศาสตร์ ความปลอดภัย สังคม และสิ่งแวดล้อม การสร้างและเปรียบเทียบแนวคิดการออกแบบ การวางแผนการทดลองหรือแบบจำลอง การบริหารโครงการ แผนงาน และงบประมาณ จรรยาบรรณและการอ้างอิง การเขียนและนำเสนอข้อเสนอโครงงานวิศวกรรมเครื่องกล", "Definition of complex engineering problems from user or industry needs; analysis of problem complexity; review of literature and related technologies; specification of technical, economic, safety, social and environmental requirements and constraints; generation and comparison of design concepts; planning of experiments or models; project management, schedule and budget; ethics and referencing; writing and presentation of a mechanical engineering project proposal."], "4-116-408": ["การดำเนินโครงงานเพื่อแก้ปัญหาวิศวกรรมเครื่องกลที่ซับซ้อนตามข้อเสนอโครงงาน การประยุกต์ความรู้เชิงลึกทางวิศวกรรม การวิเคราะห์และการสร้างแบบจำลอง การออกแบบ สร้าง และทดสอบชิ้นงานหรือระบบภายใต้ข้อกำหนดที่ขัดแย้งกัน การใช้มาตรฐานและข้อกำหนดที่เกี่ยวข้อง การประเมินความคุ้มค่า ความปลอดภัย และผลกระทบต่อสังคมและสิ่งแวดล้อม การทำงานเป็นทีม การเขียนรายงานและการนำเสนอผลงานโครงงานต่อคณะกรรมการ", "Execution of a project to solve a complex mechanical engineering problem according to the approved proposal; application of in-depth engineering knowledge; analysis and modelling; design, construction and testing of components or systems under conflicting requirements; use of relevant standards and codes; evaluation of cost-effectiveness, safety, and social and environmental impacts; teamwork; report writing and presentation of project results to a committee."]};

}

async function savePlo(){
  const d=readPloForm(),p=d.p;
  const err=m=>{const e=document.getElementById("ploErr");if(e)e.textContent=m};
  if(!p.t)return err("ใส่ข้อความ PLO");if(!p.d)return err("เลือกด้านอย่างน้อย 1 ด้าน");if(!d.subs.length)return err("ต้องมี Sub-PLO อย่างน้อย 1 ข้อ");
  if(d.subs.some(s=>!s.t))return err("กรอกผลลัพธ์ของ Sub-PLO ให้ครบ");
  const bad=BANNED.filter(w=>(p.t.includes(w)&&!(p.fixed||[]).includes(w))||d.subs.some(s=>s.t.includes(w)));if(bad.length)return err("แม่แบบห้ามใช้คำ: "+bad.join(", "));
  const taken=new Set([...SUBS.filter(s=>s.plo!==p.n).map(s=>s.code),...d.subs.filter(s=>!s.isNew).map(s=>s.code)]);
  d.subs.forEach(s=>{if(!s.isNew)return;const used=[...taken].filter(c=>new RegExp(`^${s.dom}${p.n}-`).test(c)).map(c=>+c.split("-")[1]);const k=Math.max(0,...used)+1;s.code=`${s.dom}${p.n}-${k}`;taken.add(s.code)});
  const plos=PLOS.map(x=>x.n===p.n?{...x,...p}:{...x}).map(x=>({...x,sh:x.sh||PLO_SHORT[x.n]||""}));
  const subs=[...SUBS.filter(s=>s.plo<p.n),...d.subs.map(({isNew,...s})=>s),...SUBS.filter(s=>s.plo>p.n)];
  const doc={plos,subs,pv:12,updatedAt:new Date().toISOString()};
  applyPloDoc(doc);state.ploEdit=null;state.ploDraft=null;rebuild();render();
  await dbWrite(db=>db.doc("program/plos").set(doc),"PLO");
}

function drawMM(){
  const box=document.getElementById("mmx");if(!box)return;const svg=box.querySelector("svg");
  if(getComputedStyle(svg).display==="none"){svg.innerHTML="";return}
  const B=box.getBoundingClientRect(),W=Math.max(B.width,1);
  const hubR=box.querySelector(".mmx-hub").getBoundingClientRect();
  const paths=(state.mmLinks||[]).map(l=>{const s=box.querySelector(`[data-mmg="${l.g}"]`),t=box.querySelector(`[data-mmp="${l.p}"]`);if(!s||!t)return"";
    const a=s.getBoundingClientRect(),b=t.getBoundingClientRect();const isL=a.left<hubR.left;
    const x1=(isL?a.right:a.left)-B.left,y1=a.top+a.height/2-B.top,x2=(isL?b.left:b.right)-B.left,y2=b.top+b.height/2-B.top,dx=(x2-x1)*.5;
    const kind=NEED_KIND[l.g];return `<path data-g="${l.g}" data-p="${l.p}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="var(--k-${kind})" stroke-width="${Math.min(1.5+l.k*1.2,5)}"${l.pend?' stroke-dasharray="4 5"':""}/>`}).join("");
  svg.setAttribute("viewBox",`0 0 ${W} ${B.height}`);svg.innerHTML=paths;
}
function mmHover(e){const box=document.getElementById("mmx");if(!box)return;const el=e.target.closest&&e.target.closest("[data-mmg],[data-mmp]");
  box.querySelectorAll(".on").forEach(x=>x.classList.remove("on"));
  if(!el||!box.contains(el)){box.classList.remove("hl");return}
  box.classList.add("hl");el.classList.add("on");const g=el.dataset.mmg,p=el.dataset.mmp;
  box.querySelectorAll("path").forEach(x=>{const hit=g?x.dataset.g===g:x.dataset.p===p;if(hit){x.classList.add("on");const o=box.querySelector(g?`[data-mmp="${x.dataset.p}"]`:`[data-mmg="${x.dataset.g}"]`);if(o)o.classList.add("on")}})}
document.addEventListener("mouseover",mmHover);

 h2:[["philo","ปรัชญาของหลักสูตร","มุ่งผลิตวิศวกรเครื่องกลนักปฏิบัติที่มีความรู้ทางทฤษฎีมั่นคง เชี่ยวชาญในแขนงวิศวกรรมเครื่องกล วิศวกรรมยานยนต์พลังงานใหม่ และวิศวกรรมพลังงานและสิ่งแวดล้อม ใช้เทคโนโลยีและสร้างนวัตกรรม ยึดมั่นในจรรยาบรรณวิชาชีพ และรับผิดชอบต่อสังคมและสิ่งแวดล้อม","area"],["obj","วัตถุประสงค์ 4 ข้อ (บรรทัดละ 1 ข้อ ตามลำดับเดิม)","เพื่อผลิตวิศวกรเครื่องกลที่มีองค์ความรู้ครบตามเกณฑ์ของสภาวิศวกร และเชี่ยวชาญในแขนงวิชาที่ศึกษา\nเพื่อผลิตบัณฑิตนักปฏิบัติที่ทดสอบ วินิจฉัย และปฏิบัติงานในภาคอุตสาหกรรมได้ทันทีที่สำเร็จการศึกษา\nเพื่อผลิตบัณฑิตที่สื่อสาร ทำงานเป็นทีม และยึดมั่นในจรรยาบรรณวิชาชีพ\nเพื่อผลิตบัณฑิตที่เรียนรู้ตลอดชีวิตและสร้างนวัตกรรมทางเทคโนโลยี","area"]],
 h3:[["sys","1. ระบบการจัดการศึกษา","ใช้ระบบทวิภาค โดย 1 ปีการศึกษาแบ่งออกเป็น 2 ภาคการศึกษาปกติ มีระยะเวลาศึกษาไม่น้อยกว่า 15 สัปดาห์ และมีภาคฤดูร้อนไม่น้อยกว่า 7 สัปดาห์","area"],["qual","2.3 คุณสมบัติของผู้เข้าศึกษา","2.3.1 แผนปกติ 4 ปี (ภาคปกติ) สำเร็จการศึกษาระดับมัธยมศึกษาตอนปลาย (ม.6) แผนการเรียนวิทยาศาสตร์–คณิตศาสตร์ หรือประกาศนียบัตรวิชาชีพ (ปวช.) ประเภทวิชาช่างอุตสาหกรรมในสาขาที่เกี่ยวข้อง หรือเทียบเท่า\n2.3.2 แผนเทียบโอน ปวส. (ภาคปกติ) สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.) สาขาช่างยนต์ เทคนิคยานยนต์ ยานยนต์ไฟฟ้า ช่างกลโรงงาน เทคนิคการผลิต ช่างจักรกลหนัก ช่างกลเรือ ช่างกลเกษตร ช่างเครื่องทำความเย็นและปรับอากาศ เมคคาทรอนิกส์ เทคนิคพลังงาน หรือเทียบเท่า โดยเทียบโอนรายวิชาตามข้อบังคับของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n2.3.3 แผนปริญญาตรีใบที่ 2 (ภาคสมทบ ผู้เรียนเต็มเวลาที่เรียนนอกเวลาราชการ) สำเร็จการศึกษาระดับปริญญาตรีหรือสูงกว่า ในสาขาวิศวกรรมศาสตร์ วิทยาศาสตร์ เทคโนโลยี ครุศาสตร์อุตสาหกรรม อุตสาหกรรมศาสตร์ หรือเทียบเท่า จากสถาบันอุดมศึกษาที่สำนักงานปลัดกระทรวงการอุดมศึกษา วิทยาศาสตร์ วิจัยและนวัตกรรมรับรอง และมีคุณสมบัติเพิ่มเติมดังนี้\n   (1) ได้ศึกษารายวิชาคณิตศาสตร์ ฟิสิกส์ และเคมีระดับอุดมศึกษาที่เทียบโอนกับกลุ่มวิชาพื้นฐานทางคณิตศาสตร์และวิทยาศาสตร์ได้ หากเทียบโอนได้ไม่ครบ ต้องลงเรียนรายวิชาที่ขาดตามที่คณะกรรมการประจำหลักสูตรกำหนด\n   (2) ผ่านการสอบสัมภาษณ์ และผู้มีประสบการณ์ทำงานด้านวิศวกรรมหรืออุตสาหกรรมจะได้รับการพิจารณาเป็นพิเศษ\n   (3) การเทียบโอน เทียบโอนหมวดวิชาศึกษาทั่วไป หมวดวิชาเลือกเสรี กลุ่มวิชาพื้นฐานทางคณิตศาสตร์และวิทยาศาสตร์ และกลุ่มวิชาพื้นฐานทางวิศวกรรม เป็นรายวิชาที่มีเนื้อหาและจุดประสงค์ครอบคลุมไม่น้อยกว่าสามในสี่ หน่วยกิตและชั่วโมงไม่น้อยกว่ารายวิชาในหลักสูตร และได้ระดับคะแนนไม่ต่ำกว่า C หรือ 2.00 รวมแล้วไม่เกินสามในสี่ของหน่วยกิตรวมของหลักสูตร ส่วนกลุ่มวิชาเฉพาะด้าน กลุ่มวิชาเสริมสร้างประสบการณ์ในวิชาชีพ และรายวิชาตามองค์ความรู้ของสภาวิศวกรที่ไม่ได้ศึกษาในหลักสูตรวิศวกรรมเครื่องกล ต้องลงเรียนในหลักสูตรนี้ ทั้งนี้เป็นไปตามระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ว่าด้วยการเทียบโอนผลการเรียน พ.ศ. 2564 และประกาศมหาวิทยาลัย เรื่อง หลักเกณฑ์การพิจารณาเทียบรายวิชาหรือกลุ่มวิชา และรายวิชาที่ใช้ยื่นขอใบอนุญาตประกอบวิชาชีพเป็นไปตามข้อกำหนดของสภาวิศวกร\n   (4) ผู้ที่ทำงานด้านวิศวกรรมเครื่องกลหรือที่เกี่ยวข้อง ขอเทียบโอนรายวิชาในกลุ่มวิชาเสริมสร้างประสบการณ์ในวิชาชีพจากประสบการณ์ทำงานได้ โดยประเมินจากแฟ้มสะสมงาน หนังสือรับรองจากหน่วยงาน หรือการทดสอบสมรรถนะเทียบกับผลลัพธ์การเรียนรู้ของรายวิชา ตามประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่อง หลักเกณฑ์และวิธีการเทียบโอนหน่วยกิตและผลการศึกษาในระดับอุดมศึกษา พ.ศ. 2565\n   (5) ใช้เวลาศึกษาตามแผนไม่น้อยกว่า 3 ปีการศึกษา (เริ่มเรียนแผนการเรียนชั้นปีที่ 2 ระเบียบกำหนดให้ศึกษาในมหาวิทยาลัยอย่างน้อย 1 ปีการศึกษา) เรียนวันจันทร์–ศุกร์ เวลา 18.00–21.00 น. และวันเสาร์–อาทิตย์ เวลา 08.00–18.00 น.\n2.3.4 มีคุณสมบัติอื่น ๆ ตามข้อบังคับมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ว่าด้วยการศึกษาระดับปริญญาตรี พ.ศ. 2550 และประกาศมหาวิทยาลัย โดยความเห็นชอบของคณะกรรมการประจำหลักสูตร","area"]],

}

async function paginateHtml(html,fmt,trace){

  const host=document.createElement("div");host.className="bk-view";host.setAttribute("style",pgCssVars(fmt)+";position:fixed;left:-20000px;top:0;visibility:hidden");
  const pg=document.createElement("div");pg.className="bk-pgc";pg.style.width=`calc(8.27in - ${fmt.mL}in - ${fmt.mR}in)`;host.appendChild(pg);document.body.appendChild(host);
  const probe=document.createElement("div");probe.style.height=`calc(11.69in - ${fmt.mT}in - ${fmt.mB}in)`;host.appendChild(probe);const maxH=probe.offsetHeight;probe.remove();
  const src=document.createElement("div");src.innerHTML=html;
  const nodes=[...src.childNodes].filter(n=>n.nodeType===1||(n.nodeType===3&&n.textContent.trim()));
  const pages=[];let want=false;const flush=()=>{if(pg.innerHTML.trim()){pages.push(pg.innerHTML);want=true}pg.innerHTML=""};
  const rec=(i,r)=>{if(trace&&want){trace.push([i,r]);want=false}};
  const fits=()=>pg.scrollHeight<=maxH+1;
  for(const [ni,n] of nodes.entries()){
    if(n.nodeType===1&&n.classList.contains("bk-break")){flush();continue}

    pg.removeChild(c);

      const head=n.tHead?n.tHead.cloneNode(true):null;const rows=[...n.tBodies[0].rows];

      let tb=mk();
      for(const [ri,r] of rows.entries()){tb.appendChild(r.cloneNode(true));if(!fits()){tb.removeChild(tb.lastChild);if(!tb.rows.length){pg.removeChild(tb.parentNode);flush();rec(ni,ri);tb=mk();tb.appendChild(r.cloneNode(true))}else{flush();rec(ni,ri);tb=mk();tb.appendChild(r.cloneNode(true))}}}

}

let EXPECTED={};
function buildExpected(){
  EXPECTED={};
  COURSES.forEach(c=>{
    if(CLO0[c.code]){const m={};CLO0[c.code].forEach(([t,subs,bl,lv])=>subs.forEach(s=>{const sb=subOf(s);if(!sb)return;if(!m[sb.plo]||LV_RANK[lv]>LV_RANK[m[sb.plo]])m[sb.plo]=lv}));EXPECTED[c.code]=m}
    else EXPECTED[c.code]={...(c.plo||{})};
  });
}
const VERBS=[
 [1,["ระบุ","บอก","จำ","ทบทวน","แสดงรายการ","นิยาม"]],
 [2,["อธิบาย","สรุป","ยกตัวอย่าง","แปลความ","บรรยาย","จำแนกประเภท"]],
 [3,["ใช้","คำนวณ","ประยุกต์","ปฏิบัติ","ดำเนินการ","ต่อวงจร","ติดตั้ง","เขียน","แก้ปัญหา","ทดลอง","วัด","ขึ้นรูป","บันทึก","จัดทำ","สร้างแบบจำลอง"]],

 [6,["ออกแบบ","สร้าง","พัฒนา","วางแผน","ประดิษฐ์","เสนอแนวคิด","คิดค้น"]]];
const AFFECTIVE=["Receive","Respond","Value","Organize","Characterize"];
function verbLevel(t){
  t=(t||"").trim();let best=null;
  VERBS.forEach(([lv,ws])=>ws.forEach(w=>{if(t.startsWith(w)&&(!best||w.length>best.w.length))best={lv,w}}));
  return best;
}
const LVN={I:"I แนะนำ",R:"R ฝึกซ้ำ",M:"M ประเมินการบรรลุ"};
function alignIssues(code,items){
  const out=[],add=(lv,i,msg)=>out.push({lv,i,msg});
  const c=COURSES.find(x=>x.code===code);if(!c)return out;
  if(!items.length){add("err",null,"ยังไม่มี CLO");return out}
  if(items.length<3)add("warn",null,`มี CLO ${items.length} ข้อ แม่แบบแนะนำ 3–5 ข้อต่อวิชา`);
  const uni=c.g==="GE"&&!!DESC0[code];
  if(items.length>6)add(uni?"info":"warn",null,`มี CLO ${items.length} ข้อ มากเกินไปสำหรับการประเมินในหนึ่งภาค`+(uni?" (ผลลัพธ์ที่มหาวิทยาลัยกำหนด)":""));
  items.forEach((x,i)=>{
    const t=(x.t||"").trim(),subs=(x.subs||[]).map(subOf).filter(Boolean);
    if(t.length<12)add("err",i,"ข้อความ CLO สั้นเกินไปหรือยังไม่ได้กรอก");
    const bad=BANNED.filter(w=>t.includes(w));if(bad.length)add(uni?"info":"err",i,`ใช้คำที่แม่แบบห้าม: ${bad.join(", ")} `+(uni?"(ถ้อยคำตามเล่มของมหาวิทยาลัย)":"ให้ขึ้นต้นด้วยคำกริยาที่วัดได้"));
    if(!subs.length)add("err",i,"ไม่ได้โยงกับ Sub-PLO ใดเลย จึงไม่ตอบ PLO ของหลักสูตร");
    if(x.lv==="M"&&!(x.as||"").trim())add("err",i,"ระดับ M ต้องระบุวิธีประเมินที่ใช้วัดการบรรลุ");
    const vb=verbLevel(t);
    if(t&&!vb)add("info",i,"ไม่พบคำกริยาที่วัดได้ต้นประโยค ตรวจว่าขึ้นต้นด้วย action verb");
    if(vb&&!AFFECTIVE.includes(x.bloom)&&Math.abs(vb.lv-(BLOOM_RANK[x.bloom]||0))>=2)add("warn",i,`คำกริยา "${vb.w}" มักอยู่ระดับ ${BLOOM[vb.lv-1]} แต่เลือก Bloom เป็น ${x.bloom}`);
    subs.forEach(s=>{
      if(x.lv==="M"&&BLOOM_RANK[x.bloom]<BLOOM_RANK[s.bloom])add("warn",i,`ระดับ M แต่ Bloom (${x.bloom}) ต่ำกว่าที่ ${s.code} กำหนด (${s.bloom})`);
      if((s.dom==="K"||s.dom==="S")&&AFFECTIVE.includes(x.bloom))add("warn",i,`${s.code} เป็นด้าน${s.dom==="K"?"ความรู้":"ทักษะ"} ควรใช้ Bloom ด้านพุทธิพิสัย ไม่ใช่ ${x.bloom}`);
    });
  });
  const got={};items.forEach(x=>(x.subs||[]).forEach(s=>{const sb=subOf(s);if(!sb)return;if(!got[sb.plo]||LV_RANK[x.lv]>LV_RANK[got[sb.plo]])got[sb.plo]=x.lv}));
  const exp=EXPECTED[code]||{};
  PLOS.forEach(p=>{const e=exp[p.n],g=got[p.n];
    if(e&&!g)add(e==="M"?"err":"warn",null,`หลักสูตรกำหนดให้วิชานี้รับผิดชอบ PLO${p.n} ระดับ ${LVN[e]} แต่ไม่มี CLO ที่โยงกับ PLO${p.n}`);
    else if(e&&g&&LV_RANK[g]<LV_RANK[e])add(e==="M"?"err":"warn",null,`PLO${p.n} หลักสูตรกำหนดระดับ ${e} แต่ CLO ให้สูงสุดแค่ระดับ ${g}`);
    else if(!e&&g)add("info",null,`CLO โยงกับ PLO${p.n} ซึ่งไม่อยู่ใน Curriculum Mapping ของวิชานี้ ต้องแจ้งกรรมการหลักสูตรเพื่อปรับ mapping`);
  });
  return out;
}

const QUAL0={f01:{deg:"D",pos:"AsP"},f02:{deg:"M",pos:"AP"},f03:{deg:"M",pos:"AP"},f04:{deg:"D",pos:"L"},f05:{deg:"M",pos:"L"},f06:{deg:"M",pos:"AP"},f07:{deg:"B",pos:"L"},f08:{deg:"M",pos:"L"},f09:{deg:"M",pos:"L"},f10:{deg:"M",pos:"L"},f11:{deg:"M",pos:"L"},f12:{deg:"D",pos:"L"}};

function teamAnalysis(){
  const F=state.faculty;const per={};Object.keys(TRACKS).forEach(t=>per[t]=F.filter(f=>roleOf(f.id)===t));
  const lowDeg=F.filter(f=>roleOf(f.id)&&qualOf(f.id).deg==="B");
  const noQual=F.filter(f=>roleOf(f.id)&&!qualOf(f.id).deg);
  const regular=F.filter(f=>!roleOf(f.id));
  return {per,lowDeg,noQual,regular,short:Object.keys(TRACKS).filter(t=>per[t].length<3)};
}

async function setPhoto(fid,file){
  if(!file||!/^image\//.test(file.type)){state.msg="เลือกไฟล์รูปภาพ";render();return}
  const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const S=200,cv=document.createElement("canvas");cv.width=cv.height=S;const s=Math.min(im.width,im.height);
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,S,S);g.drawImage(im,(im.width-s)/2,(im.height-s)/2*0.6,s,s,0,0,S,S);
  const img=cv.toDataURL("image/jpeg",0.82);state.photos[fid]=img;render();
  await dbWrite(db=>db.doc("photo/"+fid).set({fid,img,updatedAt:new Date().toISOString()}),"รูปอาจารย์");
}

function mapGroups(){
  const sp=["MS","EB","CORE","EXP"];
  const core=COURSES.filter(c=>c.tr===A&&sp.includes(c.g));
  const gs=[{k:"ge",t:"หมวดวิชาศึกษาทั่วไป (รองรับ PLO1 · เรียนร่วมทุกแขนง)",L:COURSES.filter(c=>c.g==="GE")},{k:"core",t:"รายวิชาแกน (เรียนร่วมทุกแขนง)",L:core}];
  Object.entries(TRACKS).forEach(([k,v])=>{
    gs.push({k:k+"-TR",t:`แขนง${v} · บังคับแขนง`,L:COURSES.filter(c=>c.g==="TR"&&inTrack(c,k)&&c.tr!==A)});
    gs.push({k:k+"-TE",t:`แขนง${v} · เลือกแขนง`,L:COURSES.filter(c=>c.g==="TE"&&inTrack(c,k)&&c.tr!==A)});
  });
  gs.push({k:"TE",t:"วิชาชีพเลือก (ทุกแขนงเลือกเรียนเป็นวิชาเลือกเสรีได้)",L:COURSES.filter(c=>c.g==="TE"&&c.tr===A&&!(c.fl&&c.fl.slot))});
  return gs.filter(g=>g.L.length);
}

    if(/ผู้มีส่วนได้ส่วนเสีย/.test(t))return {how:"ไปหน้าแบบสำรวจ นำเข้าไฟล์ CSV ผลตอบของแต่ละกลุ่ม (ส่งออกจาก Google Sheets ของแบบฟอร์ม) PLO ที่ได้คะแนนเฉลี่ย ≥ 3.51 จะโยงกับผลสำรวจเอง",btn:`<button class="sm" data-gohash="#design/survey">ไปหน้าแบบสำรวจ</button>`};

function units(sem){
  const res=[];
  COURSES.filter(c=>SEM[sem].includes(c.term)&&c.dept==="ME"&&!c.fl.coop&&!c.fl.slot).forEach(c=>{
    const n=c.tr===A?state.intake.ME+state.intake.EV+state.intake.CE:c.tr.reduce((a,t)=>a+(state.intake[t]||0),0);
    if(n<=0)return;const year=+c.term[1];
    if(c.t>0){const ls=Math.max(1,Math.ceil(n/60));for(let i=1;i<=ls;i++)res.push({key:`${c.code}|L${i}`,c,part:"L",sec:i,secs:ls,hrs:+c.t,n:Math.ceil(n/ls),year});}

  });
  return res;
}
function loads(sem){

function autoAssign(sem,all){

}

const isThai=s=>/[฀-๿]/.test(s||"");
function cvJoinAuthors(L,th){L=L.filter(Boolean);if(L.length<2)return L.join("");return L.slice(0,-1).join(", ")+(th?" และ ":" and ")+L[L.length-1]}
function cvCite(o){
  const th=isThai(o.title)||isThai(o.venue);const yr=o.y?(th?cvYearBE(o.y):o.y):"";
  const mon=o.m?(th?TH_MON[o.m-1]:EN_MON[o.m-1])+" "+yr:"";
  const parts=[`${cvJoinAuthors(o.authors||[],th)}. (${yr||"ไม่ระบุปี"}).`,`${(o.title||"").replace(/\.$/,"")}.`];
  if(o.venue)parts.push(`${o.venue}.`);
  const vi=[o.vol?(th?"ปีที่ "+o.vol:"Vol. "+o.vol):"",o.iss?(th?"ฉบับที่ "+o.iss:"(No. "+o.iss+")"):""].filter(Boolean).join(" ");if(vi)parts.push(vi+".");
  if(mon)parts.push((th?"เดือน":"")+mon+".");
  if(o.pg)parts.push((th?"หน้า ":"pp. ")+o.pg+".");
  if(o.doi)parts.push("https://doi.org/"+o.doi);
  return parts.join(" ");
}
function cvFromOpenAlex(w){
  const src=(w.primary_location&&w.primary_location.source)||{};const b=w.biblio||{};const d=(w.publication_date||"").split("-");
  const o={authors:(w.authorships||[]).map(a=>a.author&&a.author.display_name),title:w.display_name||w.title||"",venue:src.display_name||"",vol:b.volume||"",iss:b.issue||"",
    pg:b.first_page?(b.last_page&&b.last_page!==b.first_page?b.first_page+"-"+b.last_page:b.first_page):"",y:w.publication_year||+d[0]||"",m:+d[1]||"",doi:(w.doi||"").replace(/^https?:\/\/doi\.org\//i,"")};
  const conf=src.type==="conference"||w.type==="proceedings-article"||/proceeding|conference|symposium/i.test(o.venue);
  const type=w.type==="book"?"book":w.type==="review"?"academic":(w.type==="book-chapter"||w.type==="dataset"||w.type==="other")?"other":"research";
  return {type,cite:cvCite(o),y:o.y,m:o.m,doi:o.doi,db:conf?(isThai(o.venue)?"PN":"PI"):"",w:"",rel:"",title:o.title,venue:o.venue,src:"OpenAlex"};
}
function cvFromCrossref(m){
  const dp=((m.published||m["published-print"]||m["published-online"]||m.issued||{})["date-parts"]||[[]])[0];
  const o={authors:(m.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(" ")||a.name),title:(m.title||[""])[0],venue:(m["container-title"]||[""])[0],vol:m.volume||"",iss:m.issue||"",pg:m.page||"",y:dp[0]||"",m:dp[1]||"",doi:m.DOI||""};
  const conf=m.type==="proceedings-article";
  return {type:m.type==="book"||m.type==="monograph"?"book":"research",cite:cvCite(o),y:o.y,m:o.m,doi:o.doi,db:conf?(isThai(o.venue)?"PN":"PI"):"",w:"",rel:"",title:o.title,venue:o.venue,src:"Crossref"};
}
async function cvJson(url){const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function cvFetchRun(kind){

    const from=CV_YEAR_MIN()+"-01-01";
    if(kind==="orcid"){const id=(F.orcid||"").trim().replace(/^https?:\/\/orcid\.org\//i,"");if(!/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/i.test(id))throw new Error("รูปแบบ ORCID ไม่ถูกต้อง ตัวอย่าง 0000-0002-1825-0097");
      const j=await cvJson(`https://api.openalex.org/works?filter=author.orcid:${id},from_publication_date:${from}&per-page=100&sort=publication_date:desc`);F.works=(j.results||[]).map(cvFromOpenAlex);F.authors=null;F.note=`พบ ${F.works.length} รายการจาก ORCID ${id} (ปี ${CV_YEAR_MIN()} ขึ้นไป)`}
    else if(kind==="name"){const q=(F.name||"").trim();if(!q)throw new Error("พิมพ์ชื่อภาษาอังกฤษก่อน");
      const j=await cvJson(`https://api.openalex.org/authors?search=${encodeURIComponent(q)}&per-page=15`);F.authors=(j.results||[]).map(a=>({id:(a.id||"").split("/").pop(),name:a.display_name,inst:((a.last_known_institutions||[])[0]||{}).display_name||"",n:a.works_count,orcid:(a.orcid||"").split("/").pop()}));F.works=null;F.note=F.authors.length?`พบ ${F.authors.length} ชื่อที่ใกล้เคียง เลือกชื่อที่เป็นท่าน (ดูจากสังกัด)`:"ไม่พบชื่อนี้ ลองสะกดแบบอื่น หรือใช้ ORCID / DOI"}
    else if(kind==="author"){const j=await cvJson(`https://api.openalex.org/works?filter=author.id:${F.pick},from_publication_date:${from}&per-page=100&sort=publication_date:desc`);F.works=(j.results||[]).map(cvFromOpenAlex);F.note=`พบ ${F.works.length} รายการ (ปี ${CV_YEAR_MIN()} ขึ้นไป)`}
    else if(kind==="doi"){const L=(F.doi||"").split(/[\s,;]+/).map(x=>x.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,"")).filter(x=>/^10\./.test(x));if(!L.length)throw new Error("ใส่ DOI ที่ขึ้นต้นด้วย 10. อย่างน้อย 1 รายการ");
      const out=[];for(const d of L){try{const j=await cvJson("https://api.crossref.org/works/"+encodeURIComponent(d));out.push(cvFromCrossref(j.message))}catch(x){out.push({err:d})}}
      F.works=out.filter(x=>!x.err);F.note=`ดึงได้ ${F.works.length} จาก ${L.length} DOI`+(out.some(x=>x.err)?" · ไม่พบ: "+out.filter(x=>x.err).map(x=>x.err).join(", "):"")}
    const have=new Set(state.cvDraft.pubs.map(p=>(p.doi||"").toLowerCase()).filter(Boolean));
    if(F.works){F.works.forEach(w=>w.dup=!!(w.doi&&have.has(w.doi.toLowerCase())));F.sel=Object.fromEntries(F.works.map((w,i)=>[i,!w.dup]))}
  }catch(x){F.err=(x&&x.message)||String(x);if(/Failed to fetch|NetworkError/i.test(F.err))F.err="เชื่อมต่อแหล่งข้อมูลไม่ได้ ลองใหม่อีกครั้ง"}
  F.loading=false;render();

  rec.at=new Date().toISOString();rec.by=(state.user&&state.user.email)||"";
  state.cv={...(state.cv||{}),[id]:rec};state.cvDraft=null;state.msg="บันทึกประวัติแล้ว";render();

}

  if(d.cvadd){D[d.cvadd].push(d.cvadd==="pubs"?{type:"research",cite:"",y:"",m:"",db:"",w:"",rel:"",doi:""}:{});D.dirty=true;render();return true}
  if(d.cvdel){const [l,i]=d.cvdel.split(":");if(l==="pubs"&&!confirm("ลบผลงานรายการนี้?"))return true;D[l].splice(+i,1);D.dirty=true;render();return true}
  if(d.cvmv){const [l,i,s]=d.cvmv.split(":");const a=+i,b=a+ +s;if(b<0||b>=D[l].length)return true;[D[l][a],D[l][b]]=[D[l][b],D[l][a]];D.dirty=true;render();return true}
  if(d.cvrun){const F=state.cvFetch;F.orcid=(document.getElementById("cvOrcid")||{}).value||"";F.name=(document.getElementById("cvName")||{}).value||"";F.doi=(document.getElementById("cvDoi")||{}).value||"";cvFetchRun(d.cvrun);return true}
  if(d.cvpick){state.cvFetch.pick=d.cvpick;cvFetchRun("author");return true}
  if(d.cvselall){const F=state.cvFetch;F.sel=Object.fromEntries((F.works||[]).map((w,i)=>[i,d.cvselall==="1"]));render();return true}
  if(t.id==="cvImport"){const F=state.cvFetch;const L=(F.works||[]).filter((w,i)=>F.sel[i]);
    L.forEach(w=>{const {dup,title,venue,src,...p}=w;const k=(p.doi||"").toLowerCase();const j=k?D.pubs.findIndex(x=>(x.doi||"").toLowerCase()===k):-1;if(j>=0)D.pubs[j]={...D.pubs[j],cite:p.cite};else D.pubs.push(p)});
    D.pubs=cvSortPub(D.pubs);D.dirty=true;
    if(F.orcid&&!D.orcid&&/^\d{4}-/.test(F.orcid))D.orcid=F.orcid.trim();if(F.name&&!D.nameEn)D.nameEn=F.name.trim();
    state.cvFetch=null;state.msg=`เพิ่ม ${L.length} ผลงานแล้ว เลือกฐาน/ระดับการเผยแพร่และความเกี่ยวข้องให้ครบ แล้วกด "บันทึก"`;render();return true}
  return true;
}
function cvInput(e){
  const t=e.target;if(state.view!=="cv")return false;
  if(t.dataset&&t.dataset.cvsel!==undefined){state.cvFetch.sel[t.dataset.cvsel]=t.checked;const b=document.getElementById("cvImport");if(b)b.textContent=`นำผลงานที่เลือกเข้าประวัติ (${Object.values(state.cvFetch.sel).filter(Boolean).length})`;return true}
  if(!t.dataset||t.dataset.cvf===undefined||!state.cvDraft)return false;
  cvSetPath(state.cvDraft,t.dataset.cvf,t.value);
  const first=!state.cvDraft.dirty;state.cvDraft.dirty=true;
  if(first){const b=document.getElementById("cvSave");if(b){b.disabled=false;b.textContent="บันทึก"}}
  if(t.tagName==="SELECT"&&/^pubs\.\d+\.(db|rel)$/.test(t.dataset.cvf))render();
  return true;
}

      :`<p class="ind"><span class="bk-todo">(ยังไม่มีผลงานในรอบ 5 ปี)</span></p>`;
    const teach=cvTeach(f.id).map(x=>`<p class="li">${esc(x.code)}&emsp;${esc(x.th)}</p>`).join("")||`<p class="ind"><span class="bk-todo">(ยังไม่กำหนดรายวิชา)</span></p>`;
    const exp=c.exp.length?c.exp.map(x=>`<p class="li">- ${esc([x.role,x.org].filter(Boolean).join(" "))}${x.period?" ("+esc(x.period)+")":""}</p>`).join(""):"";
    return `<table class="bk-t" style="width:100%"><thead><tr><th rowspan="2">ลำดับ</th><th rowspan="2">ชื่อ-สกุล<br>ตำแหน่งทางวิชาการ</th><th rowspan="2">คุณวุฒิ (สาขาวิชา)</th><th colspan="2">สำเร็จการศึกษา</th></tr><tr><th>สถาบัน</th><th>ปี พ.ศ.</th></tr></thead><tbody>${rows}</tbody></table>
    <p><b>ภาระหน้าที่ในหลักสูตร :</b> ${role?"อาจารย์ผู้รับผิดชอบหลักสูตร":"อาจารย์ประจำหลักสูตร"}</p><p><b>ผลงานทางวิชาการ</b></p>${pubHtml}
    <p><b>งานสอนในหลักสูตร (ปรับปรุง พ.ศ. 2571)</b></p>${teach}${exp?`<p><b>ประสบการณ์ในด้านปฏิบัติการ</b></p>${exp}`:""}${n<F.length-1?'<div class="bk-break"></div>':""}`}).join("");
