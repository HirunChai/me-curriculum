<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แพลตฟอร์มหลักสูตรเครื่องกล</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b63">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — two-level nav (phase → step), dense working panels; drafting-ink teal accent on graphite neutrals */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2421; --muted:#5d6762; --line:#d9dedb; --soft:#eef1ef;
  --accent:#0f6b63; --accent-soft:#dcefec; --pass:#2f7d3a; --pass-bg:#e3f2e4; --warn:#9a6200; --warn-bg:#fbefd6; --fail:#b3261e; --fail-bg:#fbe3e1;
  --bar:#0f6b63; --bar-over:#b3261e;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2220; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2f3835; --soft:#232a28;
  --accent:#5cc2b6; --accent-soft:#1d3a36; --pass:#7fd08a; --pass-bg:#1e3322; --warn:#f0b54a; --warn-bg:#3a2e14; --fail:#ff8a80; --fail-bg:#3d1f1d;
  --bar:#5cc2b6; --bar-over:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2220; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2f3835; --soft:#232a28;
  --accent:#5cc2b6; --accent-soft:#1d3a36; --pass:#7fd08a; --pass-bg:#1e3322; --warn:#f0b54a; --warn-bg:#3a2e14; --fail:#ff8a80; --fail-bg:#3d1f1d;
  --bar:#5cc2b6; --bar-over:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}

/* PLO list + mind map v2 */
.plo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.plo-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;gap:12px;align-items:flex-start}
.plo-no{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1.1;text-align:center}
.plo-card .pt{font-size:14px;line-height:1.55}
.plo-card .pm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mmx{--k-meet:#c0583a;--k-pol:var(--accent);--k-acc:#6a5acd;--k-sur:#8a938f;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.75fr) minmax(0,1fr);gap:18px 64px;align-items:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mmx{--k-meet:#f0906e;--k-acc:#a99bf5;--k-sur:#7d8783}}
:root[data-theme="dark"] .mmx{--k-meet:#f0906e;--k-acc:#a99bf5;--k-sur:#7d8783}
.mmx svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mmx path{fill:none;stroke-linecap:round;opacity:.55;transition:opacity .15s}
.mmx.hl path{opacity:.08}.mmx.hl path.on{opacity:.95}
.mmx-col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.mmx-src{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,border-color .15s}
.mmx-src:hover,.mmx-src.on{border-color:var(--kc);box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 18%,transparent)}
.mmx-src .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.mmx-src .ic{width:10px;height:10px;border-radius:50%;background:var(--kc);flex:none}
.mmx-src.pending .ic{background:transparent;border:2px dashed var(--kc)}
.mmx-src .bd{font-size:12px;line-height:1.5;color:var(--muted);margin-top:4px}
.mmx-src .bd b{color:var(--ink);font-weight:600}
.mmx-hub{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.mmx-hub .ttl{text-align:center;font-weight:700;font-size:14px}
.mmx-plo{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;font-size:12.5px;cursor:default;transition:border-color .15s}
.mmx-plo.on{border-color:var(--accent)}
.mmx-plo .n{flex:none;background:var(--accent);color:var(--panel);border-radius:999px;padding:2px 8px;font-weight:700;font-size:11.5px}
.mmx-plo .c{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
@media (max-width:820px){.mmx{grid-template-columns:1fr;gap:12px}.mmx svg{display:none}.mmx-hub{order:-1}}
/* org chart ข1 */
.org{--t-ME:#2f5f9e;--t-EV:#b4552a;--t-CE:#2f7d3a;position:relative;padding:4px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .org{--t-ME:#8fb4ea;--t-EV:#f0a37c;--t-CE:#7fd08a}}
:root[data-theme="dark"] .org{--t-ME:#8fb4ea;--t-EV:#f0a37c;--t-CE:#7fd08a}
.org-top{max-width:560px;margin:0 auto;text-align:center;border:2px solid var(--accent);border-radius:10px;background:var(--accent-soft);padding:12px 16px}
.org-top b{display:block;font-size:17px;color:var(--ink)}
.org-core{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 0 0}
.org-core span{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px}
.org-stem{width:2px;height:18px;background:var(--line);margin:0 auto}
.org-bus{height:2px;background:var(--line);margin:0 16.66%}
.org-tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.org-tr{position:relative;padding-top:18px}
.org-tr::before{content:"";position:absolute;top:0;left:50%;width:2px;height:18px;background:var(--line)}
.org-box{border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:10px;background:var(--panel);padding:12px;height:100%}
.org-box h3{margin:0;font-size:15px;color:var(--tc)}
.org-ppl{display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:center;margin-top:12px}
.person{width:96px;text-align:center;font-size:12px;line-height:1.35}
.person .nm{font-weight:600;color:var(--ink)}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;overflow:hidden;background:var(--soft);color:var(--tc,var(--accent));font-weight:700;font-size:20px;border:3px solid var(--tc,var(--accent))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:44px;height:44px;font-size:15px;border-width:2px}
.av.empty{border-style:dashed;color:var(--muted);font-weight:400}
.org-reg{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.org-reg .person{width:84px}
.av-edit{display:flex;align-items:center;gap:8px}
@media (max-width:760px){.org-tracks{grid-template-columns:1fr}.org-bus{display:none}.org-tr::before{display:none}.org-tr{padding-top:10px}}
@media print{nav,.no-print{display:none!important}}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.top{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 14px;margin-bottom:12px}
header.top img.logo{width:52px;height:52px;border-radius:50%;background:#fff;flex:none}
header.top .ttl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
header.top h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
nav.phase{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
nav.phase a{padding:7px 14px;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;background:var(--panel)}
nav.phase a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav.phase a span{font-weight:400;font-size:12px;opacity:.8;margin-left:4px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;font-weight:500;margin-bottom:-1px}
nav.tabs a b{font-family:var(--mono);font-size:12px;margin-right:4px}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0;margin-bottom:12px}
.panel h2{font-size:15px;font-weight:600;margin:0 0 8px}
.panel h3{font-size:14px;font-weight:600;margin:12px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:-4px 0 12px;max-width:80ch}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
td.mono{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
label.ctl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select,input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{width:100%;min-height:52px;resize:vertical}
input[type=number]{width:64px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px}
button.sm{padding:2px 8px;font-size:12.5px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:5px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pass{color:var(--pass);background:var(--pass-bg)} .warn{color:var(--warn);background:var(--warn-bg)} .fail{color:var(--fail);background:var(--fail-bg)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);font-size:11.5px;margin:1px 2px 1px 0}
.code{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin:1px 2px 1px 0;display:inline-block}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.sum .panel{display:flex;flex-direction:column;gap:4px;margin:0}
.sum .big{font-size:22px;font-weight:600}
.checks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.checks .panel{margin:0}
.check{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check .t{font-weight:500}
.check .d{grid-column:2;color:var(--muted);font-size:12.5px}
.lv{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:0 5px;border-radius:3px}
.lv.I{color:var(--muted);background:var(--soft)} .lv.R{color:var(--accent);background:var(--accent-soft)} .lv.M{color:var(--panel);background:var(--accent)}
.lv.dft{outline:1px dashed var(--muted);outline-offset:1px}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--accent);vertical-align:middle}
.bar{height:8px;background:var(--soft);border-radius:4px;position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--bar)}
.bar i.over{background:var(--bar-over)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.tt{display:grid;grid-template-columns:52px repeat(5,minmax(110px,1fr));min-width:640px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tt .h{background:var(--soft);font-weight:600;font-size:12px;padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.tt .tm{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px;border-top:1px solid var(--line);text-align:right}
.tt .cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:34px;position:relative}
.tt .ev{position:absolute;left:2px;right:2px;top:2px;border-radius:4px;padding:3px 5px;font-size:11.5px;line-height:1.3;background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent);overflow:hidden;z-index:1}
.tt .ev.p{border-left-color:var(--warn);background:var(--warn-bg)}
.tt .ev .c{font-family:var(--mono);font-weight:600}
.tt .lunch{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 4px,transparent 4px,transparent 8px)}
.note{background:var(--soft);border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.form{display:grid;gap:8px;padding:10px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);margin:8px 0}
.form .fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form label{font-size:12.5px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);margin-right:6px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:2px 4px}
.err{color:var(--fail);font-size:12.5px}
.clo-row{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.clo-row:first-child{border-top:0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.flow span{padding:2px 8px;border-radius:4px;background:var(--soft)}
.flow span.on{background:var(--accent);color:var(--panel);font-weight:600}
.mm{display:grid;gap:10px;grid-template-columns:1fr minmax(150px,.8fr) 1fr;grid-template-areas:"a . b" "c z d" "e . f"}
.mm-c{align-self:center;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.mm-card{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 10px;background:var(--panel)}
.mm-card:hover{background:var(--soft)}
.mm-t{display:block;margin-bottom:4px;font-size:13.5px}
.mm-l{font-size:12.5px;line-height:1.5}
.k-meet{border-left-color:#c0583a} .k-pol{border-left-color:var(--accent)} .k-acc{border-left-color:#6a5acd} .k-sur{border-left-style:dashed;border-left-color:var(--muted)}
.lg{display:inline-block;width:12px;height:12px;border-left:4px solid;margin-right:4px;vertical-align:middle}
.lg.k-meet{border-color:#c0583a}.lg.k-pol{border-color:var(--accent)}.lg.k-acc{border-color:#6a5acd}.lg.k-sur{border-color:var(--muted);border-left-style:dashed}
@media (max-width:720px){.mm{grid-template-columns:1fr;grid-template-areas:"z" "a" "b" "c" "d" "e" "f"}}
@media (max-width:640px){header.top{flex-wrap:wrap}header.top .userbar{margin-left:0!important;width:100%;flex:1 1 100%!important}}
@media (max-width:520px){header.top h1{font-size:18px}.checks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <img class="logo" src="icons/icon-192.png" alt="ตราสาขาวิชาวิศวกรรมเครื่องกล คณะวิศวกรรมศาสตร์">
    <div class="ttl"><h1>แพลตฟอร์มหลักสูตร วศ.บ. วิศวกรรมเครื่องกล</h1>
    <span class="sub">ร่างหลักสูตรปรับปรุง พ.ศ. 2571 · 3 แขนง · มทร.กรุงเทพ</span></div>
  </header>
  <nav class="phase" aria-label="กลุ่มงาน" id="phase"></nav>
  <nav class="tabs" aria-label="ขั้นตอน" id="tabs"></nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const TRACKS={ME:"วิศวกรรมเครื่องกล",EV:"วิศวกรรมยานยนต์พลังงานใหม่",CE:"วิศวกรรมพลังงาน"};
const GROUPS={GE:"ศึกษาทั่วไป",MS:"คณิตศาสตร์และวิทยาศาสตร์",EB:"พื้นฐานทางวิศวกรรม",CORE:"วิชาชีพบังคับ (แกนร่วม)",TR:"บังคับแขนง",TE:"เลือกแขนง",EXP:"เสริมสร้างประสบการณ์",FREE:"เลือกเสรี"};
const TERMS=["Y1S1","Y1S2","Y2S1","Y2S2","Y2SS","Y3S1","Y3S2","Y4S1","Y4S2"];
const TERM_TH={Y1S1:"ปี 1 ภาค 1",Y1S2:"ปี 1 ภาค 2",Y2S1:"ปี 2 ภาค 1",Y2S2:"ปี 2 ภาค 2",Y2SS:"ปี 2 ภาคฤดูร้อน",Y3S1:"ปี 3 ภาค 1",Y3S2:"ปี 3 ภาค 2",Y4S1:"ปี 4 ภาค 1",Y4S2:"ปี 4 ภาค 2"};
const SEM={S1:["Y1S1","Y2S1","Y3S1","Y4S1"],S2:["Y1S2","Y2S2","Y3S2","Y4S2"],SS:["Y2SS"]};
const SEM_TH={S1:"ภาคการศึกษาที่ 1",S2:"ภาคการศึกษาที่ 2",SS:"ภาคฤดูร้อน"};
const EXPERTISE={mech:"กลศาสตร์และการออกแบบ",thermo:"ความร้อนและของไหล",ctrl:"ระบบควบคุมและไฟฟ้า",auto:"ยานยนต์และ EV",energy:"พลังงาน",shop:"ปฏิบัติการและโรงฝึกงาน",math:"คณิตศาสตร์วิศวกรรม"};
const A="ALL";
const C=(code,th,cr,t,p,s,g,tr,term,dept,dom,plo,coe=[],fl={})=>({code,th,cr,t,p,s,g,tr,term,dept,dom,plo,coe,fl});
const BASE=[
C("GE-1","ศึกษาทั่วไป: ภาษาเพื่อการสื่อสารในโลกสมัยใหม่",3,3,0,6,"GE",A,"Y1S1","EXT","",{4:"I"}),

let COURSES=[];
function rebuild(){
  const out=[];
  BASE.forEach(b=>{const o=state.courseOv[b.code];if(o&&o.deleted)return;out.push(o?{...b,...o,plo:b.plo,coe:b.coe,fl:{...b.fl,edited:true}}:b)});
  Object.values(state.courseOv).forEach(o=>{if(o.deleted||BASE.some(b=>b.code===o.code))return;out.push({plo:{},coe:[],dom:"",dept:"ME",tr:A,...o,fl:{added:true}})});
  COURSES=out.sort((a,b)=>TERMS.indexOf(a.term)-TERMS.indexOf(b.term));
}
const needs=()=>{const m={};NEEDS0.forEach(n=>m[n.id]=n);Object.values(state.needsOv).forEach(o=>{if(o.deleted)delete m[o.id];else m[o.id]={...(m[o.id]||{}),...o}});return Object.values(m)};
const clos=code=>{const o=state.cloOv[code];if(o)return o.items||[];return (CLO0[code]||[]).map(([t,subs,bloom,lv,as])=>({t,subs,bloom,lv,as}))};
const hasClo=code=>clos(code).length>0;
function ploOf(c){
  const L=clos(c.code);if(!L.length)return {map:c.plo,src:"default"};
  const m={};L.forEach(x=>(x.subs||[]).forEach(s=>{const sb=subOf(s);if(!sb)return;const p=sb.plo;if(!m[p]||LV_RANK[x.lv]>LV_RANK[m[p]])m[p]=x.lv}));
  return {map:m,src:"clo"};
}
const inTrack=(c,t)=>c.tr===A||(Array.isArray(c.tr)&&c.tr.includes(t));
const trackCourses=t=>COURSES.filter(c=>inTrack(c,t));
const sumCr=(list,f=()=>true)=>list.filter(f).reduce((a,c)=>a+(+c.cr||0),0);

// ---- OBE analyses ----
function needsAnalysis(){
  const L=needs();const per={};PLOS.forEach(p=>per[p.n]=L.filter(n=>(n.plos||[]).includes(p.n)));
  const surveyHave=L.filter(n=>n.g==="SUR"&&n.st==="have");
  const orphan=L.filter(n=>n.st==="have"&&!(n.plos||[]).length);
  const noSrc=PLOS.filter(p=>!per[p.n].length);
  const noSurvey=PLOS.filter(p=>!per[p.n].some(n=>n.g==="SUR"&&n.st==="have"));
  return {L,per,surveyHave,orphan,noSrc,noSurvey,wait:L.filter(n=>n.st==="wait")};
}
function ploTextChecks(){
  return PLOS.map(p=>{const bad=BANNED.filter(w=>p.t.includes(w));const subs=SUBS.filter(s=>s.plo===p.n);
    const maxSub=Math.max(0,...subs.map(s=>BLOOM_RANK[s.bloom]));
    return {p,bad,subs,maxSub,ok:!bad.length&&subs.length>0}});
}
function yloAnalysis(){
  const used=new Set(YLOS.flatMap(y=>y.subs));
  const unused=SUBS.filter(s=>!used.has(s.code));
  const peak=YLOS.map(y=>Math.max(...y.subs.map(c=>BLOOM_RANK[(subOf(c)||{}).bloom]||0)));
  const prog=peak.every((v,i)=>i===0||v>=peak[i-1]);
  return {unused,peak,prog};
}
function cloAnalysis(t){
  const L=trackCourses(t),rows=[];
  const subCov={};SUBS.forEach(s=>subCov[s.code]=[]);
  L.forEach(c=>clos(c.code).forEach(x=>(x.subs||[]).forEach(s=>{if(subCov[s])subCov[s].push({c,lv:x.lv})})));
  const seq=PLOS.map(p=>{const at={I:[],R:[],M:[]};L.forEach(c=>{const l=ploOf(c).map[p.n];if(l)at[l].push(TERMS.indexOf(c.term))});
    const first=k=>at[k].length?Math.min(...at[k]):null;const fI=first("I"),fR=first("R"),fM=first("M");
    const pre=[fI,fR].filter(v=>v!==null);const ok=fM!==null&&pre.length&&Math.min(...pre)<=fM;
    const n=L.filter(c=>ploOf(c).map[p.n]).length;
    return {p,fI,fR,fM,ok,n,hasI:fI!==null}});
  const withClo=L.filter(c=>hasClo(c.code)),me=L.filter(c=>c.dept==="ME"&&c.g!=="FREE");
  const cnt=withClo.filter(c=>{const k=clos(c.code).length;return k<3||k>6});
  const mNoAssess=[];const lowBloomM=[];const banned=[];
  withClo.forEach(c=>clos(c.code).forEach((x,i)=>{if(x.lv==="M"&&!(x.as||"").trim())mNoAssess.push(c.code+" CLO"+(i+1));if(x.lv==="M"&&BLOOM_RANK[x.bloom]<3)lowBloomM.push(c.code+" CLO"+(i+1));if(BANNED.some(w=>(x.t||"").includes(w)))banned.push(c.code+" CLO"+(i+1))}));
  const wide=L.filter(c=>Object.keys(ploOf(c).map).length>4);
  return {L,subCov,seq,withClo,me,cnt,mNoAssess,lowBloomM,banned,wide,uncovered:SUBS.filter(s=>!subCov[s.code].length)};
}

function evaluate(t){
  const L=trackCourses(t), out=[];
  const total=sumCr(L), ge=sumCr(L,c=>c.g==="GE"), free=sumCr(L,c=>c.g==="FREE");
  const ms=sumCr(L,c=>c.g==="MS")+(state.countComputing?sumCr(L,c=>c.fl.computing):0);
  const eng=sumCr(L,c=>["EB","CORE","TR","TE"].includes(c.g)&&!c.fl.computing);
  const T=[];
  T.push({s:total>=120?"pass":"fail",t:`หน่วยกิตรวม ${total} (ขั้นต่ำ 120)`,d:"เกณฑ์มาตรฐานหลักสูตรปริญญาตรี พ.ศ. 2565"});

  T.push({s:free>=6?"pass":"fail",t:`เลือกเสรี ${free} หน่วยกิต (ขั้นต่ำ 6)`,d:""});
  const bad=TERMS.map(k=>[k,sumCr(L,c=>c.term===k)]).filter(([k,v])=>k==="Y4S2"?false:k.endsWith("SS")?v>9:(v<9||v>22));
  T.push({s:bad.length?"fail":"pass",t:"หน่วยกิตต่อภาค 9–22 · ฤดูร้อนไม่เกิน 9",d:bad.length?bad.map(([k,v])=>`${TERM_TH[k]} ${v} นก.`).join(" · "):"ทุกภาคอยู่ในช่วง (ภาคสหกิจยกเว้น)"});
  const doms=new Set(PLOS.flatMap(p=>p.d.split(", ")));
  T.push({s:["K","S","E","C"].every(x=>doms.has(x))?"pass":"fail",t:"PLO ครบ 4 ด้าน K S E C",d:"ไม่ครบ 4 ด้าน สป.อว. จะไม่รับทราบหลักสูตร"});
  const pt=ploTextChecks().filter(x=>x.bad.length);

  K.push({s:"warn",t:"Health, Safety and Environment",d:"ยังไม่มีวิชาบังคับด้านความปลอดภัยโดยตรง ต้องแสดงสัดส่วนเนื้อหาใน 4-100-101 และ 4-001-301 หรือย้าย 4-116-409 เป็นวิชาบังคับ"});
  out.push(["สภาวิศวกร (รับรองปริญญา)",K]);
  const B=[];

  B.push({s:eng>=45?"pass":"fail",t:`หัวข้อวิศวกรรม ${eng} หน่วยกิต (ขั้นต่ำ 45)`,d:""});
  B.push({s:L.some(c=>c.fl.capstone)?"warn":"fail",t:"โครงงานปีสุดท้ายเป็นปัญหาซับซ้อน",d:"มี 4-116-307/408 แล้ว ต้องเขียนเกณฑ์ WP1–WP7 ใน rubric"});
  WA.forEach(([k,n,p,sub])=>{let s=p.length?"pass":"fail",extra="";

  const peoGap=PLOS.filter(p=>!PEOS.some(e=>e.plos.includes(p.n)));

  ca.seq.forEach(x=>Q.push({s:x.fM===null?"fail":x.ok?"pass":"warn",t:`PLO${x.p.n} พัฒนาตามลำดับ I → R → M`,d:x.fM===null?"ไม่มีวิชาระดับ M":`เริ่ม ${x.fI!==null?TERM_TH[TERMS[x.fI]]:"(ไม่มี I)"} · M ครั้งแรก ${TERM_TH[TERMS[x.fM]]} · ${x.n} วิชา`}));

  const meNo=ca.me.filter(c=>!hasClo(c.code));
  Q.push({s:meNo.length?"warn":"pass",t:`วิชาที่สาขาสอนมี CLO ${ca.me.length-meNo.length}/${ca.me.length} วิชา`,d:meNo.length?"วิชาที่เหลือใช้ระดับ I/R/M ตั้งต้น ต้องร่าง CLO ใน ก3":"ครบ"});
  Q.push({s:"pass",t:"มีการประเมินทั้ง direct และ indirect",d:"rubric ในรายวิชา + exit survey + แบบสำรวจผู้ใช้บัณฑิต"});
  out.push(["AUN-QA v4.0 (OBE)",Q]);
  return {out,total,ms,eng,ge};
}

function compressLabs(labs){
  const out=[];const groups={};
  labs.forEach(l=>{const m=l.match(/^(ข้อ |WA)(\d+)$/);if(m){(groups[m[1]]=groups[m[1]]||[]).push(m[2])}else if(!out.includes(l))out.push(l)});
  Object.entries(groups).forEach(([pre,nums])=>out.push(pre+[...new Set(nums)].join(", ")));
  return out.join(", ");
}

function drawMM(){

let EXPECTED={};
function buildExpected(){

    if(CLO0[c.code]){const m={};CLO0[c.code].forEach(([t,subs,bl,lv])=>subs.forEach(s=>{const sb=subOf(s);if(!sb)return;if(!m[sb.plo]||LV_RANK[lv]>LV_RANK[m[sb.plo]])m[sb.plo]=lv}));EXPECTED[c.code]=m}
    else EXPECTED[c.code]={...(c.plo||{})};
  });
}
const VERBS=[
 [1,["ระบุ","บอก","จำ","ทบทวน","แสดงรายการ","นิยาม"]],
 [2,["อธิบาย","สรุป","ยกตัวอย่าง","แปลความ","บรรยาย","จำแนกประเภท"]],
 [3,["ใช้","คำนวณ","ประยุกต์","ปฏิบัติ","ดำเนินการ","ต่อวงจร","ติดตั้ง","เขียน","แก้ปัญหา","ทดลอง","วัด","ขึ้นรูป","บันทึก","จัดทำ","สร้างแบบจำลอง"]],
 [4,["วิเคราะห์","เปรียบเทียบ","จำแนก","หาสาเหตุ","กำหนดปัญหา","กำหนดข้อกำหนด","ตรวจหา"]],
 [5,["ประเมิน","ตัดสินใจ","เลือก","วิพากษ์","ตรวจสอบความถูกต้อง","ปรับแบบ","ตัดสิน"]],
 [6,["ออกแบบ","สร้าง","พัฒนา","วางแผน","ประดิษฐ์","เสนอแนวคิด","คิดค้น"]]];
const AFFECTIVE=["Receive","Respond","Value","Organize","Characterize"];
function verbLevel(t){
  t=(t||"").trim();let best=null;
  VERBS.forEach(([lv,ws])=>ws.forEach(w=>{if(t.startsWith(w)&&(!best||w.length>best.w.length))best={lv,w}}));
  return best;
}
const LVN={I:"I แนะนำ",R:"R ฝึกซ้ำ",M:"M ประเมินการบรรลุ"};
function alignIssues(code,items){
  const out=[],add=(lv,i,msg)=>out.push({lv,i,msg});
  const c=COURSES.find(x=>x.code===code);if(!c)return out;
  if(!items.length){add("err",null,"ยังไม่มี CLO");return out}
  if(items.length<3)add("warn",null,`มี CLO ${items.length} ข้อ แม่แบบแนะนำ 3–5 ข้อต่อวิชา`);
  if(items.length>6)add("warn",null,`มี CLO ${items.length} ข้อ มากเกินไปสำหรับการประเมินในหนึ่งภาค`);
  items.forEach((x,i)=>{
    const t=(x.t||"").trim(),subs=(x.subs||[]).map(subOf).filter(Boolean);
    if(t.length<12)add("err",i,"ข้อความ CLO สั้นเกินไปหรือยังไม่ได้กรอก");
    const bad=BANNED.filter(w=>t.includes(w));if(bad.length)add("err",i,`ใช้คำที่แม่แบบห้าม: ${bad.join(", ")} ให้ขึ้นต้นด้วยคำกริยาที่วัดได้`);
    if(!subs.length)add("err",i,"ไม่ได้โยงกับ Sub-PLO ใดเลย จึงไม่ตอบ PLO ของหลักสูตร");
    if(x.lv==="M"&&!(x.as||"").trim())add("err",i,"ระดับ M ต้องระบุวิธีประเมินที่ใช้วัดการบรรลุ");
    const vb=verbLevel(t);
    if(t&&!vb)add("info",i,"ไม่พบคำกริยาที่วัดได้ต้นประโยค ตรวจว่าขึ้นต้นด้วย action verb");
    if(vb&&!AFFECTIVE.includes(x.bloom)&&Math.abs(vb.lv-(BLOOM_RANK[x.bloom]||0))>=2)add("warn",i,`คำกริยา "${vb.w}" มักอยู่ระดับ ${BLOOM[vb.lv-1]} แต่เลือก Bloom เป็น ${x.bloom}`);
    subs.forEach(s=>{
      if(x.lv==="M"&&BLOOM_RANK[x.bloom]<BLOOM_RANK[s.bloom])add("warn",i,`ระดับ M แต่ Bloom (${x.bloom}) ต่ำกว่าที่ ${s.code} กำหนด (${s.bloom})`);
      if((s.dom==="K"||s.dom==="S")&&AFFECTIVE.includes(x.bloom))add("warn",i,`${s.code} เป็นด้าน${s.dom==="K"?"ความรู้":"ทักษะ"} ควรใช้ Bloom ด้านพุทธิพิสัย ไม่ใช่ ${x.bloom}`);
    });
  });
  const got={};items.forEach(x=>(x.subs||[]).forEach(s=>{const sb=subOf(s);if(!sb)return;if(!got[sb.plo]||LV_RANK[x.lv]>LV_RANK[got[sb.plo]])got[sb.plo]=x.lv}));
  const exp=EXPECTED[code]||{};
  PLOS.forEach(p=>{const e=exp[p.n],g=got[p.n];
    if(e&&!g)add(e==="M"?"err":"warn",null,`หลักสูตรกำหนดให้วิชานี้รับผิดชอบ PLO${p.n} ระดับ ${LVN[e]} แต่ไม่มี CLO ที่โยงกับ PLO${p.n}`);
    else if(e&&g&&LV_RANK[g]<LV_RANK[e])add(e==="M"?"err":"warn",null,`PLO${p.n} หลักสูตรกำหนดระดับ ${e} แต่ CLO ให้สูงสุดแค่ระดับ ${g}`);
    else if(!e&&g)add("info",null,`CLO โยงกับ PLO${p.n} ซึ่งไม่อยู่ใน Curriculum Mapping ของวิชานี้ ต้องแจ้งกรรมการหลักสูตรเพื่อปรับ mapping`);
  });
  return out;
}

// ---- ข1 โครงสร้างหลักสูตรและอาจารย์ ----
const DEG={D:"ปริญญาเอก",M:"ปริญญาโท",B:"ปริญญาตรี"};
const POS={L:"อาจารย์",AP:"ผู้ช่วยศาสตราจารย์",AsP:"รองศาสตราจารย์",P:"ศาสตราจารย์"};
const QUAL0={f01:{deg:"D",pos:"AsP"},f02:{deg:"M",pos:"AP"},f03:{deg:"M",pos:"AP"},f04:{deg:"D",pos:"L"},f05:{deg:"M",pos:"L"},f06:{deg:"M",pos:"AP"},f07:{deg:"B",pos:"L"},f08:{deg:"M",pos:"L"},f09:{deg:"M",pos:"L"},f10:{deg:"M",pos:"L"},f11:{deg:"M",pos:"L"},f12:{deg:"D",pos:"L"}};
const qualOf=id=>({...(QUAL0[id]||{deg:"",pos:""}),...((state.team.qual||{})[id]||{})});
const roleOf=id=>(state.team.role||{})[id]||"";
function teamAnalysis(){
  const F=state.faculty;const per={};Object.keys(TRACKS).forEach(t=>per[t]=F.filter(f=>roleOf(f.id)===t));
  const lowDeg=F.filter(f=>roleOf(f.id)&&qualOf(f.id).deg==="B");
  const noQual=F.filter(f=>roleOf(f.id)&&!qualOf(f.id).deg);
  const regular=F.filter(f=>!roleOf(f.id));
  return {per,lowDeg,noQual,regular,short:Object.keys(TRACKS).filter(t=>per[t].length<3)};
}
async function saveTeam(t){state.team=t;render();await dbWrite(db=>db.doc("program/team").set({...t,updatedAt:new Date().toISOString()}),"อาจารย์ผู้รับผิดชอบหลักสูตร")}
const formalName=f=>{const n=shortName(f.name),p=qualOf(f.id).pos;return p&&p!=="L"?POS[p]+n:p==="L"?"นาย"+n:n};
const shortName=n=>String(n||"").trim().replace(/^(?:ผู้ช่วยศาสตราจารย์|รองศาสตราจารย์|ศาสตราจารย์|อาจารย์|นางสาว|นาย|นาง)\s*/,"").replace(/^(?:[ก-๙A-Za-z]{1,4}\.)+\s*/,"").trim();
const initials=n=>{const s=shortName(n);return /^[เแโใไ]/.test(s)?s.slice(0,2):s.slice(0,1)};
const avatar=(f,cls="")=>{const img=state.photos[f.id];return `<div class="av ${cls}">${img?`<img src="${esc(img)}" alt="">`:esc(initials(f.name))}</div>`};
const person=(f,cls="")=>{const q=qualOf(f.id);return `<div class="person">${avatar(f,cls)}<div class="nm">${esc(f.name)}</div><div class="muted">${[POS[q.pos],DEG[q.deg]].filter(Boolean).join(" · ")}</div></div>`};
function orgChart(ta){

  const anyT=Object.keys(TRACKS)[0],L0=trackCourses(anyT);
  const totals=[...new Set(Object.keys(TRACKS).map(t=>sumCr(trackCourses(t))))];
  const box=t=>{const L=trackCourses(t),ppl=ta.per[t],need=Math.max(0,3-ppl.length);
    const trCr=sumCr(L,c=>(c.g==="TR"||c.g==="TE")&&c.tr!==A);
    return `<div class="org-tr" style="--tc:var(--t-${t})"><div class="org-box"><span class="small muted">แขนง</span><h3>${esc(TRACKS[t])}</h3>
    <div class="small muted">วิชาเฉพาะแขนง ${trCr} นก. · รวม ${sumCr(L)} นก.</div>
    <div class="small" style="margin-top:8px;font-weight:600">ผู้รับผิดชอบหลักสูตร ${ppl.length} คน ${need?pill("fail","ขาด "+need):pill("pass","ครบ")}</div>
    <div class="org-ppl">${ppl.map(f=>person(f)).join("")}${Array.from({length:need},()=>`<div class="person"><div class="av empty">?</div><div class="muted">ยังไม่ได้เลือก</div></div>`).join("")}</div></div></div>`};
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">ภาพโครงสร้างหลักสูตรและผู้รับผิดชอบ</h2><button class="sm no-print" id="orgPrint">พิมพ์ / บันทึก PDF</button></div>
  <div class="org" style="margin-top:12px">
   <div class="org-top"><span class="small muted">หลักสูตรปรับปรุง พ.ศ. 2571</span><b>วิศวกรรมศาสตรบัณฑิต สาขาวิชาวิศวกรรมเครื่องกล</b><span class="small">${totals.join(" / ")} หน่วยกิต · ${Object.keys(TRACKS).length} แขนง · อาจารย์ ${state.faculty.length} คน</span></div>
   <div class="org-core"><span>ศึกษาทั่วไป ${sumCr(L0,c=>c.g==="GE")} นก.</span><span>แกนร่วมทุกแขนง ${sumCr(core)} นก.</span><span>เลือกเสรี ${sumCr(L0,c=>c.g==="FREE")} นก.</span></div>
   <div class="org-stem"></div><div class="org-bus"></div>

   <div class="org-ppl" style="justify-content:flex-start">${ta.regular.map(f=>person(f,"sm")).join("")||'<span class="muted small">ไม่มี</span>'}</div></div>
  </div><p class="small muted no-print" style="margin-top:8px">เปลี่ยนรูปอาจารย์ได้ที่ปุ่ม "รูป" ในตารางด้านล่าง ระบบย่อรูปให้อัตโนมัติ</p></section>`;
}
async function setPhoto(fid,file){
  if(!file||!/^image\//.test(file.type)){state.msg="เลือกไฟล์รูปภาพ";render();return}
  const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const S=200,cv=document.createElement("canvas");cv.width=cv.height=S;const s=Math.min(im.width,im.height);
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,S,S);g.drawImage(im,(im.width-s)/2,(im.height-s)/2*0.6,s,s,0,0,S,S);
  const img=cv.toDataURL("image/jpeg",0.82);state.photos[fid]=img;render();
  await dbWrite(db=>db.doc("photo/"+fid).set({fid,img,updatedAt:new Date().toISOString()}),"รูปอาจารย์");
}
async function delPhoto(fid){delete state.photos[fid];render();await dbWrite(db=>db.doc("photo/"+fid).delete(),"รูปอาจารย์")}

function mapGroups(){
  const sp=["MS","EB","CORE","EXP"];
  const core=COURSES.filter(c=>c.tr===A&&sp.includes(c.g));
  const gs=[{k:"core",t:"รายวิชาแกน (เรียนร่วมทุกแขนง)",L:core}];
  Object.entries(TRACKS).forEach(([k,v])=>{
    gs.push({k:k+"-TR",t:`แขนง${v} · บังคับแขนง`,L:COURSES.filter(c=>c.g==="TR"&&inTrack(c,k)&&c.tr!==A)});
    gs.push({k:k+"-TE",t:`แขนง${v} · เลือกแขนง`,L:COURSES.filter(c=>c.g==="TE"&&inTrack(c,k)&&c.tr!==A)});
  });
  return gs.filter(g=>g.L.length);
}
function mappingGrouped(){
  const head=`<tr><th>ภาค</th><th>รหัส</th><th>รายวิชา</th><th>นก.</th>${PLOS.map(p=>`<th class="c">PLO${p.n}</th>`).join("")}<th>ที่มา</th></tr>`;
  const row=c=>{const r=ploOf(c);return `<tr><td class="small muted">${TERM_TH[c.term]||""}</td><td class="mono">${esc(c.code)}</td><td>${esc(c.th)}</td><td class="num">${c.cr}</td>${PLOS.map(p=>`<td class="c">${lvSpan(r.map[p.n],r.src==="default")}</td>`).join("")}<td class="small">${r.src==="clo"?`CLO ${clos(c.code).length} ข้อ`:'<span class="muted">ตั้งต้น</span>'}</td></tr>`};
  const foot=L=>`<tr><td colspan="4" class="small muted r">วิชาที่ประเมินระดับ M</td>${PLOS.map(p=>{const n=L.filter(c=>ploOf(c).map[p.n]==="M").length;return `<td class="c num small">${n||"–"}</td>`}).join("")}<td></td></tr>`;
  return `<section class="panel"><h2>Curriculum Mapping · PLO × รายวิชา แยกแกนร่วมและแขนง</h2><p class="lead">หมวดวิชาเฉพาะทั้งหมด (พื้นฐานวิชาชีพ วิชาชีพบังคับ เสริมประสบการณ์ และวิชาของแต่ละแขนง) ไม่รวมศึกษาทั่วไปและเลือกเสรี วิชาเลือกแขนงแสดงเฉพาะวิชาที่เสนอไว้</p><div class="scroll"><table>${mapGroups().map(g=>`<tr><th colspan="${PLOS.length+5}" style="background:var(--soft);color:var(--ink)">${g.t} · ${g.L.length} วิชา ${sumCr(g.L)} นก.</th></tr>${head}${g.L.map(row).join("")}${foot(g.L)}`).join("")}</table></div></section>`;
}

function units(sem){
  const res=[];
  COURSES.filter(c=>SEM[sem].includes(c.term)&&c.dept==="ME"&&!c.fl.coop).forEach(c=>{
    const n=c.tr===A?state.intake.ME+state.intake.EV+state.intake.CE:c.tr.reduce((a,t)=>a+(state.intake[t]||0),0);
    if(n<=0)return;const year=+c.term[1];
    if(c.t>0){const ls=Math.max(1,Math.ceil(n/60));for(let i=1;i<=ls;i++)res.push({key:`${c.code}|L${i}`,c,part:"L",sec:i,secs:ls,hrs:+c.t,n:Math.ceil(n/ls),year});}
    if(c.p>0){const ps=Math.max(1,Math.ceil(n/20));for(let i=1;i<=ps;i++)res.push({key:`${c.code}|P${i}`,c,part:"P",sec:i,secs:ps,hrs:+c.p,n:Math.ceil(n/ps),year});}
  });
  return res;
}
function loads(sem){
  const U=units(sem),m={};state.faculty.forEach(f=>m[f.id]={h:0,n:0,codes:new Set()});
  let un=0;U.forEach(u=>{const f=state.assign[sem][u.key];if(f&&m[f]){m[f].h+=u.hrs;m[f].codes.add(u.c.code)}else un+=u.hrs});
  Object.values(m).forEach(x=>x.n=x.codes.size);
  return {U,m,un,total:U.reduce((a,u)=>a+u.hrs,0)};
}
function autoAssign(sem,all){
  const U=units(sem).sort((a,b)=>b.hrs-a.hrs), A2=all?{}:{...state.assign[sem]};
  const ids=new Set(state.faculty.map(f=>f.id));Object.keys(A2).forEach(k=>{if(!ids.has(A2[k]))delete A2[k]});
  const load={};state.faculty.forEach(f=>load[f.id]=0);
  U.forEach(u=>{if(A2[u.key])load[A2[u.key]]+=u.hrs});
  const owner={};U.forEach(u=>{if(A2[u.key])owner[u.c.code]=A2[u.key]});
  U.forEach(u=>{if(A2[u.key])return;let best=null,score=Infinity;
    state.faculty.forEach(f=>{let s=load[f.id];if(u.c.dom&&(f.tags||[]).includes(u.c.dom))s-=1.5;if(owner[u.c.code]===f.id)s-=3;if(s<score){score=s;best=f.id}});
    if(best){A2[u.key]=best;load[best]+=u.hrs;owner[u.c.code]=owner[u.c.code]||best}});
  return A2;
}

  try{await fn(state.db);return true}catch(e){state.msg=e&&e.code==="invalid_argument"?`บัญชีนี้ไม่มีสิทธิ์แก้ไข${label}`:`บันทึก${label}ไม่สำเร็จ ลองอีกครั้ง`;if(e&&e.code==="invalid_argument")state.canWrite=false;render();return false}
}

const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];
const HOURS=[8,9,10,11,13,14,15,16];
function events(sem){
  const ev=[];
  units(sem).filter(u=>!u.c.fl.capstone).forEach(u=>{const h=u.hrs;const parts=h>4?[Math.ceil(h/2),Math.floor(h/2)]:[h];
    parts.forEach((len,j)=>ev.push({id:u.key+"#"+j,u,len,fac:state.assign[sem][u.key]||null,year:u.year,grp:u.c.tr===A?(u.part==="P"&&u.secs>1?"S"+u.sec:"ALL"):u.c.tr[0]}))});
  return ev.sort((a,b)=>b.len-a.len||a.year-b.year);
}
function clash(a,b){if(a.fac&&a.fac===b.fac)return true;if(a.year!==b.year)return false;
  if(a.grp==="ALL"||b.grp==="ALL")return true;
  if(a.grp[0]==="S"&&b.grp[0]==="S")return a.grp===b.grp||a.u.c.code!==b.u.c.code;
  if(a.grp[0]==="S"||b.grp[0]==="S")return true;
  return a.grp===b.grp}
function schedule(sem){
  const ev=events(sem),placed=[],fail=[];
  const slotsFor=(len,wed)=>{const r=[];for(let d=0;d<5;d++)[[0,4],[4,8]].forEach(([s,e])=>{if(d===2&&s===4&&!wed)return;for(let i=s;i+len<=e;i++)r.push([d,i])});return r};
  const tryPlace=(e,wed)=>{let best=null,bs=Infinity;
    slotsFor(e.len,wed).forEach(([d,i])=>{const ok=placed.every(p=>p.d!==d||p.i+p.len<=i||i+e.len<=p.i||!clash(p,e));if(!ok)return;
      const dayLoad=placed.filter(p=>p.d===d&&p.year===e.year).reduce((a,p)=>a+p.len,0)+(e.fac?placed.filter(p=>p.d===d&&p.fac===e.fac).reduce((a,p)=>a+p.len,0):0);
      const s=dayLoad*10+i;if(s<bs){bs=s;best=[d,i]}});
    if(best)placed.push({...e,d:best[0],i:best[1]});return !!best};
  let wedUsed=0;
  ev.forEach(e=>{if(e.len>4){fail.push(e);return}if(!tryPlace(e,false)){if(tryPlace(e,true))wedUsed++;else fail.push(e)}});
  return {placed,fail,wedUsed};
}
function viewTimetable(){
  const sem=state.sem,{placed,fail,wedUsed}=schedule(sem),F=state.faculty;
  const years=[...new Set(SEM[sem].map(k=>+k[1]))];
  const keys=state.ttMode==="fac"?F.map(f=>[f.id,f.name]):years.flatMap(y=>[[`${y}:ALL`,`ชั้นปี ${y} ทุกแขนง`],...Object.keys(TRACKS).map(t=>[`${y}:${t}`,`ชั้นปี ${y} แขนง${TRACKS[t]}`])]);
  if(!keys.some(k=>k[0]===state.ttKey))state.ttKey=keys[0]?keys[0][0]:"";
  const mine=placed.filter(p=>{if(state.ttMode==="fac")return p.fac===state.ttKey;const [y,t]=state.ttKey.split(":");if(p.year!==+y)return false;return t==="ALL"?p.grp==="ALL"||p.grp[0]==="S":p.grp===t||p.grp==="ALL"||p.grp[0]==="S"});
  const hrs=mine.reduce((a,p)=>a+p.len,0);
  let grid=`<div class="tt"><div class="h"></div>${DAYS.map(d=>`<div class="h">${d}</div>`).join("")}`;
  HOURS.forEach((h,i)=>{grid+=`<div class="tm">${String(h).padStart(2,"0")}:00</div>`;for(let d=0;d<5;d++){const e=mine.filter(p=>p.d===d&&p.i===i);const lunch=d===2&&i>=4;
    grid+=`<div class="cell ${lunch?"lunch":""}">${e.map(p=>`<div class="ev ${p.u.part==="P"?"p":""}" style="height:calc(${p.len*100}% + ${(p.len-1)}px - 4px)"><span class="c">${esc(p.u.c.code)}</span> ${p.u.part==="L"?"บรรยาย":"ปฏิบัติ"}${p.u.secs>1?" ก."+p.u.sec:""}<br>${esc(p.u.c.th)}${state.ttMode==="coh"?`<br><span class="muted">${esc((F.find(f=>f.id===p.fac)||{}).name||"ยังไม่จัดผู้สอน")}</span>`:`<br><span class="muted">ปี ${p.year}</span>`}</div>`).join("")}</div>`}});
  grid+=`</div>`;
  return `<div class="row" style="margin-bottom:12px">${semSeg()}
   <div class="seg" role="group" aria-label="มุมมอง"><button data-tt="fac" aria-pressed="${state.ttMode==="fac"}">รายอาจารย์</button><button data-tt="coh" aria-pressed="${state.ttMode==="coh"}">รายชั้นปี</button></div>

const SB=(window.APP_CONFIG||{});
let sb=null;
function sbErr(e){const m=(e&&(e.message||e.msg))||String(e);return {code:/row-level security|permission|42501/i.test(m+(e&&e.code||""))?"invalid_argument":"error",message:m}}
function makeSbDb(){
  const listeners=[];let cache={};let loaded=false;
  async function refresh(){
    const {data,error}=await sb.from("kv").select("collection,id,data");
    if(error){state.msg="โหลดข้อมูลไม่สำเร็จ: "+error.message;render();return}
    const c={};data.forEach(r=>{(c[r.collection]=c[r.collection]||{})[r.id]=r.data});cache=c;loaded=true;listeners.forEach(l=>l());
  }
  const snapDoc=path=>{const [c,id]=path.split("/");const d=(cache[c]||{})[id];return {exists:!!d,data:()=>d}};
  const snapCol=c=>({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  const sub=f=>{listeners.push(f);if(loaded)f()};
  sb.channel("kv-live").on("postgres_changes",{event:"*",schema:"public",table:"kv"},p=>{
    const r=p.new&&p.new.collection?p.new:p.old;if(!r||!r.collection)return;
    if(p.eventType==="DELETE"){if(cache[r.collection])delete cache[r.collection][r.id]}else (cache[r.collection]=cache[r.collection]||{})[r.id]=p.new.data;
    listeners.forEach(l=>l());
  }).subscribe();
  return {
    refresh,
    doc:path=>{const [c,id]=path.split("/");return {
      set:async d=>{const {error}=await sb.from("kv").upsert({collection:c,id,data:d});if(error)throw sbErr(error);(cache[c]=cache[c]||{})[id]=d;listeners.forEach(l=>l())},
      delete:async()=>{const {error}=await sb.from("kv").delete().match({collection:c,id});if(error)throw sbErr(error);if(cache[c])delete cache[c][id];listeners.forEach(l=>l())},
      onSnapshot:cb=>sub(()=>cb(snapDoc(path)))}},
    collection:c=>({onSnapshot:cb=>sub(()=>cb(snapCol(c)))})
  };
}

  db.doc("program/team").onSnapshot(s=>{const d=s.exists&&s.data();state.team={role:(d&&d.role)||{},qual:(d&&d.qual)||{}};softRender()},err);
  db.collection("photo").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.fid&&x.img)m[x.fid]=x.img});state.photos=m;softRender()},err);
  db.collection("courses").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.code)m[x.code]=x});state.courseOv=m;rebuild();buildExpected();softRender()},err);
  await db.refresh();
  const isFac=state.faculty.some(f=>(f.email||"").toLowerCase()===email);
  if(!state.isAdmin&&!isFac)state.msg="ท่านเปิดดูได้อย่างเดียว ถ้าเป็นผู้สอน ให้กรรมการหลักสูตรเพิ่มอีเมลของท่านในรายชื่ออาจารย์";
  render();
  const bar=document.createElement("div");bar.className="row small muted userbar";bar.style.cssText="margin-left:auto;gap:8px;flex:none";
  bar.innerHTML=`<span>${esc(email)} · ${state.isAdmin?"กรรมการหลักสูตร":isFac?"ผู้สอน":"ผู้เยี่ยมชม"}</span><button class="sm" id="logout">ออกจากระบบ</button>`;
  document.querySelector("header.top").appendChild(bar);
  document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")location.reload()});
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
