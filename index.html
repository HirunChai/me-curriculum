const REG_TXT={"tf2565":"ประกาศคณะกรรมการมาตรฐานการอุดมศึกษา\nเรื่อง หลักเกณฑ์และวิธีการเทียบโอนหน่วยกิตและผลการศึกษาในระดับอุดมศึกษาพ.ศ. ๒๕๖๕อาศัยอำนาจตามความในข้อ 14 และข้อ 21 แห่งกฎกระทรวงมาตรฐานหลักสูตรการศึกษา\nระดับอุดมศึกษา พ.ศ. 2565 ประกอบกับมติคณะกรรมการมาตรฐานการอุดมศึกษา ในคราวประชุมครั้งที่ 8/2565 เมื่อวันที่ 10 สิงหาคม พ.ศ. 2565 จึงออกประกาศไว้ ดังต่อไปนี้\nข้อ 1 ประกาศนี้เรียกว่า “ประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่องหลักเกณฑ์และวิธีการเทียบโอนหน่วยกิตและผลการศึกษาในระดับอุดมศึกษา พ.ศ. 2565”\nข้อ 2 ประกาศนี้ให้ใช้บังคับตั้งแต่วันที่ 27 กันยายน พ.ศ. 2565 เป็นต้นไป\nข้อ 3 ในประกาศนี้\n“การศึกษาในระบบ” หมายถึง การศึกษาที่กำหนดจุดมุ่งหมาย วิธีการศึกษา หลักสูตรระยะเวลาของการศึกษา การวัดและประเมินผล ซึ่งเป็นเงื่อนไขของการสำเร็จการศึกษาที่แน่นอน\n“การศึกษานอกระบบ” หมายถึง การศึกษาที่มีความยืดหยุ่นในการกำหนดจุดมุ่งหมายรูปแบบ วิธีการจัดการศึกษา ระยะเวลาของการศึกษา การวัดและประเมินผล ซึ่งเป็นเงื่อนไขสำคัญของการสำเร็จการศึกษา โดยเนื้อหาและหลักสูตรจะต้องมีความเหมาะสมสอดคล้องกับสภาพปัญหาและความต้องการของบุคคลแต่ละกลุ่ม\n“การศึกษาตามอัธยาศัย” หมายถึง การศึกษาที่ให้ผู้เรียนได้เรียนรู้ด้วยตนเองตามความสนใจศักยภาพ ความพร้อม และโอกาส โดยศึกษาจากบุคคล ประสบการณ์ สังคม สภาพแวดล้อม สื่อหรือแหล่งความรู้อื่น ๆ\n“ผลการเรียน” หมายถึง ความรู้ ทักษะ จริยธรรม และลักษณะบุคคลที่ได้จากการศึกษาในระบบซึ่งสามารถแสดงในรูปของคะแนนตัวอักษร หรือแต้มระดับคะแนนที่นำมาคิดคะแนนผลการเรียนหรือคำนวณแต้มระดับคะแนนเฉลี่ยสะสมได้\n“ผลลัพธ์การเรียนรู้” หมายถึง ผลที่เกิดขึ้นแก่ผู้เรียนผ่านกระบวนการเรียนรู้ที่ได้จากการศึกษาฝึกอบรม หรือประสบการณ์ที่เกิดขึ้นจากการฝึกปฏิบัติ หรือการเรียนรู้จริงในที่ทำงานระหว่างการศึกษา\n“ผู้เรียน” หมายถึง บุคคลที่เรียนรู้จากการศึกษาในระบบ การศึกษานอกระบบ หรือการศึกษาตามอัธยาศัย\n“คณะกรรมการ” หมายถึง คณะกรรมการมาตรฐานการอุดมศึกษา\nข้อ 4 สถาบันอุดมศึกษาพึงใช้ผลลัพธ์การเรียนรู้เป็นหลักสำคัญในการเทียบโอนโดยสถาบันอุดมศึกษาจัดทำรายละเอียดผลลัพธ์การเรียนรู้ที่พึงประสงค์ของรายวิชาที่เปิดสอนในสถาบันอุดมศึกษาไว้ล่วงหน้าก่อนที่จะมีผู้ยื่นคำขอเทียบโอนเพื่อเป็นเกณฑ์เทียบเคียงในการพิจารณาโดยผลลัพธ์การเรียนรู้ที่พึงประสงค์ต้องเทียบได้ตามมาตรฐานผลลัพธ์การเรียนรู้ของแต่ละระดับคุณวุฒิตามมาตรฐานคุณวุฒิระดับอุดมศึกษาซึ่งสามารถทดสอบและประเมินผลได้โดยวิธีการต่าง ๆ\nข้อ 5 การดำเนินงานเทียบโอนหน่วยกิตและผลการศึกษาในระดับอุดมศึกษามีวัตถุประสงค์ดังนี้\n(1) ส่งเสริมและสนับสนุนการเรียนรู้ตลอดชีวิตเพื่อให้ผู้เรียนทั้งการศึกษาในระบบการศึกษานอกระบบ และการศึกษาตามอัธยาศัย สามารถเทียบโอนหน่วยกิตและผลการศึกษาได้อย่างคล่องตัวและรักษาไว้ซึ่งมาตรฐานการศึกษาระดับอุดมศึกษา\n(2) ส่งเสริมให้สถาบันอุดมศึกษามีอิสระในการกำหนดหลักเกณฑ์ วิธีการและเงื่อนไขในการเทียบโอนหน่วยกิตและผลการศึกษา โดยต้องมีมาตรฐานไม่ต่ำกว่าหลักเกณฑ์ตามประกาศฉบับนี้\nข้อ 6 การเทียบโอนหน่วยกิตและผลการศึกษาในระดับอุดมศึกษา มีหลักการ ดังต่อไปนี้\n(1) การเทียบโอนหน่วยกิตและผลการศึกษาต้องสามารถเทียบโอนได้ทั้งจากการศึกษาในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัย\n(2) การเทียบโอนหน่วยกิตและผลการศึกษาต้องยึดหลักความเสมอภาคและธำรงไว้ซึ่งคุณภาพและมาตรฐานการศึกษา\n(3) สถาบันอุดมศึกษาต้องจัดให้มีหน่วยงานทำหน้าที่ให้คำแนะนำ ปรึกษาและดำเนินการให้มีการเทียบโอนหน่วยกิตและผลการศึกษาตามกระบวนการและหลักเกณฑ์ที่กำหนด\n(4) สถาบันอุดมศึกษาต้องกำหนดหลักเกณฑ์และวิธีการที่ใช้ในการทดสอบและประเมินผลเพื่อการเทียบโอนที่มีมาตรฐาน\nข้อ 7 สถาบันอุดมศึกษาต้องดำเนินการเทียบโอนหน่วยกิตและผลการศึกษาภายใต้หลักเกณฑ์ ดังต่อไปนี้\n7.1 หลักเกณฑ์การเทียบโอนจากการศึกษาในระบบ\nระดับอนุปริญญาและปริญญาตรี\n(1) เป็นรายวิชาหรือกลุ่มรายวิชาในหลักสูตรระดับอุดมศึกษาหรือเทียบเท่าที่คณะกรรมการหรือหน่วยงานของรัฐที่มีอำนาจตามกฎหมายรับรอง\n(2) รายวิชาหรือกลุ่มรายวิชาที่จะนำมาขอเทียบโอนต้องมีสาระสำคัญครอบคลุมรายวิชาหรือกลุ่มรายวิชาที่ขอเทียบโอน\n(3) ผลการเรียนในรายวิชาหรือกลุ่มรายวิชาที่จะนำมาขอเทียบโอน ต้องมี\nระดับคะแนนไม่ต่ำกว่า 2.00 จากระบบ 4.๐๐ หรือเทียบเท่า\n(4) รายวิชาหรือกลุ่มรายวิชาที่เทียบโอนจากต่างสถาบันอุดมศึกษาไม่สามารถนำมาคำนวณแต้มระดับคะแนนเฉลี่ยสะสมได้\nระดับบัณฑิตศึกษา\n(1) เป็นรายวิชาหรือกลุ่มรายวิชาในหลักสูตรระดับอุดมศึกษาหรือเทียบเท่าที่คณะกรรมการหรือหน่วยงานของรัฐที่มีอำนาจตามกฎหมายรับรอง\n(2) รายวิชาหรือกลุ่มรายวิชาที่จะนำมาขอเทียบโอนต้องมีสาระสำคัญครอบคลุมรายวิชาหรือกลุ่มรายวิชาที่ขอเทียบโอน\n(3) ผลการเรียนในรายวิชาหรือกลุ่มรายวิชาที่จะนำมาขอเทียบโอนต้องมีระดับคะแนนไม่ต่ำกว่า 3.00 จากระบบ 4.๐๐ หรือเทียบเท่า\n(4) การเทียบโอนในรายวิชาวิทยานิพนธ์ให้เป็นไปตามที่สถาบันอุดมศึกษากำหนดโดยความเห็นชอบของสภาสถาบันอุดมศึกษา\n(5) รายวิชาหรือกลุ่มรายวิชาที่เทียบโอนจากต่างสถาบันอุดมศึกษาไม่สามารถนำมาคำนวณแต้มระดับคะแนนเฉลี่ยสะสมได้\n7.2 หลักเกณฑ์การเทียบโอนจากการศึกษานอกระบบและการศึกษาตามอัธยาศัย\n(1) ผู้ขอเทียบโอนมีผลลัพธ์การเรียนรู้ที่สอดคล้องกับผลลัพธ์การเรียนรู้ที่พึงประสงค์ของรายวิชาหรือกลุ่มรายวิชาที่จะขอเทียบโอน\n(2) ผลลัพธ์การเรียนรู้ที่ขอเทียบโอนไม่จำกัดระยะเวลาที่ใช้ในการเรียนรู้และสั่งสมประสบการณ์ในผลลัพธ์การเรียนรู้เรื่องนั้น แต่ต้องทันต่อความก้าวหน้าทางวิชาการของสาขาที่จะขอเทียบโอน\n(3) ผลลัพธ์การเรียนรู้ที่เทียบโอนไม่สามารถมาคำนวณแต้มระดับคะแนนเฉลี่ยสะสมได้\nทั้งนี้ การเทียบโอนสำหรับการศึกษาในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัย ให้สามารถเทียบโอนได้โดยรวมแล้วไม่เกินสามในสี่ของจำนวนหน่วยกิตรวมของหลักสูตรที่รับโอนสำหรับระดับปริญญาตรี และไม่เกินกึ่งหนึ่งของจำนวนหน่วยกิตรวมของหลักสูตรที่รับโอนสำหรับระดับบัณฑิตศึกษา โดยให้คำนึงถึงการสร้างบัณฑิตที่พึงประสงค์และสอดคล้องกับความเชี่ยวชาญของสถาบัน กรณีการเทียบโอนจากการศึกษาในระบบของสถาบันเดียวกันสามารถเทียบโอนได้มากกว่าที่กำหนด\nการเทียบโอนจากการศึกษาในสถาบันหนึ่ง ไปยังอีกสถาบันหนึ่ง ไม่สามารถเทียบโอนต่อช่วงไปยังสถาบันอุดมศึกษาอื่นได้ และต้องระบุไว้ในใบแสดงผลการเรียน (Transcript) ว่าเป็นรายวิชาหรือกลุ่มรายวิชาที่มีการเทียบโอน\nข้อ 8 วิธีการเทียบโอนหน่วยกิตและผลการศึกษา\n(1) สถาบันอุดมศึกษากำหนดระบบและกลไกการเทียบโอน โดยได้รับความเห็นชอบจากสภาสถาบันอุดมศึกษา\n(2) ให้มีคณะกรรมการระดับสถาบันทำหน้าที่กำกับดูแลระบบและกลไกการเทียบโอนให้มีคุณภาพและมาตรฐาน และมีคณะกรรมการระดับคณะและระดับหลักสูตรทำหน้าที่ทดสอบและประเมินผลเพื่อการเทียบโอนโดยอาจารย์ผู้รับผิดชอบหลักสูตรและอาจารย์ผู้สอนมีส่วนร่วม\n(3) การกำหนดหลักเกณฑ์และวิธีการที่ใช้ในการทดสอบและประเมินผลเพื่อการเทียบโอน ต้องมีคุณภาพ ได้มาตรฐาน มีความโปร่งใส และเสมอภาค โดยมีการทบทวนและปรับปรุงหลักเกณฑ์และวิธีการที่ใช้ประเมินผลเพื่อการเทียบโอนให้สอดคล้องกับการเปลี่ยนแปลงทางวิชาการและสังคม ทั้งนี้ ต้องคำนึงถึงความต้องการจำเป็นของแต่ละบุคคล\n(4) การกำหนดหลักเกณฑ์และวิธีการที่ใช้ในการทดสอบและประเมินผลเพื่อการเทียบโอน ต้องพิจารณาองค์ประกอบขั้นต่ำตามแต่ละกรณี ดังนี้\n(4.1) กรณีเทียบโอนจากการศึกษาในระบบ ให้พิจารณาผลลัพธ์การเรียนรู้ที่พึงประสงค์ สาระสำคัญ จำนวนหน่วยกิตและชั่วโมงสอน และผลการวัดและประเมินผลของผู้เรียน\n(4.2) กรณีเทียบโอนจากการศึกษานอกระบบ ให้พิจารณาผลลัพธ์การเรียนรู้ที่พึงประสงค์ สาระสำคัญ จำนวนชั่วโมงสอน วิธีการวัดและประเมินผล รูปแบบและวิธีการจัดการศึกษา คุณสมบัติของผู้สอน ผลการวัดและประเมินผลของผู้เรียน เอกสารยืนยันการศึกษาจากหน่วยงานที่จัดการศึกษา และข้อมูลประวัติและผลงานของหน่วยงานที่จัดการศึกษา\n(4.3) กรณีเทียบโอนจากการศึกษาตามอัธยาศัย ให้พิจารณาผลลัพธ์การเรียนรู้จากบันทึกประสบการณ์ ข้อมูลของแหล่งที่ผู้เรียนได้รับประสบการณ์นั้น และการเทียบเคียงประสบการณ์กับผลลัพธ์การเรียนรู้ที่พึงประสงค์ของรายวิชาหรือกลุ่มรายวิชา\n(4.4) กรณีการเทียบโอนที่ไม่สามารถพิจารณาองค์ประกอบตามข้อ (4.1) - (4.3)สถาบันอุดมศึกษาสามารถดำเนินการทดสอบสมรรถนะได้\n(5) การบันทึกผลการศึกษาจากการเทียบโอนในรายวิชาหรือกลุ่มรายวิชาให้บันทึกตามวิธีการประเมิน เช่น หน่วยกิตที่ได้รับการยกเว้นการเรียนที่เคยศึกษามาแล้วจากสถาบันอุดมศึกษาหน่วยกิตที่ได้จากการทดสอบ หน่วยกิตที่ได้จากการเสนอแฟ้มสะสมงาน หน่วยกิตที่ได้จากการทดสอบมาตรฐาน หน่วยกิตที่ได้จากการประเมินหรืออบรมที่จัดโดยหน่วยงานต่าง ๆ เป็นต้น\n(6) ให้สถาบันอุดมศึกษาเผยแพร่หลักเกณฑ์และวิธีการเทียบโอนหน่วยกิตและผลการศึกษาต่อสาธารณะ\nข้อ 9 ในกรณีที่ไม่สามารถปฏิบัติตามแนวทางดังกล่าวได้ หรือมีความจำเป็นต้องปฏิบัตินอกเหนือจากที่กำหนดไว้ในประกาศนี้ ให้อยู่ในดุลยพินิจของคณะกรรมการ และให้ถือคำวินิจฉัยของคณะกรรมการนั้นเป็นที่สุด\nประกาศ ณ วันที่ 8 กันยายน พ.ศ. ๒๕๖5\nศาสตราจารย์เกียรติคุณกิตติชัย วัฒนานิกร\nประธานกรรมการมาตรฐานการอุดมศึกษา","dd2565":"ประกาศคณะกรรมการมาตรฐานการอุดมศึกษา\nเรื่อง มาตรฐานหลักสูตรควบระดับปริญญาตรีสองปริญญา\nหรือหลักสูตรควบระดับปริญญาโทสองปริญญา ในสาขาวิชาที่ต่างกัน พ.ศ. 2565อาศัยอำนาจตามความในข้อ 10 แห่งกฎกระทรวงมาตรฐานหลักสูตรการศึกษาระดับอุดมศึกษาพ.ศ. ๒๕๖๕ ประกอบกับมติคณะกรรมการมาตรฐานการอุดมศึกษา ในคราวประชุมครั้งที่ 8/2565(นัดพิเศษ) เมื่อวันที่ 24 สิงหาคม พ.ศ. 2565 จึงออกประกาศไว้ ดังต่อไปนี้\nข้อ 1 ประกาศนี้เรียกว่า “ประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่อง มาตรฐานหลักสูตรควบระดับปริญญาตรีสองปริญญา หรือหลักสูตรควบระดับปริญญาโทสองปริญญา ในสาขาวิชาที่ต่างกัน พ.ศ. 2565”\nข้อ 2 ประกาศนี้ให้ใช้บังคับตั้งแต่วันที่ 27 กันยายน พ.ศ. 2565 เป็นต้นไป\nข้อ 3 ในประกาศนี้\n“คณะกรรมการ” หมายถึง คณะกรรมการมาตรฐานการอุดมศึกษา\n“สถาบันอุดมศึกษา” หมายถึง สถาบันที่จัดการอุดมศึกษาระดับปริญญาและระดับต่ำกว่าปริญญาทั้งที่เป็นของรัฐและของเอกชน\n“หลักสูตรควบระดับปริญญาตรีสองปริญญา” หมายถึง หลักสูตรระดับปริญญาตรีสองหลักสูตรในสาขาวิชาที่ต่างกันภายในสถาบันอุดมศึกษาเดียวกัน ที่ให้ผู้เรียนศึกษาพร้อมกัน โดยผู้สำเร็จการศึกษาจะได้รับปริญญาจากทั้งสองหลักสูตร\n“หลักสูตรควบระดับปริญญาโทสองปริญญา” หมายถึง หลักสูตรระดับปริญญาโทสองหลักสูตรในสาขาวิชาที่ต่างกันภายในสถาบันอุดมศึกษาเดียวกัน ที่ให้ผู้เรียนศึกษาพร้อมกัน โดยผู้สำเร็จการศึกษาจะได้รับปริญญาจากทั้งสองหลักสูตร\nข้อ 4 การจัดการศึกษาหลักสูตรควบระดับปริญญาตรีสองปริญญา หรือควบระดับปริญญาโทสองปริญญา ให้เป็นไปตามกฎกระทรวงมาตรฐานหลักสูตรการศึกษาระดับอุดมศึกษา พ.ศ. 2565และต้องมีผลลัพธ์การเรียนรู้เป็นไปตามมาตรฐานคุณวุฒิของทั้งสองปริญญานั้น ตามกฎกระทรวงมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 และหลักเกณฑ์หรือแนวทางอื่นตามที่คณะกรรมการกำหนด\nข้อ 5 สถาบันอุดมศึกษาที่จะจัดการศึกษาหลักสูตรควบระดับปริญญา ต้องมีความพร้อมสำหรับการจัดการศึกษาหลักสูตรควบระดับ ทั้งนี้ ให้เป็นไปตามกฎกระทรวงมาตรฐานการจัดการศึกษาระดับอุดมศึกษา พ.ศ. 2565\nข้อ 6 สถาบันอุดมศึกษาต้องจัดทำประกาศกำหนดหลักสูตรที่จะนำมาจัดการศึกษาควบระดับปริญญา หลักเกณฑ์การรับนักศึกษา คุณสมบัติของผู้เข้าศึกษา วิธีการศึกษา การวัดผลการศึกษาและเกณฑ์การสำเร็จของนักศึกษาในหลักสูตรควบระดับปริญญาให้ชัดเจน\nข้อ 7 หลักสูตรที่จะนำมาจัดการศึกษาแบบควบระดับปริญญาตรีสองปริญญา ต้องเป็นหลักสูตรที่สถาบันอุดมศึกษาเปิดสอนแยกเป็นสองหลักสูตร และสถาบันอุดมศึกษาต้องกำหนดวิชาที่สามารถเรียนร่วมกันได้และวิชาเฉพาะที่ต้องการให้ศึกษาในทั้งสองหลักสูตรให้ครบถ้วนและชัดเจนตามโครงสร้างหลักสูตร ทั้งจำนวนวิชา จำนวนหน่วยกิต และบรรลุผลลัพธ์การเรียนรู้เป็นไปตามมาตรฐานคุณวุฒิระดับปริญญาตรีของทั้งสองหลักสูตร โดยต้องมีระยะเวลาการเรียนรู้ของผู้เรียนคิดเป็นจำนวนหน่วยกิตรวมไม่น้อยกว่า 150 หน่วยกิต ตามระบบทวิภาค\nข้อ 8 หลักสูตรที่จะนำมาจัดการศึกษาแบบควบระดับปริญญาโทสองปริญญา ต้องเป็นหลักสูตรที่สถาบันอุดมศึกษาเปิดสอนแยกเป็นสองหลักสูตร และสถาบันอุดมศึกษาต้องกำหนดวิชาเฉพาะและวิชาแกนที่จะใช้ร่วมกันระหว่างสองหลักสูตรให้ครบถ้วนและชัดเจนตามโครงสร้างหลักสูตรทั้งจำนวนวิชาจำนวนหน่วยกิต และบรรลุผลลัพธ์การเรียนรู้เป็นไปตามมาตรฐานคุณวุฒิระดับปริญญาโทของทั้งสองหลักสูตร โดยต้องมีระยะเวลาการเรียนรู้ของผู้เรียนคิดเป็นจำนวนหน่วยกิตรวมไม่น้อยกว่า48 หน่วยกิต ตามระบบทวิภาค\nข้อ 9 จำนวน คุณวุฒิ และคุณสมบัติของอาจารย์ผู้รับผิดชอบหลักสูตร และอาจารย์ประจำหลักสูตร ให้เป็นไปตามประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่อง เกณฑ์มาตรฐานหลักสูตรระดับปริญญาตรี พ.ศ. 2565 และหรือประกาศคณะกรรมการมาตรฐานการอุดมศึกษาเรื่อง เกณฑ์มาตรฐานหลักสูตรระดับบัณฑิตศึกษา พ.ศ. 2565\nข้อ 10 ในกรณีที่ผู้ศึกษาลงทะเบียนเรียนในแผนการศึกษาแบบควบระดับปริญญาโทสองปริญญาทั้งสองหลักสูตร สถาบันอุดมศึกษาต้องกำหนดให้ชัดเจนว่า วิทยานิพนธ์หรือการค้นคว้าอิสระจะเป็นฉบับเดียวกันหรือสองฉบับ หากกำหนดให้วิทยานิพนธ์หรือการค้นคว้าอิสระเป็นฉบับเดียวกันวิทยานิพนธ์หรือการค้นคว้าอิสระนั้นต้องครอบคลุมหรือบูรณาการเนื้อหาวิชาทั้งสองหลักสูตร และจะต้องมีอาจารย์ที่ปรึกษาวิทยานิพนธ์หลักจากทั้งสองหลักสูตร\nข้อ 11 ในกรณีที่ไม่สามารถปฏิบัติตามแนวทางดังกล่าวได้ หรือมีความจำเป็นต้องปฏิบัตินอกเหนือจากที่กำหนดไว้ในประกาศนี้ ให้อยู่ในดุลยพินิจของคณะกรรมการ และให้ถือคำวินิจฉัยของคณะกรรมการนั้นเป็นที่สุด\nประกาศ ณ วันที่ 22 กันยายน พ.ศ. ๒๕๖5\nศาสตราจารย์เกียรติคุณกิตติชัย วัฒนานิกร\nประธานกรรมการมาตรฐานการอุดมศึกษา","bach2550": "ข้อบังคับมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพว่าด้วยการศึกษาระดับปริญญาตรีพ.ศ. ๒๕๕๐\n-------------------------------------\nตามที่ได้มีพระราชบัญญัติจัดตั้งมหาวิทยาลัยเทคโนโลยีราชมงคล เพื่อให้การดำเนินการจัดการศึกษาเป็นไปด้วยความเรียบร้อย สอดคล้องกับสภาพสังคมที่เปลี่ยนแปลงไปมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ จึงเห็นควรจัดทำข้อบังคับว่าด้วยการศึกษาระดับปริญญาตรีขึ้นอาศัยอำนาจตามความในมาตรา ๑๗ (๒) แห่งพระราชบัญญัติมหาวิทยาลัยเทคโนโลยีราชมงคล พ.ศ. ๒๕๔๘ และมติสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ในการประชุมครั้งที่ ๔/๒๕๕๐ เมื่อวันที่ ๒๖ เดือน กุมภาพันธ์ พ.ศ. ๒๕๕๐ จึงออกข้อบังคับไว้ดังต่อไปนี้\nข้อ ๑ข้อบังคับนี้เรียกว่า “ข้อบังคับมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพว่าด้วยการศึกษาระดับปริญญาตรี พ.ศ. ๒๕๕๐”\nข้อ ๒ข้อบังคับนี้ให้มีผลใช้บังคับนับแต่วันถัดจากวันประกาศเป็นต้นไป\nข้อ ๓บรรดาความในข้อบังคับ ระเบียบ คำสั่ง หรือประกาศอื่นใดในส่วนที่กำหนดไว้แล้วในข้อบังคับนี้ หรือซึ่งขัดแย้งกับความในข้อบังคับนี้ให้ใช้ความในข้อบังคับนี้แทน\nข้อ ๔ในข้อบังคับนี้\n“มหาวิทยาลัย” หมายความว่า มหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“สภามหาวิทยาลัย” หมายความว่า สภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“อธิการบดี” หมายความว่า อธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“คณะ” หมายความว่า ส่วนราชการระดับคณะหรือส่วนราชการที่เรียกชื่อเป็นอย่างอื่นแต่มีฐานะเทียบเท่าคณะที่มีการจัดการเรียนการสอน\n“คณบดี” หมายความว่า หัวหน้าส่วนราชการระดับคณะ หรือหัวหน้าส่วนราชการที่เรียกชื่อเป็นอย่างอื่นแต่มีฐานะเทียบเท่าคณะ ที่มีการจัดการเรียนการสอน\n“นักศึกษา” หมายความว่า ผู้ที่เข้ารับการศึกษาระดับปริญญาตรีในมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“คณะกรรมการประจำคณะ” หมายความว่า คณะกรรมการประจำคณะของแต่ละคณะในสังกัดมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“ภาควิชา” หมายความว่า ภาควิชาที่มีการจัดการเรียนการสอนใน แต่ละคณะและให้หมายรวมถึงหน่วยงานที่เรียกชื่อเป็นอย่างอื่นที่มีฐานะเทียบเท่าภาควิชา\n“หัวหน้าภาควิชา” หมายความว่า หัวหน้าภาควิชาที่มีการจัดการเรียนการสอนในแต่ละคณะ และให้หมายความรวมถึงหัวหน้าหน่วยงานที่เรียกชื่อเป็นอย่างอื่น ที่มีฐานะเทียบเท่าภาควิชา\n“แผนการเรียน” หมายความว่า แผนการจัดการเรียนการสอนในแต่ละภาคการศึกษาของแต่ละหลักสูตรที่ได้รับความเห็นชอบจากสภามหาวิทยาลัย\n“อาจารย์ที่ปรึกษา” หมายความว่า อาจารย์ประจำในคณะ ซึ่งคณบดีมอบหมายให้ทำหน้าที่ให้คำแนะนำปรึกษา ติดตามผลเกี่ยวกับการศึกษา ตักเตือนและดูแลความประพฤติตลอดจนรับผิดชอบดูแลแผนการเรียนของนักศึกษา\n“อาจารย์ผู้สอน” หมายความว่า ผู้ที่มีหน้าที่รับผิดชอบสอนรายวิชาในระดับปริญญา\nข้อ ๕ ให้อธิการบดีรักษาการตามข้อบังคับนี้ และมีอำนาจวินิจฉัยตีความตลอดจนออกประกาศเพื่อให้การปฏิบัติตามข้อบังคับนี้เป็นไปด้วยความเรียบร้อย ทั้งนี้ คำวินิจฉัยให้ถือเป็นที่สุด\nหมวดที่ ๑\nการรับเข้าศึกษา\nข้อ ๖ ผู้ที่จะสมัครเข้าเป็นนักศึกษาต้องมีคุณสมบัติและลักษณะดังนี้\n(๑) เป็นผู้มีคุณวุฒิการศึกษาตามที่กำหนดไว้ในหลักสูตร\n(๒) ไม่เป็นคนวิกลจริตหรือโรคติดต่อร้ายแรง โรคที่สังคมรังเกียจ หรือโรคที่จะเป็นอุปสรรคต่อการศึกษา\n(๓) ไม่เป็นผู้มีความประพฤติเสื่อมเสียอย่างร้ายแรง\nข้อ ๗ การคัดเลือกผู้สมัครเข้าเป็นนักศึกษาให้เป็นไปตามระเบียบการสอบคัดเลือกเข้าศึกษาต่อระดับปริญญาของมหาวิทยาลัย หรือการคัดเลือกตามวิธีการที่มหาวิทยาลัยกำหนด\nข้อ ๘ ผู้ที่ผ่านการคัดเลือกเข้าศึกษา จะมีสถานภาพเป็นนักศึกษาเมื่อได้ขึ้นทะเบียน และชำระเงินค่าลงทะเบียนเรียน และค่าธรรมเนียมตามประกาศของมหาวิทยาลัยพร้อมนำส่งหลักฐานเกี่ยวกับการขอขึ้นทะเบียนเป็นนักศึกษาด้วยตนเองตามวัน เวลา และสถานที่ที่มหาวิทยาลัยกำหนดหากผู้ผ่านการคัดเลือกเข้าศึกษาไม่มาขึ้นทะเบียนเป็นนักศึกษาเป็นอันหมดสิทธิ์ที่จะเข้าเป็นนักศึกษา เว้นแต่จะมีเหตุจำเป็นและได้รับอนุมัติจากอธิการบดีหรือผู้ได้รับมอบหมายนักศึกษาที่ขึ้นทะเบียนแล้วต้องทำบัตรประจำตัวนักศึกษาของมหาวิทยาลัยทุกคน\nหมวดที่ ๒\nระบบการศึกษา\nข้อ ๙ มหาวิทยาลัยจัดระบบการศึกษาตามเกณฑ์ ดังนี้\n(๑) มหาวิทยาลัยจัดการศึกษาโดยการประสานงานด้านวิชาการระหว่างคณะหรือภาควิชาคณะใดหรือภาควิชาใด ที่มีหน้าที่เกี่ยวกับวิชาการด้านใด ให้จัดการศึกษาในวิชาการด้านนั้นแก่นักศึกษาทุกคนทั้งมหาวิทยาลัย\n(๒) มหาวิทยาลัยจัดการศึกษาภาคการศึกษาปกติโดยใช้ระบบทวิภาคเป็นหลัก ในปีการศึกษาหนึ่งจะแบ่งออกเป็น ๒ ภาคการศึกษาซึ่งเป็นภาคการศึกษาบังคับแบ่งออกเป็นภาคการศึกษาที่หนึ่ง และภาคการศึกษาที่สอง มีระยะเวลาศึกษาไม่น้อยกว่าสิบห้าสัปดาห์ต่อหนึ่งภาคการศึกษา ทั้งนี้ไม่รวมเวลาสำหรับการสอบด้วย สำหรับวันเปิดภาคการศึกษาให้เป็นไปตามประกาศของมหาวิทยาลัย\n(๓) มหาวิทยาลัยอาจเปิดภาคการศึกษาฤดูร้อนเพิ่มเป็นภาคการศึกษาที่ไม่บังคับ มีระยะเวลาศึกษาไม่น้อยกว่าเจ็ดสัปดาห์ ทั้งนี้ไม่รวมเวลาสำหรับการสอบด้วย แต่ให้มีจำนวนชั่วโมงเรียนของแต่ละรายวิชาเท่ากับหนึ่งภาคการศึกษาปกติ\n(๔) การกำหนดปริมาณการศึกษาของแต่ละรายวิชาให้กำหนดเป็นหน่วยกิตตามลักษณะการจัดการเรียนการสอน ดังนี้\n(ก)รายวิชาภาคทฤษฎี ใช้เวลาบรรยายหรืออภิปรายปัญหา ๑ ชั่วโมงต่อสัปดาห์ ตลอดหนึ่งภาคการศึกษาปกติ หรือจำนวนชั่วโมงรวมไม่น้อยกว่า ๑๕ ชั่วโมง ให้นับเป็นหนึ่งหน่วยกิต\n(ข)รายวิชาภาคปฏิบัติ ใช้เวลาฝึกหรือทดลอง ๒ – ๓ ชั่วโมงต่อสัปดาห์ตลอดหนึ่งภาคการศึกษาปกติ หรือจำนวนชั่วโมงรวม ระหว่าง ๓๐ – ๔๕ ชั่วโมง ให้นับเป็นหนึ่งหน่วยกิต\n(ค)การฝึกงาน หรือการฝึกภาคสนามที่ใช้เวลาฝึกไม่น้อยกว่า ๔๕ ชั่วโมงต่อภาคการศึกษาปกติ ให้นับเป็นหนึ่งหน่วยกิต\n(ง) การทำโครงงานหรือกิจกรรมการเรียนอื่นใดตามที่ได้รับมอบหมายที่ใช้เวลาทำโครงงานหรือกิจกรรมนั้น ๆ ไม่น้อยกว่า ๔๕ ชั่วโมงต่อ ภาคการศึกษาปกติ ให้นับเป็นหนึ่งหน่วยกิต\n(จ) การศึกษาบางรายวิชาที่มีลักษณะเฉพาะ มหาวิทยาลัยอาจกำหนดหน่วยกิต โดยใช้หลักเกณฑ์อื่นได้ความเหมาะสม\n(๕) นักศึกษาต้องมีเวลาศึกษาในแต่ละรายวิชา ไม่น้อยกว่าร้อยละแปดสิบของเวลาศึกษาตลอดภาคการศึกษา จึงจะมีสิทธิ์สอบในรายวิชานั้น กรณีที่เวลาศึกษาไม่ถึงร้อยละแปดสิบอันเนื่องมาจากเหตุสุดวิสัยจะต้องได้รับอนุญาตจากอาจารย์ผู้สอนประจำรายวิชานั้นและรายงานให้คณบดีทราบ\nหมวดที่ ๓\nการลงทะเบียนเรียน\nข้อ ๑๐ นักศึกษาต้องลงทะเบียนเรียนโดยปฏิบัติตามหลักเกณฑ์ที่มหาวิทยาลัยกำหนด ดังนี้\n(๑) นักศึกษาต้องลงทะเบียนเรียนในรายวิชาที่กำหนด ในแต่ละภาคการศึกษาให้เสร็จก่อนวันเปิดภาคการศึกษานั้น หรือตามระยะเวลาที่มหาวิทยาลัยกำหนด\n(๒) การลงทะเบียนเรียนรายวิชาใดต้องได้รับความเห็นชอบจากอาจารย์ที่ปรึกษา และเป็นไปตามข้อกำหนดของหลักสูตรและข้อกำหนดของคณะที่นักศึกษาสังกัด หากฝ่าฝืนจะถือว่าการลงทะเบียนเรียนดังกล่าวเป็นโมฆะ\n(๓) การลงทะเบียนเรียนในแต่ละภาคการศึกษาปกติ นักศึกษาจะต้องลงทะเบียนเรียนไม่ต่ำกว่า ๙ หน่วยกิต แต่ไม่เกิน ๒๒ หน่วยกิต สำหรับภาคการศึกษาฤดูร้อนลงทะเบียนได้ไม่เกิน ๙ หน่วยกิต ยกเว้นในกรณีที่แผนการเรียนของหลักสูตรได้กำหนดไว้เป็นอย่างอื่น ให้ปฏิบัติตามแผนการเรียนที่กำหนดไว้ในหลักสูตรนั้น\n(๔) การลงทะเบียนเรียนในภาคการศึกษาปกติที่มีจำนวน หน่วยกิตมากกว่า ๒๒หน่วยกิต แต่ไม่เกิน ๒๕ หน่วยกิตหรือน้อยกว่า ๙ หน่วยกิต ต้องขออนุมัติคณบดีและได้เพียงหนึ่งภาคการศึกษา ยกเว้นภาคการศึกษาสุดท้ายที่นักศึกษาจะสำเร็จการศึกษาตามหลักสูตร และมีหน่วยกิตเหลืออยู่ไม่เกิน ๒๕ หน่วยกิต หรือน้อยกว่า ๙ หน่วยกิต อาจขออนุมัติคณบดีเป็นการเฉพาะราย ได้อีกหนึ่งภาคการศึกษาปกติ\n(๕) นักศึกษาในรายกรณีเป็นสหกิจศึกษา นักศึกษาฝึกงานในสถานประกอบการและนักศึกษาฝึกประสบการณ์การสอนในสถานศึกษา อนุญาตให้ลงทะเบียนเรียน ๖ หน่วยกิตในภาคการศึกษานั้นได้\n(๖) นักศึกษาที่ได้ลงทะเบียนเรียนก่อนวันเปิดภาคการศึกษาแล้ว แต่มีประกาศภายหลังว่าพ้นสภาพเนื่องจากผลการเรียนในภาคการศึกษาก่อน ให้ถือว่าผลการลงทะเบียนเรียนในภาคการศึกษาถัดมาเป็นโมฆะ ไม่มีผลผูกพันมหาวิทยาลัย และนักศึกษามีสิทธิ์ขอคืนเงินค่าบำรุงการศึกษา ค่าลงทะเบียน ค่าธรรมเนียมการศึกษาซึ่งได้ชำระในภาคการศึกษาที่เป็นโมฆะ\n(๗) สำหรับภาคการศึกษาปกติ หรือภาคการศึกษาฤดูร้อน นักศึกษาต้องลงทะเบียนเรียนและชำระเงินตามระยะเวลาที่มหาวิทยาลัยกำหนด นักศึกษาที่ลงทะเบียนเรียนและชำระเงินหลังวันที่มหาวิทยาลัยกำหนดไว้ จะต้องชำระเงินค่าธรรมเนียมเพิ่มเติมเป็นค่าปรับตามประกาศมหาวิทยาลัยในภาคการศึกษาปกติหากนักศึกษาไม่ลงทะเบียนเรียนและไม่ชำระเงินมหาวิทยาลัยจะถอนชื่อนักศึกษาผู้นั้นออกจากทะเบียนนักศึกษา\n(๘) ในภาคการศึกษาปกติ หากนักศึกษาไม่ได้ลงทะเบียนเรียน และประสงค์จะขอรักษาสภาพการเป็นนักศึกษาเพื่อลาพักการศึกษา หรือการขอปรับค่าระดับ ม.ส. (I) คะแนนให้ยื่นคำร้องต่อคณบดี เมื่อได้รับอนุมัติแล้วให้นำคำร้องไปยื่นต่อสำนักส่งเสริมวิชาการและงานทะเบียน ภายในสามสิบวันนับจากวันเปิดภาคการศึกษานั้น และต้องชำระเงินค่าธรรมเนียมเพื่อรักษาสภาพเป็นนักศึกษาหรือค่าการปรับระดับคะแนน หากไม่ปฏิบัติดังกล่าวมหาวิทยาลัยจะถอนชื่อนักศึกษาผู้นั้นออกจากทะเบียนนักศึกษา\n(๙) สำหรับภาคการศึกษาฤดูร้อนนักศึกษาจะต้องลงทะเบียนและชำระเงินตามระยะเวลาที่มหาวิทยาลัยกำหนด หากไม่ปฏิบัติดังกล่าว นักศึกษาไม่มีสิทธิ์เข้าศึกษาและถือว่าการลงทะเบียนเรียนในภาคการศึกษาฤดูร้อนนั้นเป็นโมฆะ\n(๑๐) ให้อธิการบดีมีอำนาจอนุมัติให้นักศึกษาผู้ถูกถอนชื่อออกจากทะเบียนนักศึกษาตาม (๖) (๗) กลับเข้าเป็นนักศึกษาใหม่ได้เป็นกรณีพิเศษ เมื่อมีเหตุผลอันสมควรโดยให้ถือระยะเวลาที่ถูกถอนชื่อออกจากทะเบียนนักศึกษาเป็นระยะเวลาพักการศึกษา ทั้งนี้ต้องไม่พ้นกำหนดระยะเวลาหนึ่งปีนับจากวันที่นักศึกษาผู้นั้นถูกถอนชื่อจากทะเบียนนักศึกษา โดยนักศึกษาต้องชำระเงินค่าธรรมเนียมเสมือนเป็นผู้ลาพักการศึกษารวมทั้งค่าคืนสภาพเป็นนักศึกษา และค่าธรรมเนียมอื่นใดที่ค้างชำระตามประกาศมหาวิทยาลัย\nข้อ ๑๑ กรณีที่มหาวิทยาลัยมีเหตุอันควรอาจประกาศงดการสอนรายวิชาใดรายวิชาหนึ่งหรือจำกัดจำนวนนักศึกษาที่ลงทะเบียนเรียนในรายวิชาใดก็ได้การเปิดรายวิชาเพิ่มหรือปิดรายวิชาใดต้องกระทำภายในสองสัปดาห์แรกนับจากวันเปิดภาคการศึกษาปกติ หรือภายในสัปดาห์แรกนับจากวันเปิดภาคการศึกษาฤดูร้อน\nข้อ ๑๒ การลงทะเบียนเรียนในรายวิชาที่มีวิชาบังคับก่อนมีหลักเกณฑ์ ดังนี้\n(๑) การลงทะเบียนเรียนรายวิชาหนึ่งวิชาใดที่มีวิชาบังคับก่อน นักศึกษาจะต้องสอบผ่านวิชาบังคับก่อนหากฝ่าฝืนจะถือว่าการลงทะเบียนเรียนรายวิชานั้นเป็นโมฆะ เว้นแต่จะได้รับอนุมัติจากคณบดีก่อนการลงทะเบียนเรียน และจะต้องเป็นนักศึกษาปีสุดท้ายของหลักสูตรที่จะสำเร็จการศึกษาในปีการศึกษานั้น\n(๒) นักศึกษาที่ลงทะเบียนเรียนรายวิชาต่อเนื่องควบคู่กับรายวิชาบังคับก่อนหากงดเรียนรายวิชาบังคับก่อน จะต้องงดเรียนรายวิชาต่อเนื่องคราวเดียวกันด้วย หากไม่งดเรียนรายวิชาต่อเนื่องจะถือว่าการลงทะเบียนเรียนรายวิชาต่อเนื่องนั้นเป็นโมฆะ\nข้อ ๑๓ มหาวิทยาลัยกำหนดหลักเกณฑ์การลงทะเบียนเรียนข้ามสถานศึกษา ดังนี้\n(๑) นักศึกษาสามารถลงทะเบียนเรียนข้ามสถานศึกษาได้ในแต่ละภาคการศึกษา หากเป็นการลงทะเบียนเพื่อเพิ่มพูนความรู้ประเภทไม่นับหน่วยกิต\n(๒) นักศึกษาที่ประสงค์จะลงทะเบียนเรียนข้ามสถานศึกษาเพื่อนับหน่วยกิตในหลักสูตรจะต้องเป็นไปตามเงื่อนไข ดังนี้\n(ก) เป็นนักศึกษาภาคการศึกษาสุดท้ายที่จะสำเร็จการศึกษา และรายวิชาที่จะเรียนไม่เปิดสอนในภาคการศึกษานั้น\n(ข) รายวิชาที่จะลงทะเบียนเรียนในสถานศึกษาอื่น จะต้องเทียบได้กับรายวิชาตามหลักสูตรของมหาวิทยาลัย การเทียบให้อยู่ในดุลยพินิจของภาควิชาและคณะเจ้าของรายวิชาโดยถือเกณฑ์เนื้อหาและจำนวนหน่วยกิตเป็นหลัก ส่วนการอนุมัติให้ลงทะเบียนเรียนข้ามสถานศึกษาให้เป็นอำนาจของคณบดีที่นักศึกษาสังกัดอยู่\n(๓) การเรียนข้ามสถานศึกษา ให้นักศึกษายื่นคำร้องขอเรียนข้ามสถานศึกษาต่อคณบดีเพื่อพิจารณาและนักศึกษาชำระเงินตามประกาศที่มหาวิทยาลัยกำหนดไว้ให้เรียบร้อย หลังจากนั้นจึงไปดำเนินการ ณ สถานศึกษาที่นักศึกษาต้องการลงทะเบียนเรียนข้ามสถานศึกษา\n(๔) กรณีนักศึกษาจากสถาบันการศึกษาอื่นมีความประสงค์จะเรียนข้ามสถานศึกษาให้ปฏิบัติตามประกาศมหาวิทยาลัย\nข้อ ๑๔ นักศึกษาอาจขอเพิ่มหรือถอนรายวิชาได้โดยต้องดำเนินการ ดังนี้\n(๑) การขอเพิ่มรายวิชา ต้องกระทำภายในสัปดาห์ที่สองของภาคการศึกษาปกติ และภายในสัปดาห์แรกของภาคการศึกษาฤดูร้อน\n(๒) การถอนรายวิชาให้มีผล ดังนี้\n(ก) ถ้าถอนรายวิชาในสัปดาห์ที่สองของภาคการศึกษาปกติ และภายในสัปดาห์แรกของภาคการศึกษาฤดูร้อนรายวิชานั้นจะไม่ปรากฏในใบแสดงผลการศึกษา\n(ข) ถ้าถอนรายวิชาเมื่อพ้นกำหนดสัปดาห์ที่สอง แต่ยังอยู่ภายในสิบสองสัปดาห์ของภาคการศึกษาปกติ หรือเมื่อพ้นกำหนดสัปดาห์แรกของภาคการศึกษาฤดูร้อนแต่ยังอยู่ภายในห้าสัปดาห์แรกของภาคการศึกษาฤดูร้อนจะต้องได้รับความเห็นชอบจากอาจารย์ที่ปรึกษา โดยรายวิชานั้นจะปรากฏในใบแสดงผลการศึกษา ซึ่งจะได้รับคะแนนถอนรายวิชา หรือ ถ และเมื่อพ้นกำหนดการถอนรายวิชาแล้ว นักศึกษาจะถอนการลงทะเบียนเฉพาะรายวิชาไม่ได้\n(๓) การลงทะเบียนเรียนรายวิชาเพิ่มจนมีจำนวนหน่วยกิต สูงกว่า หรือการถอนรายวิชาจนเหลือจำนวนหน่วยกิตต่ำกว่าที่ระบุไว้ในข้อ ๑๐ (๔) จะทำมิได้หากฝ่าฝืนจะถือว่าการลงทะเบียนเรียนดังกล่าวเป็นโมฆะ เว้นแต่จะมีเหตุผลอันควรและได้รับอนุมัติจากคณบดี\nหมวดที่ ๔\nการลาของนักศึกษา\nข้อ ๑๕ นักศึกษามีสิทธิ์ลาพักการศึกษาในระหว่างการศึกษา ดังนี้\n(๑) การลาพักการศึกษาเป็นการลาพักทั้งภาคการศึกษา และถ้าได้ลงทะเบียนไปแล้วให้ยกเลิกการลงทะเบียนเรียน โดยรายวิชาที่ได้ลงทะเบียนเรียนทั้งหมดในภาคการศึกษานั้น จะไม่ปรากฏในใบแสดงผลการศึกษา แต่หากเป็นการลาพักการศึกษาหลังจากสัปดาห์ที่สิบสองในระหว่างภาคการศึกษาปกติหรือสัปดาห์ที่หกในระหว่างภาคการศึกษาฤดูร้อน ให้บันทึกระดับคะแนนถอนรายวิชา หรือ ถ\n(๒) การขอลาพักการศึกษา ให้แสดงเหตุผลความจำเป็นพร้อมกับมีหนังสือยื่นต่อคณบดี\n(๓) นักศึกษาอาจยื่นคำร้องต่อคณบดี เพื่อขออนุญาตลาพักการศึกษาได้ไม่เกินสองภาคการศึกษาปกติติดต่อกัน ในกรณีต่อไปนี้\n(ก) ถูกเกณฑ์หรือระดมเข้ารับราชการทหารกองประจำการ\n(ข) ได้รับทุนแลกเปลี่ยนนักศึกษาระหว่างประเทศหรือทุนอื่นใด ซึ่งมหาวิทยาลัยเห็นสมควรสนับสนุน\n(ค) ประสบอุบัติเหตุ ภยันตราย หรือเจ็บป่วย จนต้องพักรักษาตัวตามคำสั่งแพทย์เป็นเวลานานเกินกว่าร้อยละยี่สิบของเวลาศึกษาทั้งหมด โดยมีใบรับรองแพทย์\n(ง) มีความจำเป็นส่วนตัว โดยนักศึกษาผู้นั้นได้ศึกษาในมหาวิทยาลัยมาแล้วไม่น้อยกว่าหนึ่งภาคการศึกษา\n(๔) ในภาคการศึกษาแรกที่ขึ้นทะเบียนเป็นนักศึกษาของมหาวิทยาลัยนักศึกษาจะลาพักการศึกษาไม่ได้ เว้นแต่จะได้รับอนุมัติจากอธิการบดี เป็นกรณีพิเศษ\n(๕) ในการลาพักการศึกษา นักศึกษาจะลาพักการศึกษาเกินกว่าสองภาคการศึกษาปกติติดต่อกันไม่ได้ เว้นแต่จะได้รับอนุมัติจากอธิการบดี เป็นกรณีพิเศษ\n(๖) นักศึกษาจะต้องชำระค่ารักษาสภาพการเป็นนักศึกษาตามประกาศของมหาวิทยาลัยทุกภาคการศึกษาที่ได้รับอนุมัติให้ลาพักการศึกษา หากไม่ปฏิบัติจะถูกถอนชื่อออกจากทะเบียนนักศึกษา ยกเว้นภาคการศึกษาที่นักศึกษาได้ชำระเงินค่าบำรุงการศึกษาค่าลงทะเบียนเรียน ค่าธรรมเนียมการศึกษา และค่าอื่นใดตามประกาศของมหาวิทยาลัย โดยมหาวิทยาลัยจะไม่คืนเงินดังกล่าวให้ แต่นักศึกษาไม่ต้องชำระเงินค่ารักษาสภาพการเป็นนักศึกษา\n(๗) การลาพักการศึกษาไม่ว่าด้วยเหตุใดหรือการกลับเข้าศึกษาใหม่หรือการถูกให้พักการศึกษาแล้วแต่กรณี ไม่เป็นเหตุให้ขยายระยะเวลาการศึกษาเกินกว่าสองเท่าของแผนการเรียนตามหลักสูตร นับแต่วันขึ้นทะเบียนเป็นนักศึกษาของมหาวิทยาลัย ยกเว้นภาคการศึกษาฤดูร้อน\nข้อ ๑๖ นักศึกษาที่ป่วยหรือมีเหตุสุดวิสัย ทำให้ไม่สามารถเข้าสอบปลายภาคได้ นักศึกษาต้องขอผ่อนผันการสอบต่ออาจารย์ผู้สอนรายวิชานั้นภายในวันถัดไป หลังจากที่มีการสอบปลายภาครายวิชานั้น เว้นแต่จะมีเหตุอันสมควร คณะกรรมการประจำคณะเป็นผู้พิจารณาการขอผ่อนผันดังกล่าว โดยอาจอนุมัติให้ได้ระดับคะแนนไม่สมบูรณ์หรือ ม.ส. หรือให้ยกเลิกการลงทะเบียนเรียนรายวิชานั้นเป็นกรณีพิเศษ โดยให้ได้ระดับคะแนน ถอนรายวิชา หรือ ถ หรือไม่อนุมัติการขอผ่อนผัน โดยให้ถือว่าขาดสอบก็ได้\nข้อ ๑๗ นักศึกษาอาจลาออกจากการเป็นนักศึกษาได้โดยยื่นคำร้องขอลาออกต่อคณะที่นักศึกษาสังกัด และต้องไม่มีหนี้สิ้นกับมหาวิทยาลัย ทั้งนี้ต้องได้รับอนุมัติจากคณบดี\nหมวดที่ ๕\nการย้ายคณะและการเปลี่ยนสาขาวิชา\nข้อ ๑๘ นักศึกษาอาจย้ายคณะหรือเปลี่ยนสาขาวิชาได้ตามหลักเกณฑ์ที่มหาวิทยาลัยกำหนดดังนี้\n(๑) นักศึกษาที่ประสงค์จะย้ายคณะ ต้องได้รับอนุมัติจากคณบดีของคณะที่นักศึกษาสังกัด และคณบดีของคณะที่นักศึกษาประสงค์จะย้ายเข้าศึกษา\n(๒) นักศึกษาที่ประสงค์จะเปลี่ยนสาขาวิชาในคณะ จะกระทำได้ก็ต่อเมื่อได้รับความเห็นชอบจากคณบดีของคณะที่นักศึกษาสังกัด\nหมวดที่ ๖\nการวัดและประเมินผลการศึกษา\nข้อ ๑๙ มหาวิทยาลัยกำหนดหลักเกณฑ์การวัดและประเมินผลการศึกษา ให้คณะที่เปิดสอนในมหาวิทยาลัย จัดการวัดและประเมินผลการศึกษาสำหรับรายวิชาที่นักศึกษาลงทะเบียนเรียนไว้ในแต่ละภาคการศึกษาหนึ่ง โดยการประเมินผลการศึกษาในแต่ละรายวิชาให้กำหนดเป็นระดับคะแนน ค่าระดับคะแนนต่อหน่วยกิตและผลการศึกษาตามประกาศของมหาวิทยาลัย\nหมวดที่ ๗\nการพ้นสภาพการเป็นนักศึกษา\nข้อ ๒๐ นักศึกษาจะพ้นสภาพการเป็นนักศึกษาเมื่อ\n(๑) ตาย\n(๒) ลาออก\n(๓) ได้ศึกษาสำเร็จครบหลักสูตรตามที่มหาวิทยาลัยกำหนด และได้รับการอนุมัติปริญญา\n(๔) พ้นสภาพเนื่องจากถูกถอนชื่อการเป็นนักศึกษาตามข้อ ๑๐(๗)\n(๕) ไม่ผ่านเกณฑ์การวัดผลและประเมินผลตามประกาศของมหาวิทยาลัย\n(๖) ใช้ระยะเวลาการศึกษาเกินกว่าสองเท่าของแผนการเรียนตามหลักสูตร นับแต่วันขึ้นทะเบียนเป็นนักศึกษาของมหาวิทยาลัย ยกเว้นภาคการศึกษาฤดูร้อน ทั้งนี้สำหรับนักศึกษาที่เทียบโอนผลการเรียน ย้ายคณะหรือสาขาวิชา ให้นับเวลาที่เคยศึกษาอยู่ในสถานศึกษาเดิมรวมเข้าด้วยกัน\nหมวดที่ ๘\nการขอสำเร็จการศึกษา การขอขึ้นทะเบียนบัณฑิต\nข้อ ๒๑ นักศึกษาจะมีสิทธิขอสำเร็จการศึกษาต้องมีคุณสมบัติ ดังนี้\n(๑) ต้องศึกษารายวิชาให้ครบตามหลักสูตร และข้อกำหนดของสาขาวิชานั้น\n(๒) มีหน่วยกิตสะสมไม่ต่ำกว่าที่หลักสูตรกำหนดไว้ และได้ค่าระดับคะแนนเฉลี่ยสะสมไม่ต่ำกว่า ๒.๐๐\n(๓) เป็นผู้มีคุณสมบัติเหมาะสมกับการเป็นบัณฑิต และไม่มีหนี้สินผูกพันต่อมหาวิทยาลัย\n(๔) การยื่นคำร้องขอสำเร็จการศึกษา ต้องยื่นต่อสำนักส่งเสริมวิชาการและงานทะเบียน ทุกภาคการศึกษาที่นักศึกษาคาดว่าจะสำเร็จการศึกษาภายในสามสิบวัน นับแต่วันเปิดภาคการศึกษานั้น จนกว่านักศึกษาจะสำเร็จการศึกษาตามประกาศสภามหาวิทยาลัย\n(๕) นักศึกษาที่ไม่ดำเนินการตาม (๔) จะไม่ได้รับการพิจารณาเสนอชื่อเพื่อรับปริญญาในภาคการศึกษานั้น และจะต้องชำระค่ารักษาสภาพเป็นนักศึกษาทุกภาคการศึกษา จนถึงภาคการศึกษาที่นักศึกษายื่นคำร้องขอสำเร็จการศึกษา\nข้อ ๒๒ นักศึกษาที่สำเร็จการศึกษาต้องขอขึ้นทะเบียนบัณฑิต โดยยื่นคำร้องขึ้นทะเบียนบัณฑิตต่อสำนักส่งเสริมวิชาการและงานทะเบียน พร้อมชำระเงินค่าขึ้นทะเบียนบัณฑิต ทั้งนี้จะต้องดำเนินการตามขั้นตอนของมหาวิทยาลัย\nข้อ ๒๓ การเสนอชื่อเพื่อรับปริญญาให้เป็นไปตามประกาศของมหาวิทยาลัย\nหมวดที่ ๙\nปริญญาเกียรตินิยมและเหรียญเกียรตินิยม\nข้อ ๒๔ นักศึกษาที่จะได้รับการเสนอชื่อเพื่อรับปริญญาเกียรตินิยมต้องเป็นไปตามหลักเกณฑ์ ดังนี้\n(๑) ลงทะเบียนรายวิชาในมหาวิทยาลัยไม่ต่ำกว่า ๗๒ หน่วยกิต สำหรับหลักสูตร ๒ – ๓ ปีการศึกษา หรือไม่ต่ำกว่า ๑๒๐ หน่วยกิต สำหรับหลักสูตร ๔ ปีการศึกษาหรือไม่ต่ำกว่า ๑๕๐ หน่วยกิต สำหรับหลักสูตร ๕ ปีการศึกษา\n(๒) สำเร็จการศึกษาภายในระยะเวลาที่หลักสูตรกำหนด ทั้งนี้ไม่นับระยะเวลาที่นักศึกษาขอลาพักการศึกษาตามข้อบังคับนี้\n(๓) ต้องไม่มีผลการศึกษาที่อยู่ในเกณฑ์ขั้นไม่พอใจ หรือ ม.จ. (U) หรือต่ำกว่าระดับคะแนนขั้นพอใช้หรือ ค (C) ในรายวิชาใดวิชาหนึ่ง\n(๔) นักศึกษาผู้สำเร็จการศึกษาที่มีคุณสมบัติครบถ้วนตาม (๑) (๒) และ (๓) ที่มีค่าระดับคะแนนเฉลี่ยสะสมไม่ต่ำกว่า ๓.๗๕ จะได้รับการเสนอชื่อเพื่อรับปริญญาเกียรตินิยมอันดับ ๑\n(๕) นักศึกษาผู้สำเร็จการศึกษาที่มีคุณสมบัติครบถ้วนตาม (๑) (๒) และ (๓) ที่มีค่าระดับคะแนนเฉลี่ยไม่ต่ำกว่า ๓.๕๐ จะได้รับการเสนอชื่อเพื่อรับปริญญาเกียรตินิยมอันดับ ๒\n(๖) การเสนอชื่อเพื่อรับปริญญาเกียรตินิยม ให้มหาวิทยาลัยนำเสนอต่อสภามหาวิทยาลัยในคราวเดียวกันกับที่เสนอขออนุมัติปริญญาประจำภาคการศึกษานั้น\nข้อ ๒๕ การให้เกียรตินิยมเหรียญทองหรือเกียรตินิยมเหรียญเงิน\n(๑) ให้มหาวิทยาลัยจัดให้มีเหรียญเกียรตินิยมแก่ผู้สำเร็จการศึกษา ที่มีผลการศึกษาดีเด่นโดยแยกเป็นคณะ\n(๒) เกียรตินิยมเหรียญทองให้แก่ผู้สำเร็จการศึกษา ที่ได้ปริญญาเกียรตินิยมอันดับ ๑ ที่ได้ค่าระดับคะแนนเฉลี่ยสะสมสูงสุดในแต่ละคณะ\n(๓) เกียรตินิยมเหรียญเงินให้แก่ผู้สำเร็จการศึกษา ที่ได้ค่าระดับคะแนนเฉลี่ยสะสมเป็นที่สอง และจะต้องได้ปริญญาเกียรตินิยมอันดับ ๑ หรือ ๒ ในแต่ละคณะ กรณีผู้สำเร็จการศึกษาได้ค่าระดับคะแนนเฉลี่ยสะสมสูงสุด แต่ได้ปริญญาเกียรตินิยมอันดับ ๒ ในแต่ละคณะให้เกียรตินิยมเหรียญเงินการเสนอชื่อเพื่อรับเหรียญเกียรตินิยม ให้สำนักส่งเสริมวิชาการและงานทะเบียนดำเนินการ ปีการศึกษาละหนึ่งครั้ง และให้อธิการบดีนำเสนอต่อสภามหาวิทยาลัยเพื่อพิจารณาอนุมัติในคราวเดียวกันกับที่เสนอขออนุมัติปริญญาประจำภาคการศึกษาสุดท้ายของปีการศึกษา\nหมวดที่ ๑๐\nบทเฉพาะกาล\nข้อ ๒๖ ภายใต้บังคับข้อ ๖ – ๑๘ ให้มีผลใช้บังคับกับนักศึกษาที่ได้ลงทะเบียนเรียนก่อนข้อบังคับนี้มีผลใช้บังคับโดยอนุโลม\nข้อ ๒๗ ภายใต้บังคับข้อ ๑๙ ข้อ ๒๔ (๑) (๔) (๕) ไม่ให้มีผลใช้บังคับนักศึกษาที่เข้าเป็นนักศึกษาก่อนปีการศึกษา ๒๕๕๐ โดยให้นักศึกษาที่เข้าก่อนปีการศึกษา ๒๕๕๐ ใช้\nข้อบังคับสถาบันเทคโนโลยีราชมงคล ว่าด้วยการศึกษาระดับปริญญา พ.ศ. ๒๕๓๗ ซึ่งแก้ไขเพิ่มเติมข้อบังคับสถาบันเทคโนโลยีราชมงคล ว่าด้วยการศึกษาระดับปริญญา (ฉบับที่ ๒)พ.ศ. ๒๕๔๑ (ฉบับที่ ๓) พ.ศ. ๒๕๔๓ (ฉบับที่ ๖) พ.ศ. ๒๕๔๕ และ (ฉบับที่ ๗) พ.ศ. ๒๕๔๗จนกว่าจะสำเร็จการศึกษาโดยอนุโลม\nประกาศ ณ วันที่ ๒๗ เดือน กุมภาพันธ์ พ.ศ. ๒๕๕๐\n(ลงชื่อ) จรวยพร ธรณินทร์\n(นางจรวยพร ธรณินทร์)\nปลัดกระทรวงศึกษาธิการ\nนายกสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "add2537": "ระเบียบสถาบันเทคโนโลยีราชมงคล\nว่าด้วยการศึกษาลักษณะวิชาเพิ่มเติมสำหรับบัณฑิตพ.ศ. ๒๕๓๗\n------------------------------------------โดยที่เป็นการสมควรมีระเบียบว่าด้วยการศึกษาลักษณะวิชาเพิ่มเติมสำหรับบัณฑิตเพื่อให้ผู้สำเร็จการศึกษาระดับปริญญาตรีแล้วได้ศึกษาลักษณะวิชาเพิ่มเติม ในการนำความรู้ความสามารถไปประกอบอาชีพ หรือการขออนุญาตรับใบประกอบอาชีพตามที่กฎหมายกำหนดอาศัยอำนาจตามมาตรา ๑๕ (๑) และ (๙) แห่งพระราชบัญญัติสถาบันเทคโนโลยีราชมงคล พ.ศ.๒๕๑๘ และมติสภาสถาบันเทคโนโลยีราชมงคลในการประชุมครั้งที่ ๓/๒๕๓๗เมื่อวันที่ ๒๖ เมษายน ๒๕๓๗ จึงวางระเบียบไว้ ดังนี้\nข้อ ๑ ระเบียบนี้เรียกว่า “ระเบียบสถาบันเทคโนโลยีราชมงคล ว่าด้วยการศึกษาลักษณะวิชาเพิ่มเติมสำหรับบัณฑิต พ.ศ. ๒๕๓๗”\nข้อ ๒ ระเบียบนี้ให้ใช้บังคับตั้งแต่วันถัดจากวันประกาศเป็นต้นไป\nข้อ ๓ ให้ยกเลิกระเบียบสถาบันเทคโนโลยีราชมงคล ว่าด้วยการศึกษาลักษณะวิชาเพิ่มเติมสำหรับบัณฑิต พ.ศ. ๒๕๓๓บรรดาระเบียบ ข้อบังคับ คำสั่ง หรือประกาศอื่นใด ในส่วนที่กำหนดไว้แล้วในระเบียบนี้ หรือซึ่งขัดหรือแย้งกับระเบียบนี้ ให้ใช้ระเบียบนี้แทน\nข้อ ๔ ผู้เข้าศึกษาต้องเป็นผู้สำเร็จการศึกษาระดับปริญญาตรีหรือเทียบเท่า ซึ่งก.พ.รับรอง\nข้อ ๕ การรับสมัคร\n๕.๑ ผู้สมัครจะต้องยื่นคำร้องขอสมัครโดยตรงที่คณะนั้น ๆ ล่วงหน้าไม่น้อยกว่า ๖๐ วันก่อนวันเปิดภาคการศึกษาที่ประสงค์จะเข้าศึกษา\n๕.๒ หากเป็นนักศึกษาปัจจุบัน ให้สถาบันการศึกษาที่นักศึกษาผู้นั้น ศึกษาอยู่ รับรองสถานภาพการเป็นนักศึกษาภาคการศึกษาสุดท้าย ที่จะสำเร็จการศึกษาระดับปริญญาตรี\n๕.๓ ให้ผู้สมัครส่งเอกสารแสดงผลการศึกษาที่ผ่านมาทั้งหมดในการสมัคร\n๕.๔ ให้คณบดีคณะนั้น ๆ พิจารณาการรับเข้าศึกษาโกวิท วรพิพัฒน์\n(นายโกวิท วรพิพัฒน์)\nปลัดกระทรวงศึกษาธิการ\nข้อ ๖ การลงทะเบียนเรียน\n๖.๑ นักศึกษาตามระเบียบนี้มีสถานภาพการเป็นนักศึกษา ๑ ภาคการศึกษา\n๖.๒ การลงทะเบียนเรียนจะต้องไม่เกินภาคการศึกษาละ ๑๒ หน่วยกิต โดยดำเนินการเช่นเดียวกับนักศึกษาภาคปกติ\n๖.๓ ค่าลงทะเบียนลักษณะวิชา ให้เรียกเก็บหน่วยกิตละ ๓๐๐ บาท นอกจากนั้นให้ปฏิบัติตามระเบียบของสถาบันเทคโนโลยีราชมงคล เมื่อรับชำระแล้วจะไม่คืนให้ เว้นแต่จะได้รับอนุมัติจากอธิการบดีสถาบันเทคโนโลยีราชมงคล\nข้อ ๗ การขอเอกสารแสดงผลการศึกษา ให้ผู้เข้าศึกษายื่นคำร้องต่อสำนักบริการทางวิชาการและทดสอบ ซึ่งจะออกให้เป็นระดับคะแนน ก (A) ข (B) ค (C) ง (D) ต (F) และหน่วยกิตที่ได้ไม่นำมาคำนวณหาค่าระดับคะแนนเฉลี่ย\nข้อ ๘ ผลการศึกษาตามระเบียบนี้ จะนำไปใช้เพื่อการศึกษาต่อหรือขอรับหรือขอเทียบเท่าปริญญาตรี ในสาขาวิชาที่เปิดสอนในสถาบันเทคโนโลยีราชมงคลไม่ได้\nข้อ ๙ กรณีที่ระเบียบนี้มิได้กำหนดไว้ ให้เสนออธิการบดีสถาบันเทคโนโลยีราชมงคลพิจารณาอนุมัติ\nข้อ ๑๐ ให้อธิการบดีสถาบันเทคโนโลยีราชมงคลรักษาการตามระเบียบนี้\nประกาศ ณ วันที่ ๑๓ เดือน พฤษภาคม พ.ศ. ๒๕๓๗\n(ลงชื่อ)", "tf2564": "ระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพว่าด้วยการเทียบโอนผลการเรียนพ.ศ. ๒๕๖๔โดยที่เป็นการสมควรปรับปรุงระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพว่าด้วยการเทียบโอนผลการเรียน ให้สอดคล้องกับบริบทของมหาวิทยาลัยอาศัยอำนาจตามความในมาตรา ๑๗ (๒) แห่งพระราชบัญญัติมหาวิทยาลัยเทคโนโลยีราชมงคล พ.ศ. ๒๕๔๘ ประกอบกับมติสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพในการประชุม ครั้งที่ ๓/๒๕๖๔ เมื่อวันที่ ๑ มีนาคม ๒๕๖๔ จึงวางระเบียบไว้ ดังต่อไปนี้\nข้อ ๑ ระเบียบนี้เรียกว่า “ระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพว่าด้วยการเทียบโอนผลการเรียน พ.ศ. ๒๕๖๔”\nข้อ ๒ ระเบียบนี้ให้ใช้บังคับตั้งแต่ปีการศึกษา ๒๕๖๔ เป็นต้นไป\nข้อ ๓ ให้ยกเลิกระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ว่าด้วยการเทียบโอนผลการเรียน พ.ศ. ๒๕๕๐บรรดาระเบียบ ข้อบังคับ หรือคำสั่งอื่นใด ในส่วนที่กำหนดไว้แล้วในระเบียบนี้ หรือซึ่งขัดแย้งกับระเบียบนี้ ให้ใช้ระเบียบนี้แทน\nข้อ ๔ ในระเบียบนี้\n“มหาวิทยาลัย” หมายความว่า มหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“สภามหาวิทยาลัย” หมายความว่า สภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“อธิการบดี” หมายความว่า อธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“คณะ” หมายความว่า ส่วนราชการระดับคณะ หรือส่วนราชการอื่นที่เรียกชื่อเป็นอย่างอื่นที่มีฐานะเทียบเท่าคณะที่มีการจัดการเรียนการสอน\n“คณบดี” หมายความว่า หัวหน้าส่วนราชการระดับคณะ หรือหัวหน้าส่วนราชการที่เรียกชื่ออย่างอื่นที่มีฐานะเทียบเท่าคณะที่มีการจัดการเรียนการสอน\n“บัณฑิตศึกษา” หมายความว่า การศึกษาระดับสูงกว่าปริญญาตรีขึ้นไปของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“หลักสูตร” หมายความว่า หลักสูตรที่จัดการเรียนการสอนซึ่งสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพให้ความเห็นชอบ\n“หลักสูตรไม่ได้รับปริญญา” หมายความว่า หลักสูตรที่จัดการเรียนการสอนในรูปแบบหลักสูตรระยะสั้น หลักสูตรระยะยาว หลักสูตรฝึกอบรม หลักสูตรฝึกอาชีพ หรือหลักสูตรอื่นใดที่มีกระบวนการจัดการเรียนการสอน การฝึกอบรมที่มีระบบ อาจจัดในชั้นเรียนหรือการศึกษาแบบทางไกลผ่านสื่อเรียนเป็นกลุ่มหรือเรียนรู้ด้วยตนเองที่มีลักษณะเป็น ชุดวิชารายวิชา หรือโมดูลการเรียนรู้ที่มีหลักฐานการแสดงผลการเรียนเป็นใบรับรองประกาศนียบัตรวุฒิบัตร สัมฤทธิบัตร อนุปริญญา หรือลักษณะอื่นใด\n“คณะกรรมการเทียบโอน” หมายความว่า คณะกรรมการเทียบโอนผลการเรียนที่ได้รับการแต่งตั้งจากคณบดีให้รับผิดชอบในการพิจารณาเทียบโอนผลการเรียน\n“บุคคลเรียนรู้ตลอดชีวิต” หมายความว่า บุคคลในสังกัดมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ นักศึกษาของมหาวิทยาลัยอื่น หรือบุคคลภายนอกที่ขึ้นทะเบียนกับมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เป็นบุคคลเรียนรู้ตลอดชีวิตที่เป็นนักศึกษาของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“นักศึกษา” หมายความว่า ผู้ที่เข้ารับการศึกษาระดับปริญญาตรีหรือระดับบัณฑิตศึกษาของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“นักศึกษาเรียนรู้ตลอดชีวิต” หมายความว่า ผู้ที่ขึ้นทะเบียนเป็นนักศึกษาที่เรียนรู้ตลอดชีวิต\n“รายวิชา” หมายความว่า รายวิชาของหลักสูตรที่เปิดการเรียนการสอนในระดับบัณฑิตศึกษา ระดับปริญญาตรี หรือระดับต่ำกว่าปริญญาตรีของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ หรือสถาบันการศึกษาอื่น\n“ชุดวิชา” หมายความว่า ชุดรายวิชาหรือกลุ่มรายวิชาที่มีเนื้อหาเกี่ยวกับเรื่องใดเรื่องหนึ่ง ที่ให้ความรู้เป็นองค์รวม หรือมีลักษณะเป็นการบูรณาการ โดยแต่ละชุดวิชามีการจัดการเรียนการสอนต่อเนื่องกันเบ็ดเสร็จในระยะเวลาหนึ่งของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพหรือสถาบันการศึกษาอื่น\n“โมดูลการเรียนรู้” หมายความว่า หน่วยการเรียนรู้ที่มีกระบวนการเรียนการสอนอย่างเป็นระบบสมบูรณ์แบบ โดยโมดูลการเรียนรู้ต้องระบุผลลัพธ์และการวัดและประเมินผลการเรียนรู้แต่ละโมดูลการเรียนรู้ให้ชัดเจน\n“ระบบคลังหน่วยกิต” หมายความว่า ระบบและกลไกในการเทียบโอนความรู้ความสามารถหรือสมรรถนะที่ได้จากการศึกษาในระบบ การศึกษานอกระบบ การศึกษาตามอัธยาศัย และจากประสบการณ์บุคคล มาเก็บสะสมไว้ในคลังหน่วยกิตของมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\n“คลังหน่วยกิต” หมายความว่า ระบบทะเบียนสะสมหน่วยกิตสำหรับผู้เรียนที่เข้าศึกษา รายวิชาต่าง ๆ ในหลักสูตรระยะสั้น หลักสูตรฝึกอบรม หรือหลักสูตรระยะยาวในระดับอนุปริญญาหรือระดับประกาศนียบัตรวิชาชีพชั้นสูง หรือปริญญาตรี หรือบัณฑิตศึกษา ของสถาบันอุดมศึกษาที่จัดไว้สำหรับการจัดการศึกษา และที่ได้จากการเทียบโอนในระบบคลังหน่วยกิต โดยจัดให้มีหลักฐานการสะสมหน่วยกิต อาทิ สมุดสะสมหน่วยกิต แฟ้มสะสมงานแบบอิเล็กทรอนิกส์ออนไลน์ และฝากในคลังหน่วยกิตของมหาวิทยาลัย\n“การศึกษาในระบบ” หมายความว่า เป็นการศึกษาที่กำหนดจุดมุ่งหมายวิธีการศึกษา หลักสูตร ระยะเวลาของการศึกษา การวัดและประเมินผล ซึ่งเป็นเงื่อนไขของการสำเร็จการศึกษาที่แน่นอน\n“การศึกษานอกระบบ” หมายความว่า เป็นการศึกษาที่มีความยืดหยุ่นในการกำหนดจุดมุ่งหมาย รูปแบบ วิธีการจัดการศึกษา ระยะเวลาของการศึกษา การวัดและประเมินผลซึ่งเป็นเงื่อนไขสำคัญของการสำเร็จการศึกษา โดยเนื้อหาและหลักสูตรจะต้องมีความเหมาะสมสอดคล้องกับสภาพปัญหาและความต้องการของบุคคลแต่ละกลุ่ม\n“การศึกษาตามอัธยาศัย” หมายความว่า เป็นการศึกษาที่ให้ผู้เรียนได้เรียนรู้ด้วยตนเอง ตามความสนใจ ศักยภาพ ความพร้อมและโอกาส โดยศึกษาจากบุคคล ประสบการณ์สังคม สภาพแวดล้อม สื่อหรือแหล่งความรู้อื่น ๆ\n“ประสบการณ์บุคคล” หมายความว่า ความสามารถและหรือสมรรถนะของบุคคลที่สั่งสมไว้จากการศึกษาด้วยตนเอง ประสบการณ์จากการทำงาน การฝึกอบรมที่สถานประกอบการจัดขึ้น การฝึกอบรมจากการปฏิบัติงาน การฝึกอาชีพ การสัมมนาและการประชุมเชิงปฏิบัติการ\n“ผลการเรียน” หมายความว่า ความรู้ ทักษะ และเจตคติที่เกิดจากการศึกษาในระบบซึ่งสามารถแสดงในรูปของคะแนนผลการเรียนหรือคำนวณค่าระดับคะแนนเฉลี่ยสะสมได้\n“ผลลัพธ์การเรียนรู้” หมายความว่า ความรู้ ทักษะและเจตคติที่เกิดจากการศึกษานอกระบบ การศึกษาตามอัธยาศัย และประสบการณ์บุคคลที่สั่งสมไว้ ที่เทียบได้ตามมาตรฐานผลการเรียนรู้ ของแต่ละระดับคุณวุฒิตามกรอบมาตรฐานคุณวุฒิระดับอุดมศึกษาแห่งชาติ ซึ่งสามารถวัดและประเมินได้โดยวิธีการต่าง ๆ ตลอดหลักสูตรเทียบเท่าไม่น้อยกว่ารายวิชาที่เปิดสอนในมหาวิทยาลัย\n“การเทียบโอนผลการเรียน” หมายความว่า การนำผลการเรียนรู้ ซึ่งเป็นความรู้ทักษะเจตคติ และประสบการณ์ ของผู้เรียนที่เกิดจากการศึกษาในระบบ การศึกษานอกระบบและการศึกษาตามอัธยาศัย การฝึกอบรม หรือจากประสบการณ์ทำงาน ที่ผู้เรียนสะสมไว้นำมาเทียบโอนผลการเรียน ในรูปแบบเดียวหรือต่างรูปแบบ ในมหาวิทยาลัยหรือหน่วยงานอื่น หรือการเรียนด้วยตนเอง มาประเมินเป็นส่วนหนึ่งของการศึกษาตามหลักสูตรของมหาวิทยาลัย\n“การเทียบโอนประสบการณ์” หมายความว่า การนำผลลัพธ์การเรียนรู้มาขอเทียบกับเนื้อหาสาระสำคัญของรายวิชาต่าง ๆ ของการเรียนในระบบตามหลักสูตรเพื่อให้ได้หน่วยกิตโดยผู้เรียนสามารถแสดงได้ว่า มีความรู้ ทักษะ และเจตคติของตนเอง พร้อมทั้งมีหลักฐานซึ่งแสดงว่าผู้เรียนมีผลสัมฤทธิ์ ตรงตามวัตถุประสงค์ หรือผลลัพธ์การเรียนรู้ ที่กำหนดในรายวิชาหรือชุดวิชาหรือโมดูลการเรียนรู้ของหลักสูตรที่ผู้เรียนศึกษาอยู่หรือประสงค์จะศึกษา ซึ่งควรได้รับการประเมินผลการเรียนรู้เพื่อเทียบโอนประสบการณ์ที่มีเพื่อส่งเสริมการเรียนรู้ตลอดชีวิตและไม่ต้องศึกษาซ้ำในเนื้อหาสาระที่ผู้เรียนมีความรู้ ทักษะมาก่อนแล้ว ทั้งนี้ การเทียบโอนประสบการณ์ให้เป็นไปตามหลักเกณฑ์การเทียบโอนผลการเรียนระดับปริญญาเข้าสู่การศึกษาในระบบ และข้อแนะนำเกี่ยวกับแนวปฏิบัติที่ดีในการเทียบโอนผลการเรียนระดับปริญญา\nข้อ ๕ ให้อธิการบดีรักษาการตามระเบียบนี้ และมีอำนาจวินิจฉัยตีความ ตลอดจนออกประกาศเพื่อให้การปฏิบัติตามระเบียบนี้เป็นไปด้วยความเรียบร้อย ทั้งนี้ คำวินิจฉัยให้ถือเป็นที่สุด\nหมวด ๑\nบททั่วไป\nข้อ ๖ ระเบียบนี้ให้ใช้บังคับกับนักศึกษาระดับบัณฑิตศึกษา ระดับปริญญาตรี และระดับต่ำกว่าปริญญาตรี\nข้อ ๗ คุณสมบัติของผู้มีสิทธิ์ขอเทียบโอนผลการเรียน\n(๑) ต้องมีคุณสมบัติพื้นฐานตามที่กำหนดในเกณฑ์มาตรฐานหลักสูตรการศึกษาของมหาวิทยาลัยที่ขอเทียบโอนผลการเรียน ดังนี้\n(๑.๑) กรณีขอเทียบโอนผลการเรียนระดับประกาศนียบัตรวิชาชีพชั้นสูงอนุปริญญาและระดับปริญญาตรี ต้องสำเร็จการศึกษาระดับการศึกษาขั้นพื้นฐานระดับมัธยมศึกษาตอนปลายหรือเทียบเท่าขึ้นไป\n(๑.๒) กรณีขอเทียบโอนผลการเรียนระดับบัณฑิตศึกษา ต้องเป็นผู้สำเร็จการศึกษาระดับปริญญาตรีหรือเทียบเท่าขึ้นไป\n(๒) ผู้ขอเทียบโอนผลการเรียน ต้องขึ้นทะเบียนเป็นนักศึกษาของมหาวิทยาลัย และสำหรับบุคคลเรียนรู้ตลอดชีวิต หรือนักศึกษาเรียนรู้ตลอดชีวิตต้องขึ้นทะเบียนเพื่อเก็บสะสมหน่วยกิตในคลังหน่วยกิต\nข้อ ๘ การเทียบโอนผลการเรียนให้ปฏิบัติดังต่อไปนี้\n(๑) ให้คณบดีแต่งตั้งคณะกรรมการเทียบโอนผลการเรียน ซึ่งมีคุณสมบัติสอดคล้องกับระดับการศึกษาและสาขาวิชาที่ขอเทียบโอน จำนวนไม่น้อยกว่าสามคน ดำเนินการเทียบโอนผลการเรียนตามหลักสูตรที่กำหนด โดยอาจแต่งตั้งผู้ทรงคุณวุฒิจากบุคคลภายนอกมหาวิทยาลัยก็ได้\n(๒) คณะกรรมการเทียบโอนผลการเรียน มีหน้าที่ดำเนินการเทียบโอนผลการเรียนรู้และประเมินความรู้ ทักษะ หรือประสบการณ์ตามแนวปฏิบัติการเทียบโอนผลการเรียนจากการศึกษา ในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัยเข้าสู่ระบบการศึกษาในระบบตามประกาศของมหาวิทยาลัย\n(๓) ให้คณะดำเนินการเทียบโอนผลการเรียนภายในปีการศึกษาแรกที่ขึ้นทะเบียนเป็นนักศึกษากรณีมีเหตุผลความจำเป็นไม่สามารถดำเนินการเทียบโอนผลการเรียนภายในกำหนดเวลาตามวรรคหนึ่ง ให้อยู่ในดุลพินิจของคณบดีจะพิจารณาให้ขอเทียบโอน\nข้อ ๙ ผู้ขอเทียบโอนผลการเรียนต้องชำระค่าธรรมเนียมการเทียบโอนรายวิชาตามประกาศของมหาวิทยาลัย\nข้อ ๑๐ ให้คณบดีเป็นผู้อนุมัติการเทียบโอนผลการเรียน\nข้อ ๑๑ แนวปฏิบัติการเทียบโอนผลการเรียนจากการศึกษาในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัยเข้าสู่ระบบการศึกษาในระบบ ให้เป็นไปตามประกาศของมหาวิทยาลัย\nข้อ ๑๒ แนวทางการดำเนินการพัฒนาและบริหารจัดการหลักสูตรระยะสั้น เพื่อการสะสมหน่วยกิตในระบบคลังหน่วยกิต ให้เป็นไปตามประกาศของมหาวิทยาลัย\nหมวด ๒\nการเทียบโอนผลการเรียนในระบบ\nข้อ ๑๓ หลักเกณฑ์การเทียบโอนผลการเรียน โดยการเทียบรายวิชา ชุดวิชา โมดูลการเรียนรู้และโอนหน่วยกิตระหว่างการศึกษาในระบบ มีดังนี้\nก. ระดับปริญญาตรี\n(๑) ให้เทียบโอนรายวิชา ชุดวิชา หรือโมดูลการเรียนรู้ ซึ่งมีเนื้อหาสาระการเรียนรู้ และจุดประสงค์ครอบคลุม ไม่น้อยกว่าสามในสี่ของรายวิชาในสาขาวิชาที่นักศึกษาขอเทียบโอน\n(๒) รายวิชาหรือชุดวิชา ที่จะนำมาเทียบโอนต้องมีระดับคะแนนไม่ต่ำกว่า “ค”\nหรือ “C” หรือแต้มระดับคะแนน ๒.๐๐ หรือเทียบเท่า\n(๓) โมดูลการเรียนรู้ สามารถเทียบโอนหน่วยกิตเข้าสู่การศึกษาในระบบได้โดยคณะกรรมการเทียบโอนผลการเรียน\n(๔) รายวิชา ชุดวิชา หรือโมดูลการเรียนรู้ที่เทียบโอนหน่วยกิตให้ เมื่อรวมกันแล้วต้องมีจำนวนหน่วยกิตไม่เกินสามในสี่ของจำนวนหน่วยกิตรวมของหลักสูตรที่รับเทียบโอน\n(๕) ในกรณีที่มหาวิทยาลัยเปิดหลักสูตรใหม่ จะเทียบโอนนักศึกษาได้ไม่เกินกว่าชั้นปี และภาคการศึกษาที่ได้รับอนุญาตให้มีนักศึกษาเรียนอยู่ตามหลักสูตรที่ได้รับความเห็นชอบแล้ว\n(๖) ผู้ขอเทียบโอนที่สำเร็จการศึกษาระดับประกาศนียบัตรวิชาชีพชั้นสูง หรืออนุปริญญาหรือปริญญาตรีสามารถเทียบโอนเข้าสู่การศึกษาในระบบได้โดยคณะกรรมการเทียบโอนผลการเรียน\n(๗) นักศึกษาจะต้องใช้เวลาศึกษาอยู่ในมหาวิทยาลัยที่รับโอนอย่างน้อยหนึ่งปีการศึกษา\nข. ระดับบัณฑิตศึกษา\n(๑) ให้เทียบโอนผลการเรียน รายวิชา ชุดวิชา หรือโมดูลการเรียนรู้ ซึ่งมีเนื้อหาสาระการเรียนรู้ และจุดประสงค์ครอบคลุม เมื่อรวมกันแล้วต้องมีจำนวนไม่เกินหลักเกณฑ์มาตรฐานการศึกษากำหนดในแต่ละระดับการศึกษา\n(๒) การขอเทียบโอนผลการเรียน รายวิชา ชุดวิชา หรือโมดูลการเรียนรู้ต้องมีเนื้อหาสาระครอบคลุมไม่น้อยกว่าสามในสี่ของรายวิชา หรือชุดวิชาที่ขอเทียบโอนผลการเรียน\n(๓) การเทียบโอนผลการเรียน รายวิชา ชุดวิชาต้องมีระดับคะแนนไม่ต่ำกว่า\n“ข” หรือ “B” หรือแต้มระดับคะแนน ๓.๐๐ หรือเทียบเท่า\n(๔) โมดูลการเรียนรู้สามารถเทียบโอนหน่วยกิตเข้าสู่การศึกษาในระบบได้ โดยคณะกรรมการเทียบโอนผลการเรียน\n(๕) การเทียบโอนหน่วยกิตที่ได้จากรายวิชา หรือชุดวิชาในระดับบัณฑิตศึกษาที่ลงทะเบียนเรียนรายวิชา หรือชุดวิชานั้น กระทำได้โดยความเห็นชอบจากคณะกรรมการเทียบโอนผลการเรียน\n(๖) นักศึกษาต้องลงทะเบียนเรียนรายวิชา หรือวิทยานิพนธ์ หรือการค้นคว้าอิสระตามจำนวนหน่วยกิตที่สอดคล้องกับหลักสูตร\n(๗) นักศึกษาจะเทียบโอนรายวิชาเรียน หรือเทียบโอนหน่วยกิตได้ไม่เกินหนึ่งในสามของจำนวนหน่วยกิตรวมของหลักสูตรที่รับเทียบโอน ทั้งนี้ ไม่นับรวมหน่วยกิตของวิทยานิพนธ์และการค้นคว้าอิสระ\n(๘) นักศึกษาจะต้องใช้เวลาศึกษาอยู่ในมหาวิทยาลัยที่รับโอนอย่างน้อยหนึ่งปีการศึกษา\n(๙) ในกรณีที่มหาวิทยาลัยเปิดหลักสูตรใหม่ จะเทียบโอนนักศึกษาได้ไม่เกินกว่าชั้นปี และภาคการศึกษาที่ได้รับอนุญาตให้มีนักศึกษาเรียนอยู่ตามหลักสูตรที่ได้รับความเห็นชอบแล้ว\nข้อ ๑๔ ให้มีการบันทึกการเทียบโอนผลการเรียน และการประเมินผล ดังนี้\nก. ระดับปริญญาตรี\n(๑) รายวิชา ชุดวิชา หรือโมดูลการเรียนรู้ที่เทียบโอนผลการเรียนได้จะไม่นำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาค และค่าระดับคะแนนเฉลี่ยสะสม โดยให้บันทึก “เทียบโอนในระบบ” หรือ “Transfer Credits” ไว้ส่วนบนของรายวิชาที่เทียบโอนผลการเรียนในใบแสดงผลการเรียน\n(๒) รายวิชาหรือชุดวิชาที่เทียบโอนให้ หากเป็นหลักสูตรที่มีองค์กรวิชาชีพควบคุมและต้องใช้ผลการเรียนยื่นขอใบประกอบวิชาชีพ ให้เป็นไปตามข้อกำหนดขององค์กรวิชาชีพกรณีองค์กรวิชาชีพกำหนดระดับคะแนนในรายวิชาหรือชุดวิชาที่เทียบโอน ผลการเรียน เพื่อนำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาค และค่าระดับคะแนนเฉลี่ยสะสมให้บันทึกตัวอักษร “TC” (Transfer Credits) ไว้ส่วนท้ายรายวิชา หรือชุดวิชาที่เทียบโอนผลการเรียนได้ในใบแสดงผลการเรียนรายวิชาหรือชุดวิชาที่เทียบโอนในใบแสดงผลการเรียน\nข. ระดับบัณฑิตศึกษา\nรายวิชา ชุดวิชาหรือโมดูลการเรียนรู้ที่เทียบโอนให้ จะไม่นำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาคและค่าระดับคะแนนเฉลี่ยสะสม โดยให้บันทึก “เทียบโอนในระบบ”\nหรือ “Transfer Credits” ไว้ส่วนบนของรายวิชาที่เทียบโอนให้ในใบแสดงผลการเรียน\nข้อ ๑๕ นักศึกษาที่ไปศึกษาที่สถาบันอุดมศึกษาอื่นในประเทศ หรือต่างประเทศตามโครงการความร่วมมือในการผลิตบัณฑิตร่วมกัน หรือตามโครงการแลกเปลี่ยนทางวิชาการสามารถนำรายวิชาและหน่วยกิตที่ได้ศึกษามาแล้ว มาเทียบโอนเป็นรายวิชาและหน่วยกิตในหลักสูตรของมหาวิทยาลัย โดยมีหลักเกณฑ์ดังนี้\n(๑) รายวิชาที่นำมาเทียบโอนให้บันทึกรายวิชาตามหลักสูตร เป็นค่าระดับคะแนนก (A) ข+ (B+) ข (B) ค+ (C+) ค (C) ง+ (D+) ง (D) และ ต (F)\n(๒) ให้นำผลการศึกษาทุกรายวิชาที่มีผลการเรียนตามข้อ (๑) มาคำนวณแต้มระดับคะแนนเฉลี่ยรวมกับรายวิชาที่ศึกษาในมหาวิทยาลัย\n(๓) นักศึกษาเทียบโอนรายวิชาของคู่สถาบันได้ไม่เกินกึ่งหนึ่งของจำนวนหน่วยกิตรวมของหลักสูตรที่รับเทียบโอน\n(๔) นักศึกษาไม่ต้องชำระค่าธรรมเนียมการเทียบโอนรายวิชา\nหมวด ๓\nการเทียบโอนผลการเรียน จากการศึกษานอกระบบ และการศึกษาตามอัธยาศัยเข้าสู่การศึกษาในระบบ\nข้อ ๑๖ หลักเกณฑ์การเทียบโอนผลการเรียน โดยการเทียบโอนผลลัพธ์การเรียนรู้และให้หน่วยกิตจากการศึกษานอกระบบ และการศึกษาตามอัธยาศัย เข้าสู่การศึกษาในระบบมีดังนี้\nก. ระดับปริญญาตรี\n(๑) วิธีการประเมินเพื่อการเทียบโอนผลการเรียน โดยการเทียบโอนผลลัพธ์การเรียนรู้จะกระทำได้โดยการทดสอบมาตรฐาน การทดสอบที่ไม่ใช่การทดสอบมาตรฐานการประเมินการจัดการศึกษาหรืออบรมที่จัดโดยหน่วยงานภาครัฐหรือเอกชน การประเมินแฟ้มสะสมงาน\n(๒) การเทียบโอนผลลัพธ์การเรียนรู้ โดยเทียบโอนผลการเรียนจะเทียบรายวิชาตามหลักสูตรที่เปิดสอนในมหาวิทยาลัย โดยรายวิชา หรือชุดวิชาให้เมื่อรวมกันแล้วต้องมีจำนวนหน่วยกิตไม่เกินสามในสี่ของจำนวนหน่วยกิตตลอดหลักสูตร\n(๓) การขอเทียบโอนผลลัพธ์การเรียนรู้ โดยเทียบโอนผลการเรียนเป็นรายวิชา หรือชุดวิชาให้คณะกรรมการเทียบโอนเป็นผู้ดำเนินการเทียบโอน ตามแนวปฏิบัติการเทียบโอนผลการเรียนจากการศึกษาในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัยเข้าสู่ระบบการศึกษาในระบบ ที่มหาวิทยาลัยกำหนด โดยการเทียบโอนผลลัพธ์การเรียนรู้นั้นต้องได้รับผลการประเมินเทียบผลการเรียนได้ ไม่ต่ำกว่า “ค” หรือ “C” หรือแต้มคะแนน ๒.๐๐หรือเทียบเท่า จึงจะให้นับจำนวนหน่วยกิตชุดวิชาหรือรายวิชานั้น\n(๔) รายวิชาหรือชุดวิชาที่เทียบโอนให้ จะไม่นำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาค และค่าระดับคะแนนเฉลี่ยสะสม โดยบันทึก “เทียบโอนนอกระบบ” หรือ “PriorLearning Credits” ไว้ส่วนบนของรายวิชาที่เทียบโอนให้ในใบแสดงผลการเรียน เว้นแต่หลักสูตรที่มีองค์กรวิชาชีพควบคุม ให้เป็นไปตามหลักเกณฑ์และข้อกำหนดขององค์กรวิชาชีพนั้นในกรณีมีเหตุผลความจำเป็น มหาวิทยาลัยมีเอกสิทธิ์ที่จะให้ภาควิชาหรือสาขาวิชาทำการประเมินความรู้ของผู้ที่จะขอเทียบโอนความรู้\nข. ระดับบัณฑิตศึกษา\n(๑) วิธีการประเมินเพื่อการเทียบโอนผลการเรียน โดยการเทียบโอนผลลัพธ์การเรียนรู้จะกระทำได้โดยการทดสอบมาตรฐาน หรือการทดสอบที่ไม่ใช่การทดสอบมาตรฐานการประเมินการจัดการศึกษา หรืออบรมที่จัดโดยหน่วยงานภาครัฐหรือเอกชนหรือการประเมินแฟ้มสะสมงาน\n(๒) การขอเทียบโอนผลลัพธ์การเรียนรู้ โดยเทียบโอนผลการเรียนเป็นรายวิชาหรือชุดวิชา ให้คณะกรรมการเทียบโอนเป็นผู้ดำเนินการเทียบโอนตามแนวปฏิบัติการเทียบโอนผลการเรียนจากการศึกษาในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัยเข้าสู่ระบบการศึกษาในระบบที่มหาวิทยาลัยกำหนด โดยการเทียบโอนผลลัพธ์การเรียนรู้นั้นต้องได้รับผลการประเมินเทียบได้ไม่ต่ำกว่า B หรือแต้มระดับคะแนน ๓.๐๐ หรือเทียบเท่าสำหรับรายวิชาหรือชุดวิชานั้น จึงจะให้นับจำนวนหน่วยกิตรายวิชาหรือชุดวิชานั้น แต่จะไม่ให้ระดับคะแนนตัวอักษร และไม่มีการนำมาคิดคะแนนผลการเรียน\n(๓) นักศึกษาต้องลงทะเบียนเรียนรายวิชาหรือวิทยานิพนธ์หรือการค้นคว้าอิสระตามจำนวนหน่วยกิตที่สอดคล้องกับหลักสูตร\n(๔) รายวิชาที่เทียบโอนให้ จะไม่นำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาคและค่าระดับคะแนนเฉลี่ยสะสม โดยบันทึก “เทียบโอนนอกระบบ” หรือ “Prior LearningCredits” ไว้ส่วนบนของรายวิชาที่เทียบโอนให้ในใบแสดงผลการเรียน เว้นแต่หลักสูตรที่มีองค์กรวิชาชีพควบคุมให้เป็นไปตามหลักเกณฑ์และข้อกำหนดขององค์กรวิชาชีพนั้นในกรณีมีเหตุผลความจำเป็น มหาวิทยาลัยมีเอกสิทธิ์ที่จะให้คณะทำการประเมินความรู้ของผู้ที่จะขอเทียบโอนความรู้\nข้อ ๑๗ ให้มีการบันทึกผลการเรียนรายวิชา และชุดวิชาตามวิธีการดังต่อไปนี้\n(๑) หน่วยกิตที่ได้จากการทดสอบมาตรฐาน ให้บันทึกอักษร “CS” (Credits fromStandardized Test)\n(๒) หน่วยกิตที่ได้จากการทดสอบที่ไม่ใช่การทดสอบมาตรฐาน ให้บันทึกอักษร\n“CE” (Credits from Examination)\n(๓) หน่วยกิตที่ได้จากการประเมินการจัดการศึกษาหรืออบรมที่ไม่ได้จัด โดยสถาบันอุดมศึกษา ให้บันทึกอักษร “CT” (Credits from Training)\n(๔) หน่วยกิตที่ได้จากการเสนอแฟ้มสะสมผลงาน ให้บันทึกอักษร “CP” (Creditsfrom Portfolio)\n(๕) หน่วยกิตจากการประเมินการศึกษาหรืออบรมหลักสูตรในสถาบันอุดมศึกษาที่ไม่ได้รับปริญญา ให้บันทึกอักษร “CN” (Credits from Non-degree Program)\n(๖) หน่วยกิตจากการประเมินการศึกษาหลักสูตรในระบบคลังหน่วยกิต ของมหาวิทยาลัย ให้บันทึกอักษร “CC” (Credits from Credits Bank System of RMUTK)การบันทึกผลการเทียบโอนตามวิธีการประเมินในวรรคหนึ่ง ให้บันทึกไว้ส่วนท้ายของรายวิชา หรือชุดวิชาที่เทียบโอนให้กรณีที่ผู้ขอเทียบโอน มีผลการเรียนตามวิธีการประเมินมากกว่าหนึ่งวิธีการประเมินให้สามารถนำมารวมกันและบันทึกผลการเทียบโอนได้ในกรณีที่หลักสูตรที่มีองค์กรวิชาชีพควบคุม และต้องใช้ผลการเรียนประกอบการขอใบอนุญาตประกอบวิชาชีพ ให้กำหนดระดับคะแนนในรายวิชา หรือกลุ่มวิชาเพื่อนำมาคิดค่าระดับคะแนนเฉลี่ยประจำภาค และค่าระดับคะแนนเฉลี่ยสะสม โดยบันทึกอักษร “PL” (PriorLearning) ไว้ส่วนท้ายรายวิชาที่เทียบโอนให้ในใบแสดงผลการเรียน\nข้อ ๑๘ การพิจารณาบันทึกผลการเรียนรู้ ให้เป็นไปตามที่คณะกรรมการเทียบโอนผลการเรียนกำหนด\nบทเฉพาะกาล\nข้อ ๑๙ นักศึกษาที่เข้าศึกษาก่อนปีการศึกษา ๒๕๖๔ ให้ใช้หลักเกณฑ์การเทียบโอนตามระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ว่าด้วยการเทียบโอนผลการเรียนพ.ศ. ๒๕๕๐ จนกว่าจะสำเร็จการศึกษาโดยอนุโลม\nประกาศ ณ วันที่ ๑ มีนาคม พ.ศ. ๒๕๖๔\nศักดิ์ทิพย์ ไกรฤกษ์\n(นายศักดิ์ทิพย์ ไกรฤกษ์)\nนายกสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "cross2551": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง การลงทะเบียนเรียนข้ามภาคการศึกษา\n------------------------------------------เพื่อให้การลงทะเบียนเรียนของนักศึกษาระดับปริญญาตรี ดำเนินไปด้วยความเป็นระเบียบเรียบร้อย อย่างมีประสิทธิภาพ มหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพจึงขอแจ้งกำหนดการ ดังต่อไปนี้นักศึกษาที่มีความประสงค์จะลงทะเบียนเรียนข้ามภาค เช่น ภาคปกติไปภาคสมทบ หรือภาคสมทบไปภาคปกติจะต้องชำระค่าธรรมเนียมการลงทะเบียนเรียนข้ามภาคในรายวิชาละ ๑,๐๐๐ บาท และไม่เกิน ๒ รายวิชา ต่อภาคการศึกษากรณีที่นักศึกษาภาคปกติลงทะเบียนเรียนข้ามภาค กับนักศึกษาภาคสมทบเกิน๒ รายวิชา ถือเป็นการย้ายรอบ จะต้องชำระค่าธรรมเนียมการลงทะเบียนเช่นเดียวกับนักศึกษาภาคสมทบ และกรณีนักศึกษาภาคสมทบลงทะเบียนเรียนข้ามภาคกับนักศึกษาภาคปกติจะลงทะเบียนได้ไม่เกิน ๒ รายวิชาประกาศนี้ให้ใช้บังคับตั้งแต่วันประกาศเป็นต้นไป\nประกาศ ณ วันที่ ๒๔ ธันวาคม พ.ศ. ๒๕๕๑\n(ลงชื่อ) เฉลิม มัติโก\n(ผู้ช่วยศาสตราจารย์เฉลิม มัติโก)\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "equiv2554": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง หลักเกณฑ์การพิจารณาเทียบรายวิชาหรือกลุ่มวิชา\n----------------------------------------\nเพื่อให้การพิจารณาการเทียบรายวิชาหรือกลุ่มวิชาระหว่างหลักสูตรต่าง ๆ ภายในมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ มีข้อพิจารณาการเทียบรายวิชาที่เป็นมาตรฐานเดียวกัน มหาวิทยาลัยจึงประกาศดังนี้\nข้อ ๑ ประกาศนี้ เรียกว่า “ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพเรื่อง หลักเกณฑ์การพิจารณาเทียบรายวิชาหรือกลุ่มวิชา”\nข้อ ๒ หลักเกณฑ์การพิจารณาการเทียบรายวิชาหรือกลุ่มวิชา\n๒.๑ เป็นรายวิชาหรือกลุ่มวิชาที่มีเนื้อหาสาระการเรียนรู้ และจุดประสงค์ครอบคลุมไม่น้อยกว่าสามในสี่ของรายวิชาหรือกลุ่มวิชาที่นักศึกษาต้องการเทียบ ยกเว้นรายวิชาที่อยู่ในข้อบังคับของสภาวิชาชีพให้ยึดถือตามเงื่อนไขที่สภาวิชาชีพกำหนด\n๒.๒ เป็นรายวิชาหรือกลุ่มวิชาที่มีหน่วยกิตเท่ากัน\n๒.๓ เป็นรายวิชาหรือกลุ่มวิชาที่มีจำนวนชั่วโมงปฏิบัติ และจำนวนชั่วโมงบรรยายเท่ากัน\nข้อ ๓ ในกรณีไม่เป็นไปตามข้อ ๒.๒ หรือ ๒.๓ ให้อนุโลมเทียบกันได้โดยถือหลักว่า รายวิชาหรือกลุ่มวิชาที่นำมาขอเทียบต้องมีจำนวนหน่วยกิตและชั่วโมงปฏิบัติ และชั่วโมงบรรยายไม่น้อยกว่ารายวิชาหรือกลุ่มวิชาในหลักสูตรที่ต้องการเทียบ\nข้อ ๔ ในกรณีที่มีปัญหาอันเกิดจากการเทียบรายวิชาหรือกลุ่มวิชาตามประกาศนี้ ให้อธิการบดีเป็นผู้มีอำนาจวินิจฉัยชี้ขาด\nข้อ ๕ ประกาศนี้ ให้ใช้บังคับตั้งแต่วันถัดจากวันประกาศเป็นต้นไป\nประกาศ ณ วันที่ ๗ ธันวาคม พ.ศ. ๒๕๕๔\nลงชื่อ สาธิต พุทธชัยยงค์\n(นายสาธิต พุทธชัยยงค์)\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "smbfee2569": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง อัตราการเก็บเงินค่าบำรุงการศึกษา ค่าลงทะเบียน ค่าสนับสนุนการจัดการศึกษาและค่าธรรมเนียมการศึกษาในการจัดการศึกษาระดับปริญญาตรี ภาคสมทบพ.ศ. ๒๕๖๙\n_____\nด้วยมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เห็นสมควรปรับปรุงอัตราการเก็บเงินค่าบำรุงการศึกษา ค่าลงทะเบียน ค่าสนับสนุนการจัดการศึกษา และค่าธรรมเนียมการศึกษาในการจัดการศึกษาระดับปริญญาตรี ภาคสมทบอาศัยอำนาจตามความในมาตรา ๒๔ และมาตรา ๒๗ แห่งพระราชบัญญัติมหาวิทยาลัยเทคโนโลยีราชมงคล พ.ศ. ๒๕๔๘ ประกอบกับข้อ ๖ แห่งระเบียบมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ว่าด้วยการรับเงินและการจ่ายเงินเพื่อจัดโครงการ การจัดการศึกษาระดับปริญญาตรี และระดับบัณฑิตศึกษา ภาคสมทบ และภาคพิเศษ พ.ศ. ๒๕๖๗ จึงกำหนดอัตราการเก็บเงินค่าบำรุงการศึกษา ค่าลงทะเบียน ค่าสนับสนุนการจัดการศึกษา และค่าธรรมเนียมการศึกษาในการจัดการศึกษาระดับปริญญาตรี ภาคสมทบ ดังต่อไปนี้\nข้อ ๑ ประกาศนี้ เรียกว่า “ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เรื่องอัตราการเก็บเงินค่าบำรุงการศึกษา ค่าลงทะเบียน ค่าสนับสนุนการจัดการศึกษา และค่าธรรมเนียมการศึกษาในการจัดการศึกษาระดับปริญญาตรี ภาคสมทบ พ.ศ. ๒๕๖๙”\nข้อ ๒ ประกาศนี้ให้ใช้บังคับตั้งแต่ปีการศึกษา ๒๕๖๘ เป็นต้นไป\nข้อ ๓ ให้อธิการบดีรักษาการตามประกาศนี้ และให้มีอำนาจอออกประกาศ คำสั่ง หรือแนวปฏิบัติเพื่อดำเนินการตามประกาศนี้ รวมทั้งให้มีอำนาจวินิจฉัยตีความในกรณีที่มีปัญหาเกี่ยวกับการปฏิบัติตามประกาศนี้ และคำวินิจฉัยนั้น ให้ถือเป็นสุด\nข้อ ๔ ให้กำหนดอัตราการเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียน ดังนี้ลำดับที่ คณะ จำนวนเงิน๑ คณะศิลปศาสตร์ ๑๘,๐๐๐ บาท (หนึ่งหมื่นแปดดพันบาทถ้วนลำดับที่ คณะ จำนวนเงิน๒ คณะวิทยาศาสตร์และเทคโนโลยี- สาขาวิชาเคมี- สาขาวิชาวิทยาการคอมพิวเตอร์/เทคโนโลยีสารสนเทศ- สาขาวิชาวิทยาศาสตร์เพื่อสุขภาพและความงาม- สาขาวิชาเทคโนโลยีชีวภาพเพื่ออุตสาหกรรมเกษตรและสิ่งแวดล้อม- สาขาวิชาเทคโนโลยีพลังงานเพื่อสิ่งแวดล้อม๑๘,๑๐๐บาท(หนึ่งหมื่นแปดพันหนึ่งร้อยบาทถ้วน)- สาขาวิชาอื่น ๆ ๒๐,๒๐๐ บาท (สองหมื่นสองร้อยบาทถ้วน)๓ คณะครุศาสตร์อุตสาหกรรม ๒๐,๒๐๐ บาท (สองหมื่นสองร้อยบาทถ้วน)๔ คณะวิศวกรรมศาสตร์ ๒๐,๒๐๐ บาท (สองหมื่นสองร้อยบาทถ้วน)๕ คณะบริหารธุรกิจ- สาขาวิชาระบบสารสนเทศ- สาขาวิชาเทคโนโลยีสารสนเทศและธุรกิจดิจิทัล๑๙,๐๐๐ บาท (หนึ่งหมื่นเก้าพันบาทถ้วน)- สาขาวิชาอื่น ๆ ๑๘,๐๐๐ บาท (หนึ่งหมื่นแปดพันบาทถ้วน)๖ คณะเทคโนโลยีคหกรรมศาสตร์ ๑๘,๑๐๐บาท(หนึ่งหมื่นแปดพันหนึ่งร้อยบาทถ้วน)๗ คณะอุตสาหกรรมสิ่งทอ ๒๐,๒๐๐ บาท (สองหมื่นสองร้อยบาทถ้วน)\nข้อ ๕ กรณีที่นักศึกษาลงทะเบียนไม่เกิน ๑๒ หน่วยกิต ให้จ่ายครึ่งหนึ่งของอัตราการเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียน ตามข้อ ๔\nข้อ ๖ กรณีที่นักศึกษาชำระเงินค่าบำรุงการศึกษา และค่าลงทะเบียน ตามข้อ ๔ และข้อ ๕แล้ว นักศึกษาสามารถยื่นคำร้องขอถอนคืนเงินภายใน ๓๐ วันนับจากวันเปิดภาคการศึกษาในกรณีดังต่อไปนี้\n(๑) นักศึกษาที่ขอถอนรายวิชาภายใน ๑๔ วันแรกของภาคการศึกษาปกติมีหน่วยกิตคงเหลือไม่เกิน ๑๒ หน่วยกิต จะขอถอนคืนเงินได้ครึ่งหนึ่งของอัตราการเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียน ตามข้อ ๔\n(๒) นักศึกษาที่มหาวิทยาลัยประกาศภายหลังว่า พ้นสภาพเนื่องจากผลการเรียนในภาคการศึกษาที่ผ่านมา จะขอถอนคืนเงินค่าบำรุงการศึกษา และค่าลงทะเบียน ตามข้อ ๔ และ\nข้อ ๕ ได้เต็มจำนวน\n(๓) นักศึกษาที่ชำระเงินเกินกว่าอัตราการเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียนตามข้อ ๔ และข้อ ๕ จะขอถอนคืนเงินที่ชำระเกินได้เต็มจำนวน\nข้อ ๗ การเรียกเก็บเงินตามข้อ ๔ สำหรับนักศึกษาคณะวิศวกรรมศาสตร์ มหาวิทยาลัยยังไม่รวมการจัดเก็บเงินค่าสนับสนุนการจัดการศึกษา (ชำระแรกเข้าครั้งเดียว) จึงกำหนดอัตราการเรียกเก็บเงินค่าสนับสนุนการจัดการศึกษา จำนวน ๑๕,๐๐๐ บาท (หนึ่งหมื่นห้าพันบาทถ้วน)\nข้อ ๘ ให้เรียกเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียน กรณีลงทะเบียนรายวิชาการฝึกประสบการณ์วิชาชีพในสถานประกอบการ รายวิชาสหกิจศึกษา หรือรายวิชาฝึกประสบการณ์การสอนในสถานศึกษา จำนวน ๘,๒๐๐ บาท (แปดพันสองร้อยบาทถ้วน)ทั้งนี้ ให้ยกเว้นการเรียกเก็บค่าธรรมเนียมการศึกษาประจำภาค ได้แก่ ค่าบำรุงห้องสมุด ค่าบริการสารสนเทศ และค่ากิจกรรมนักศึกษา กรณีที่นักศึกษาลงทะเบียนรายวิชาการฝึกประสบการณ์วิชาชีพในสถานประกอบการ รายวิชาสหกิจศึกษา หรือรายวิชาฝึกประสบการณ์การสอนในสถานศึกษา เป็นภาคการศึกษาสุดท้าย และหากยังมิได้ชำระค่าประกันอุบัติเหตุจะต้องชำระค่าธรรมเนียมดังกล่าวด้วย\nข้อ ๙ ให้เรียกเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียน กรณีที่นักศึกษาจากสถาบันการศึกษาอื่นมีความประสงค์จะลงทะเบียนเรียนข้ามสถานศึกษา ตามอัตราการเรียกเก็บเงินค่าบำรุงการศึกษา และค่าลงทะเบียนของคณะที่นักศึกษามาลงทะเบียนเรียน ตามข้อ ๔ และ\nข้อ ๕\nข้อ ๑๐ ให้เรียกเก็บเงินค่าบำรุงการศึกษา ค่าลงทะเบียน กรณีที่บุคคลภายนอกมีความประสงค์ลงทะเบียนเรียน รายวิชา กว. / กบ.ช. ดังนี้\n(๑) ค่าบำรุงการศึกษา ภาคการศึกษาละ ๕,๐๐๐ บาท (ห้าพันบาทถ้วน)\n(๒) ค่าลงทะเบียน หน่วยกิตละ ๓๐๐ บาท (สามร้อยบาทถ้วน)\n(๓) ค่าธรรมเนียมการศึกษา\n(๓.๑) ค่าบำรุงห้องสมุด ภาคการศึกษาละ ๒๐๐ บาท (สองร้อยบาทถ้วน)\n(๓.๒) ค่าบริการสารสนเทศ ภาคการศึกษาละ ๓๐๐ บาท (สามร้อยบาทถ้วน)\nข้อ ๑๑ ค่าธรรมเนียมการศึกษา\n(๑) ค่าใช้จ่ายเรียกเก็บครั้งเดียวเมื่อขึ้นทะเบียนเป็นนักษา\n(๑.๑) ค่าขึ้นทะเบียนเป็นนักศึกษา ๕๐๐ บาท (ห้าร้อยบาทถ้วน)\n(๑.๒) ค่าคู่มือนักศึกษา ๑๕๐บาท(หนึ่งร้อยห้าสิบบาทถ้วน)\n(๑.๓) ค่าตรวจสุขภาพ ๒๐๐ บาท (สองร้อยบาทถ้วน)\n(๑.๔) ค่าประกันของเสียหาย ๑,๐๐๐ บาท (หนึ่งพันบาทถ้วน)\n(ทั้งนี้ นักศึกษาที่ชำระค่าประกันของเสียหายไว้แล้ว จะขอถอนคืนเงินได้เมื่อพ้นสถานภาพนักศึกษาจากการสำเร็จการศึกษา หรือเกณฑ์การวัดและประเมินผล หรือลาออก โดยไม่มีหนี้สินกับมหาวิทยาลัย)\n(๑.๕) ค่าชุดพละ ๕๐๐ บาท (ห้าร้อยบาทถ้วน)\n(๑.๖) ค่าใช้จ่ายอื่น ๆ ประกอบด้วย\n๑) ค่าสมาคมผู้ปกครอง ๕๐๐ บาท (ห้าร้อยบาทถ้วน)\n๒)ค่าปฐมนิเทศนักศึกษาใหม่ ๑,๑๕๐บาท(หนึ่งพันหนึ่งร้อยห้าสิบบาทถ้วน)\n๓) ค่าเสื้อปฐมนิเทศนักศึกษาใหม่ ๑๒๐บาท(หนึ่งร้อยยี่สิบบาทถ้วน)\n(๒) ค่ากิจกรรมนักศึกษา ภาคการศึกษาละ ๕๐๐ บาท (ห้าร้อยบาทถ้วน)ยกเว้นภาคการศึกษาฤดูร้อน\n(๓) ค่าประกันอุบัติเหตุ ปีการศึกษาละ ๓๐๐ บาท (สามร้อยบาทถ้วน)\n(๔) ค่าใบรายงานผลการศึกษา ฉบับละ ๕๐ บาท (ห้าสิบบาทถ้วน)\n(๕) ค่าหนังสือรับรอง ฉบับละ ๕๐ บาท (ห้าสิบบาทถ้วน)\n(๖) ค่าลงทะเบียนเรียนล่าช้ากว่ากำหนด วันละ ๕๐ บาท (ห้าสิบบาทถ้วน)ไม่เกิน ๕๐๐ บาท (ไม่นับวันหยุดราชการ)\n(๗) ค่าลงทะเบียนในการเรียนปรับพื้นฐาน รายวิชาละ ๕๐๐ บาท (ห้าร้อยบาทถ้วน)\n(๘) ค่าเทียบโอนรายวิชา รายวิชาละ ๑๐๐ บาท (หนึ่งร้อยบาทถ้วน)\n(๙)ค่าคืนสภาพกลับเข้าเป็นนักศึกษาใหม่ ภาคการศึกษาละ๓๐๐บาท(สามร้อยบาทถ้วน)\n(๑๐) ค่ารักษาสภาพการเป็นนักศึกษา\n(๑๐.๑) กรณีลาพักการศึกษา ภาคการศึกษาละ ๓๐๐ บาท (สามร้อยบาทถ้วน)\n(๑๐.๒) กรณีลงทะเบียนเรียนครบรายวิชา และอยู่ระหว่างการแก้ไขผลการศึกษาไม่สมบูรณ์ (I) ภาคการศึกษาละ ๓๐๐ บาท (สามร้อยบาทถ้วน)\nประกาศ ณ วันที่ ๒๗ กุมภาพันธ์ พ.ศ. ๒๕๖๙\nลงชื่อ พิชัย จันทร์มณี\n(รองศาสตราจารย์พิชัย จันทร์มณี)\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "comp2561": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง เกณฑ์มาตรฐานความรู้ด้านคอมพิวเตอร์ของนักศึกษาระดับปริญญาตรีพ.ศ. ๒๕๖๑\n-----------------------------------\nโดยที่เป็นการสมควรกำหนดเกณฑ์มาตรฐานความรู้ด้านคอมพิวเตอร์ของนักศึกษาระดับปริญญาตรี จึงออกประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เรื่อง เกณฑ์มาตรฐานความรู้ด้านคอมพิวเตอร์ของนักศึกษาระดับปริญญาตรี พ.ศ. ๒๕๖๑ ไว้ดังต่อไปนี้\nข้อ ๑ ประกาศนี้เรียกว่า \"ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพเรื่องเกณฑ์มาตรฐานความรู้ด้านคอมพิวเตอร์ของนักศึกษาระดับปริญญาตรี พ.ศ. ๒๕๖๑\"\nข้อ ๒ ประกาศนี้ให้ใช้บังคับ ตั้งแต่วันถัดจากวันประกาศเป็นต้นไป\nข้อ ๓ กรณีนักศึกษาระดับปริญญาตรี มีหลักฐานใบรับรองการสอบผ่านมาตรฐาน IC3 Digital Literacy Certification นักศึกษาสามารถยื่นคำร้องขอเทียบโอนผลการศึกษาต่อสำนักส่งเสริมวิชาการและงานทะเบียน เพื่อมิต้องลงทะเบียนเรียนรายวิชาหลักเทคโนโลยีดิจิทัล ๓ (๒-๒-๕) จำนวน ๓ หน่วยกิต\nประกาศ ณ วันที่ ๓ ตุลาคม พ.ศ. ๒๕๖๑\nสุกิจ นิตินัย\n(นายสุกิจ นิตินัย)\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "eng2564": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง เกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรีพ.ศ. ๒๕๖๔\n---------------------------------------\nเพื่อให้การกำหนดเกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี เป็นไปตามมติสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ในการประชุมครั้งที่ ๑๑/๒๕๖๓ เมื่อวันจันทร์ที่ ๒ พฤศจิกายน ๒๕๖๓ สอดคล้องกับประกาศคณะกรรมการการอุดมศึกษา เรื่อง นโยบายการยกระดับมาตรฐานภาษาอังกฤษในสถาบันอุดมศึกษาดังนั้น จึงเห็นควรยกเลิกประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพเรื่อง เกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี พ.ศ. ๒๕๖๓ฉบับลงวันที่ ๒๕ ธันวาคม ๒๕๖๓ และเห็นควรออกประกาศใหม่ ดังต่อไปนี้\nข้อ ๑ ประกาศนี้เรียกว่า \"ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพเรื่อง เกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี พ.ศ.๒๕๖๔\"\nข้อ ๒ ประกาศนี้มีผลบังคับใช้ตั้งแต่วันถัดจากวันประกาศเป็นต้นไป\nข้อ ๓ เกณฑ์มาตรฐานการทดสอบความสามารถภาษาอังกฤษของนักศึกษาระดับปริญญาตรี ดังนี้เกณฑ์มาตรฐาน การทดสอบและค่าธรรมเนียมการสอบ\n(๑) TOEIC (๙๙๐)\nระดับคะแนนไม่น้อยกว่า ๔๐๕ คะแนน\nหรือ\nมหาวิทยาลัยจะดำเนินการจัดสอบให้แก่\nนักศึกษาแบบไม่เรียกเก็บค่าธรรมเนียมการ\nสอบ โดยนักศึกษาที่เข้าทดสอบจะต้องผ่านการ\nอบรมให้ความรู้ที่มหาวิทยาลัยจัดขึ้น ไม่น้อยกว่าร้อยละ ๖๐ ของชั่วโมงการอบรม จึงจะมีสิทธิ์เข้าทดสอบได้ ทั้งนี้ นักศึกษาจะมีสิทธิ์เข้าทดสอบแบบไม่เสียค่าธรรมเนียมการสอบได้ไม่เกิน ๒ ครั้ง\nข้อ ๔ สำหรับนักศึกษาที่เข้าศึกษาในหลักสูตรปรับปรุง หรือหลักสูตรใหม่ ตั้งแต่พ.ศ. ๒๕๖๔ เป็นต้นไป จะต้องเข้ารับการอบรมให้ความรู้และเข้ารับการทดสอบความสามารถทางภาษาอังกฤษที่มหาวิทยาลัยจัดขึ้น หรือสามารถยื่นผลการทดสอบจากศูนย์สอบภายนอกมหาวิทยาลัยโดยผลการทดสอบนั้นจะต้องมีคะแนนเป็นไปตามเกณฑ์มาตรฐานเกณฑ์ใดเกณฑ์หนึ่งตามประกาศนี้ก่อนสำเร็จการศึกษา\nข้อ ๕ ให้อธิการบดีเป็นผู้รักษาการให้เป็นไปตามประกาศนี้ และมีอำนาจออกประกาศเพิ่มเติมเกี่ยวกับแนวปฏิบัติซึ่งไม่ขัดหรือแย้งกับประกาศนี้\nประกาศ ณ วันที่ ๘ กุมภาพันธ์ พ.ศ. ๒๕๖๔\nเกณฑ์มาตรฐาน การทดสอบและค่าธรรมเนียมการสอบ\n(๒) TOEFL (๖๗๗) (Paper-based test)\nระดับคะแนนไม่น้อยกว่า ๔๓๗ คะแนน หรือ\nนักศึกษาสามารถเข้ารับการทดสอบจากศูนย์\nสอบภายนอกมหาวิทยาลัย ซึ่งนักศึกษาจะเป็น\nผู้ชำระค่าธรรมเนียมการสอบเอง ทั้งนี้\nนักศึกษาสามารถนำผลการทดสอบมายื่นกับ\nมหาวิทยาลัยโดยผลการทดสอบที่นำมายื่นต้อง\nมีอายุไม่เกิน ๒ ปีนับจากวันที่เข้ารับการ\nทดสอบ\n(๓) TOEFL (๑๒๐) (Internet-based test)\nระดับคะแนนไม่น้อยกว่า ๔๑ คะแนน หรือ\n(๔) TOEFL (๓๐๐) (Computer-based test)\nระดับคะแนนไม่น้อยกว่า ๑๒๓ คะแนน หรือ\n(๕) IELTS (๙)\nระดับคะแนนไม่น้อยกว่า ๔ คะแนน หรือ\n(๖) CU-TEP (๑๒๐) หรือมาตรฐานเทียบเคียง\nอื่น ระดับคะแนนไม่น้อยกว่า ๖๐ คะแนน\n(๗) มาตรฐานอื่นตามที่มหาวิทยาลัยกำหนด\nโดยมีผลคะแนนตามประกาศของมหาวิทยาลัย\nสมพร ปิยะพันธ์\n(นายสมพร ปิยะพันธ์)\nรักษาราชการแทน\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ", "eng2566": "ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ\nเรื่อง เกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรีพ.ศ. ๒๕๖๖ (ฉบับที่ ๒)\n-------------------------\nเพื่อให้การกำหนดเกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี เป็นไปตามมติสภามหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ ในการประชุมครั้งที่๕/๒๕๖๖ เมื่อวันพุธที่ ๑๐ พฤษภาคม ๒๕๖๖ และสอดคล้องกับประกาศคณะกรรมการการอุดมศึกษา เรื่อง นโยบายการยกระดับมาตรฐานภาษาอังกฤษในสถาบันอุดมศึกษาดังนั้น จึงเห็นควรปรับปรุงเกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี ดังต่อไปนี้\nข้อ ๑ ประกาศนี้เรียกว่า \"ประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เรื่องเกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรี พ.ศ. ๒๕๖๖\n(ฉบับที่ ๒)\"\nข้อ ๒ ประกาศนี้มีผลบังคับใช้ตั้งแต่วันถัดจากวันประกาศเป็นต้นไป\nข้อ ๓ ให้ยกเลิกความในข้อ ๓ (๒) แห่งประกาศมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ เรื่อง เกณฑ์มาตรฐานความสามารถทางภาษาอังกฤษของนักศึกษาระดับปริญญาตรีพ.ศ. ๒๕๖๔ ลงวันที่ ๘ กุมภาพันธ์ พ.ศ. ๒๕๖๔ และให้ใช้ข้อความต่อไปนี้แทนเกณฑ์มาตรฐาน การทดสอบและค่าธรรมเนียมการสอบ\n(๒) TOEFL ITP (๖๗๗)\nระดับคะแนนไม่น้อยกว่า ๔๓๗\nคะแนน\nนักศึกษาสามารถเข้ารับการทดสอบจากศูนย์\nสอบภายนอกมหาวิทยาลัย ซึ่งนักศึกษาจะเป็น\nผู้ชำระค่าธรรมเนียมการสอบเอง ทั้งนี้\nนักศึกษาสามารถนำผลการทดสอบมายื่นกับ\nมหาวิทยาลัยโดยผลการทดสอบที่นำมายื่นต้อง\nมีอายุไม่เกิน ๒ ปีนับจากวันที่เข้ารับการ\nทดสอบ\nประกาศ ณ วันที่ ๑๕ มิถุนายน พ.ศ. ๒๕๖๖\nพิชัย จันทร์มณี\n(รองศาสตราจารย์พิชัย จันทร์มณี)\nอธิการบดีมหาวิทยาลัยเทคโนโลยีราชมงคลกรุงเทพ"};

  note:"การปรับใช้กับหลักสูตรนี้: ประกาศนี้ใช้กับการเรียนสองปริญญาพร้อมกัน ส่วนแผนปริญญาตรีใบที่ 2 รับผู้ที่จบปริญญาแรกแล้วและเรียนหลักสูตรนี้หลักสูตรเดียว จึงอ้างระเบียบเทียบโอนผลการเรียน 2564 และกฎกระทรวงมาตรฐานหลักสูตร 2565 ข้อ 14–15 ไม่ต้องทำตามเกณฑ์ 150 หน่วยกิต ถ้าต้องการเปิดหลักสูตรควบในอนาคต (เช่น วศ.บ. วิศวกรรมเครื่องกล ควบกับหลักสูตรอื่นของ มทร.กรุงเทพ) ต้องมีอีกหลักสูตรเปิดอยู่แล้ว กำหนดวิชาร่วมและวิชาเฉพาะ รวมไม่น้อยกว่า 150 หน่วยกิต และให้มหาวิทยาลัยออกประกาศตามข้อ 6"},

function sbErr(e){const m=(e&&(e.message||e.msg))||String(e);return {code:/row-level security|permission|42501/i.test(m+(e&&e.code||""))?"invalid_argument":"error",message:m}}
function makeSbDb(){
  const listeners=[];let cache={};let loaded=false;
  async function refresh(){
    const {data,error}=await sb.from("kv").select("collection,id,data");
    if(error){state.msg="โหลดข้อมูลไม่สำเร็จ: "+error.message;render();return}
    const c={};data.forEach(r=>{(c[r.collection]=c[r.collection]||{})[r.id]=r.data});cache=c;loaded=true;listeners.forEach(l=>l());
  }
  const snapDoc=path=>{const [c,id]=path.split("/");const d=(cache[c]||{})[id];return {exists:!!d,data:()=>d}};
  const snapCol=c=>({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  const sub=f=>{listeners.push(f);if(loaded)f()};
  sb.channel("kv-live").on("postgres_changes",{event:"*",schema:"public",table:"kv"},p=>{
    const r=p.new&&p.new.collection?p.new:p.old;if(!r||!r.collection)return;
    if(p.eventType==="DELETE"){if(cache[r.collection])delete cache[r.collection][r.id]}else (cache[r.collection]=cache[r.collection]||{})[r.id]=p.new.data;
    listeners.forEach(l=>l());
  }).subscribe();
  return {
    refresh,
    doc:path=>{const [c,id]=path.split("/");return {
      set:async d=>{const {error}=await sb.from("kv").upsert({collection:c,id,data:d});if(error)throw sbErr(error);(cache[c]=cache[c]||{})[id]=d;listeners.forEach(l=>l())},
      delete:async()=>{const {error}=await sb.from("kv").delete().match({collection:c,id});if(error)throw sbErr(error);if(cache[c])delete cache[c][id];listeners.forEach(l=>l())},
      onSnapshot:cb=>sub(()=>cb(snapDoc(path)))}},
    collection:c=>({onSnapshot:cb=>sub(()=>cb(snapCol(c)))})
  };
}

  document.getElementById("googleLogin").onclick=async()=>{
    const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{hd:"mail.rmutk.ac.th",prompt:"select_account"}}});
    if(error)loginScreen(error.message);
  };
}
(async()=>{
  if(!window.supabase||!SB.url||!SB.anonKey){state.msg="ยังไม่ได้ตั้งค่า Supabase ในไฟล์ config.js";render();return}
  sb=window.supabase.createClient(SB.url,SB.anonKey);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen();return}
  const email=(session.user.email||"").toLowerCase();
  if(!email.endsWith("@mail.rmutk.ac.th")){await sb.auth.signOut();loginScreen("บัญชี "+email+" ไม่ใช่บัญชีมหาวิทยาลัย กรุณาใช้ @mail.rmutk.ac.th");return}
  const {data:adm}=await sb.rpc("is_admin");
  state.user={email};state.isAdmin=!!adm;state.canWrite=!!adm;
  const db=makeSbDb();state.db=db;const err=()=>{};
  try{const k="mecp_lastlog",t=+localStorage.getItem(k)||0;if(Date.now()-t>30*60*1000){sb.rpc("log_access").then(r=>{if(!r.error)localStorage.setItem(k,String(Date.now()))})}}catch(x){sb.rpc("log_access")}
  if(state.isAdmin)window.__adminActivity=async()=>{
    const [l,a]=await Promise.all([sb.from("access_log").select("email,at").order("at",{ascending:false}).limit(3000),
      sb.from("audit_log").select("email,at,doc_id,code:data->>code").eq("collection","clo").order("at",{ascending:false}).limit(3000)]);
    if(l.error)throw new Error("access_log: "+l.error.message);if(a.error)throw new Error("audit_log: "+a.error.message);
    return {logins:l.data||[],edits:a.data||[]}};
  window.__claimFaculty=async id=>{const {data,error}=await sb.rpc("claim_faculty",{p_id:id});if(error)throw new Error(error.message);await db.refresh();return !!data};
  db.collection("faculty").onSnapshot(s=>{state.faculty=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    const me=state.faculty.find(f=>(f.email||"").toLowerCase()===email);if(me&&!state.isAdmin){state.me=me.id;state.cloMine=true}else if(me&&!state.me)state.me=me.id;softRender()},err);
  ["S1","S2","SS"].forEach(k=>db.doc("assign/"+k).onSnapshot(s=>{const d=s.exists?s.data():{};state.assign[k]=aliasKeys(d.map,d.cv===5);softRender()},err));
  db.collection("needs").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=upgradeNeed(d.data());if(x&&x.id)m[x.id]=x});state.needsOv=m;softRender()},err);
  db.collection("clo").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const r=d.data(),x=upgradeClo(r);if(x&&x.code&&!(m[x.code]&&m[x.code].__new))m[x.code]={...x,__new:r&&r.sv===5}});state.cloOv=m;softRender()},err);
  db.doc("owners/map").onSnapshot(s=>{const d=s.exists?s.data():{};state.owners=aliasKeys(d.map,d.cv===5);softRender()},err);
  db.doc("owners/ext").onSnapshot(s=>{state.extOwners=aliasKeys((s.exists&&s.data().map)||{},true);softRender()},err);
  db.collection("cv").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=x});state.cv=m;softRender()},err);
  db.collection("survey").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.rows)m[d.id]=x});state.survey=m;softRender()},err);
  db.doc("program/intake").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.ME!=null)state.intake={ME:+d.ME||0,EV:+d.EV||0,CE:+d.CE||0};softRender()},err);
  db.doc("program/bookedit").onSnapshot(s=>{const d=s.exists&&s.data();state.bookEdit=d?{logo:d.logo||"",logoH:d.logoH,f:d.f||{},html:d.html||{}}:null;softRender()},err);
  db.doc("program/bookfmt").onSnapshot(s=>{const d=s.exists&&s.data();state.bookFmt=d?{font:d.font,body:d.body,table:d.table,line:d.line,mL:d.mL,mR:d.mR,mT:d.mT,mB:d.mB,pAfter:d.pAfter,hBefore:d.hBefore,cGap:d.cGap,sec:d.sec||{}}:null;softRender()},err);
  db.doc("program/bookplan").onSnapshot(s=>{const d=s.exists&&s.data();state.bookPlan=d?{deadline:d.deadline,review:d.review,note:d.note}:null;softRender()},err);
  db.doc("program/bookcheck").onSnapshot(s=>{const d=s.exists&&s.data();const m={...(d||{})};delete m.updatedAt;state.bookCheck=m;softRender()},err);
  db.doc("program/regs").onSnapshot(s=>{const d=s.exists&&s.data();state.regs={items:(d&&d.items)||[],notes:(d&&d.notes)||{}};const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.regnote!==undefined)return;softRender()},err);
  db.doc("program/transition").onSnapshot(s=>{const d=s.exists&&s.data();if(d){const sel=state.tx&&state.tx.sel;state.tx={...d,sel};delete state.tx.updatedAt}softRender()},err);
  db.doc("program/team").onSnapshot(s=>{const d=s.exists&&s.data();state.team={role:(d&&d.role)||{},qual:(d&&d.qual)||{}};softRender()},err);
  db.collection("photo").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.fid&&x.img)m[x.fid]=x.img});state.photos=m;softRender()},err);
  db.collection("courses").onSnapshot(s=>{const m={};s.docs.forEach(d=>{const r=d.data(),x=aliasCourse(r);if(x&&x.code&&!(m[x.code]&&m[x.code].__new))m[x.code]={...x,__new:r&&r.cv===5}});state.courseOv=m;rebuild();buildExpected();softRender()},err);
  db.doc("program/plos").onSnapshot(s=>{applyPloDoc(s.exists&&s.data());rebuild();softRender()},err);
  await db.refresh();
  const isFac=state.faculty.some(f=>(f.email||"").toLowerCase()===email);
  if(!state.isAdmin&&!isFac)state.msg="ท่านเปิดดูได้อย่างเดียว ถ้าเป็นผู้สอน ให้กรรมการหลักสูตรเพิ่มอีเมลของท่านในรายชื่ออาจารย์";
  render();
  const bar=document.createElement("div");bar.className="row small muted userbar";bar.style.cssText="margin-left:auto;gap:8px;flex:none";
  bar.innerHTML=`<span>${esc(email)} · ${state.isAdmin?"กรรมการหลักสูตร":isFac?"ผู้สอน":"ผู้เยี่ยมชม"}</span><button class="sm" id="logout">ออกจากระบบ</button>`;
  document.querySelector("header.top").appendChild(bar);
  document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")location.reload()});
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
